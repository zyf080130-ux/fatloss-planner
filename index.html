<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>循证减脂计划 · BMI / 体脂 / 食谱 / 打卡</title>
<meta name="description" content="根据身高体重与体脂率生成循证减脂计划：三档减脂速度、纯饮食或健身两条路线、基于现有食材的一日三餐食谱、乒乓球与健身房消耗计入每日计划、体重趋势与平台期判断。完全离线可用。">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="减脂计划">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
/* =====================================================================
 * 样式 styles.css —— 深色专业风（默认），可切换浅色，手机端自适应，带打印样式。
 * 变量集中在 :root，颜色语义化，图表里的颜色与之对应。
 * ===================================================================== */

:root {
  --bg: #0b1220;
  --bg-2: #121b2e;
  --bg-3: #1a2439;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.18);
  --text: #e8edf7;
  --text-dim: rgba(232, 237, 247, 0.62);
  --text-faint: rgba(232, 237, 247, 0.42);
  --accent: #22d3ee;
  --accent-2: #4ade80;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --c-protein: #60a5fa;
  --c-fat: #f59e0b;
  --c-carb: #4ade80;
  --c-fiber: #a78bfa;
  --c-weight: #4ade80;
  --c-weight-raw: rgba(74, 222, 128, 0.35);
  --c-project: rgba(255, 255, 255, 0.5);
  --c-target: #f472b6;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
}

html[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-2: #ffffff;
  --bg-3: #eef2f9;
  --line: rgba(16, 24, 40, 0.10);
  --line-strong: rgba(16, 24, 40, 0.2);
  --text: #162033;
  --text-dim: rgba(22, 32, 51, 0.66);
  --text-faint: rgba(22, 32, 51, 0.45);
  --shadow: 0 6px 20px rgba(16, 24, 40, 0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

body {
  background-image: radial-gradient(1100px 500px at 50% -8%, rgba(34, 211, 238, 0.09), transparent 70%);
  padding-bottom: 84px;
}

#app { max-width: 1180px; margin: 0 auto; padding: 0 14px; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.3; }
h3 { font-size: 1.02rem; }
h4 { font-size: 0.95rem; }
p { margin: 0 0 10px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.86em; }
.hidden { display: none !important; }
.muted { color: var(--text-dim); }
.small { font-size: 0.82rem; }
.tiny { font-size: 0.74rem; }
.ok-text { color: var(--ok); }
.bad-text { color: var(--bad); }
.big-number { font-size: 1.6rem; font-weight: 700; }
.big-number small { font-size: 0.8rem; font-weight: 400; color: var(--text-dim); }

/* ------------------------------- 顶部 ------------------------------- */
.app-head {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 4px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { font-size: 1.5rem; }
.brand strong { display: block; font-size: 1.02rem; }
.brand .small { display: block; line-height: 1.2; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid transparent; color: var(--text-dim);
  padding: 7px 11px; border-radius: 999px; cursor: pointer; font-size: 0.86rem; font-family: var(--font);
}
.tab:hover { background: var(--bg-3); color: var(--text); }
.tab.on { background: var(--bg-3); border-color: var(--line-strong); color: var(--text); font-weight: 600; }
.head-right { display: flex; gap: 8px; align-items: center; }

.bottom-nav { display: none; }

/* ------------------------------- 卡片 ------------------------------- */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
}
.card-body { padding: 15px 16px; }
.card-foot { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--text-dim); font-size: 0.84rem; }

.stack > .card:last-child { margin-bottom: 0; }
.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ------------------------------ 表单 ------------------------------ */
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 0.82rem; color: var(--text-dim); }
input, select, textarea {
  width: 100%; padding: 9px 11px; font-size: 0.94rem; font-family: var(--font);
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
textarea { resize: vertical; }
.field-hint { font-size: 0.74rem; color: var(--text-faint); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px; cursor: pointer; user-select: none;
  background: var(--bg-3); border: 1px solid var(--line); color: var(--text-dim); font-size: 0.84rem;
  font-family: var(--font);
}
.chip input { display: none; }
.chip.on { background: color-mix(in srgb, var(--accent) 18%, var(--bg-3)); border-color: var(--accent); color: var(--text); font-weight: 600; }
.chip b { color: var(--bad); }

.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.btn {
  padding: 9px 15px; border-radius: var(--radius-sm); cursor: pointer;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--line-strong);
  font-size: 0.9rem; font-family: var(--font); transition: transform 0.05s ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, var(--accent), #0ea5b7); color: #04202a; border-color: transparent; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.tiny { padding: 4px 9px; font-size: 0.78rem; }
.sticky-actions { position: sticky; bottom: 8px; padding: 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }

.switch { display: inline-flex; align-items: center; gap: 7px; font-size: 0.86rem; color: var(--text-dim); cursor: pointer; }
.switch input { width: auto; }

.speed-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.speed-card {
  display: flex; flex-direction: column; gap: 6px; padding: 12px; cursor: pointer;
  background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--text-dim);
}
.speed-card input { display: none; }
.speed-card strong { color: var(--text); font-size: 0.9rem; }
.speed-card.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg-3)); }

details.sub { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 8px; background: var(--bg-3); }
details.sub > summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.sub-body { padding-top: 10px; }
.mini-title { font-size: 0.84rem; color: var(--text-dim); margin: 12px 0 6px; font-weight: 600; }

/* ------------------------------ 统计 ------------------------------ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 13px;
}
.stat-value { font-size: 1.45rem; font-weight: 700; line-height: 1.15; }
.stat-unit { font-size: 0.72rem; font-weight: 500; color: var(--text-dim); margin-left: 3px; }
.stat-label { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
.stat-hint { font-size: 0.72rem; color: var(--text-faint); margin-top: 3px; }
.tone-ok .stat-value { color: var(--ok); }
.tone-warn .stat-value { color: var(--warn); }
.tone-bad .stat-value { color: var(--bad); }
.targets { margin-top: 12px; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: none; }
.kv-label { color: var(--text-dim); font-size: 0.88rem; }
.kv-value { text-align: right; font-size: 0.94rem; }
.kv-hint { grid-column: 1 / -1; font-size: 0.76rem; color: var(--text-faint); }
.explain .kv-value strong { font-size: 1.05rem; }

.pbar { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.09); overflow: hidden; margin-top: 6px; }
html[data-theme="light"] .pbar { background: rgba(16, 24, 40, 0.1); }
.pbar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s ease; }
.macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.macro-head { display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--text-dim); }
.macro-head .over { color: var(--warn); font-weight: 600; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.74rem;
  background: var(--bg-3); border: 1px solid var(--line-strong); color: var(--text-dim);
}
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }

.warn-list { margin: 0; padding-left: 18px; }
.warn-list li { margin-bottom: 6px; font-size: 0.88rem; }
.warn-list.danger li::marker { color: var(--bad); }
.warn-list.warn li::marker { color: var(--warn); }
.note-block { background: var(--bg-3); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 11px 13px; margin-top: 10px; font-size: 0.88rem; }
.note-block.danger { border-left-color: var(--bad); }
.note-block.warn { border-left-color: var(--warn); }
.plain-list { margin: 6px 0 10px; padding-left: 20px; }
.plain-list li { margin-bottom: 6px; font-size: 0.88rem; }
.cites { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.cites-label { font-size: 0.74rem; color: var(--text-faint); }
.cite {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent);
}

/* ------------------------------ 周计划 ------------------------------ */
.week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 12px; }
.day-card { background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; }
.day-card.type-gym { border-top: 3px solid var(--accent); }
.day-card.type-tabletennis { border-top: 3px solid var(--ok); }
.day-card.type-dorm { border-top: 3px solid var(--warn); }
.day-head { display: flex; justify-content: space-between; align-items: center; }
.day-title { font-weight: 600; margin: 6px 0 4px; font-size: 0.92rem; }
.block-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.block-list li { font-size: 0.82rem; padding-left: 9px; border-left: 2px solid var(--line-strong); }
.block-name { font-weight: 600; }
.block-spec { display: block; color: var(--accent); font-size: 0.78rem; }
.block-cue { display: block; color: var(--text-faint); font-size: 0.76rem; }
.block-sub { display: block; color: var(--warn); font-size: 0.76rem; }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { display: flex; gap: 9px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 0.9rem; }
.checklist .tag { flex: none; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--line); color: var(--text-dim); }

/* ------------------------------ 食谱 ------------------------------ */
.menu-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.menu-targets { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.84rem; color: var(--text-dim); }
.menu-targets strong { color: var(--text); }
.menu-total { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 14px 0; padding: 12px; background: var(--bg-3); border-radius: var(--radius-sm); }
.menu-total > div:first-child { flex: 1; min-width: 200px; }
.donut-wrap canvas { width: 150px; height: 150px; }
.meal-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; background: var(--bg-3); }
.meal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.meal-head h4 { margin: 0; }
.meal-head .btn { margin-left: auto; }
.food-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.food-table th { text-align: left; font-weight: 600; color: var(--text-dim); font-size: 0.78rem; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.food-table td { padding: 6px 8px; border-bottom: 1px dashed var(--line); }
.food-table .total-row td { font-weight: 700; border-top: 1px solid var(--line-strong); border-bottom: none; }
.gram-input { width: 74px; display: inline-block; padding: 4px 7px; font-size: 0.84rem; }
.search-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.search-row input[type="text"] { flex: 1; min-width: 190px; }
.search-row select, .search-row input[type="number"] { width: auto; }
.search-results { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.search-item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--radius-sm); flex-wrap: wrap; }
.si-main { display: flex; flex-direction: column; min-width: 180px; }
.si-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.browse { margin-top: 10px; max-height: 460px; overflow: auto; }
.meal-log { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 10px; }
.meal-log-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
.shop-cat { margin-top: 8px; }

/* ------------------------------ 图表 ------------------------------ */
.chart-wrap { width: 100%; margin: 6px 0 4px; }
.chart-wrap canvas { width: 100%; display: block; height: 220px; }
.chart-wrap.tall canvas { height: 300px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; }

/* ------------------------------ 依据页 ------------------------------ */
.ev-topic { margin-bottom: 16px; }
.ev-list { list-style: none; padding: 0; margin: 0; }
.ev-list li { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ev-list a { font-weight: 600; font-size: 0.9rem; }
.ev-meta { font-size: 0.76rem; color: var(--text-faint); margin-top: 3px; }
.ev-meta.key { color: var(--text-dim); }

.profile-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.custom-food-form h4 { margin-bottom: 10px; }

/* ------------------------------ 提示 ------------------------------ */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: var(--bg-3); border: 1px solid var(--line-strong); color: var(--text);
  padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); z-index: 90; font-size: 0.88rem;
  max-width: min(92vw, 520px); text-align: center;
}
.toast.ok { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.toast.bad { border-color: color-mix(in srgb, var(--bad) 60%, transparent); }

/* ------------------------------ 手机端 ------------------------------ */
@media (max-width: 820px) {
  body { padding-bottom: 92px; font-size: 15px; }
  #app { padding: 0 10px; }
  .app-head { padding: 10px 2px 8px; }
  .tabs { display: none; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .speed-picker { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .week-grid { grid-template-columns: 1fr; }
  .food-table { display: block; overflow-x: auto; white-space: nowrap; }
  .menu-head { flex-direction: column; align-items: stretch; }
  .meal-head .btn { margin-left: 0; }
  .donut-wrap canvas { width: 130px; height: 130px; }

  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 80;
    background: color-mix(in srgb, var(--bg-2) 96%, transparent);
    border-top: 1px solid var(--line); padding: 6px 2px 8px;
    justify-content: space-around; backdrop-filter: blur(10px);
  }
  .bnav {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: none; border: none; color: var(--text-faint); font-family: var(--font);
    font-size: 0.68rem; padding: 3px 5px; cursor: pointer; flex: 1;
  }
  .bnav span { font-size: 1.05rem; }
  .bnav.on { color: var(--accent); font-weight: 700; }
  .toast { bottom: 104px; }
}

@media (max-width: 420px) {
  .stats { grid-template-columns: 1fr; }
  .stat-value { font-size: 1.3rem; }
}

/* ------------------------------ 打印 ------------------------------ */
@media print {
  :root { --bg: #fff; --bg-2: #fff; --bg-3: #fff; --text: #111; --text-dim: #444; --line: #ddd; --line-strong: #999; }
  body { background: none; padding: 0; }
  .app-head, .bottom-nav, .actions, .toast, .search-row, .browse, .search-results, details.sub { display: none !important; }
  .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  .cite { color: #055; }
  .food-table { font-size: 11px; }
}

</style>
</head>

<script>

rified":false,"confidence":"low","sourceUrl":null},{"id":"misc_housework_heavy","name":"家务（拖地/擦窗等较重家务）","met":4,"category":"日常活动","code":null,"note":"拖地、擦窗、擦洗等较重家务；汇编同类档约 3.5–4.3，取 4.0，属估计值。","verified":false,"confidence":"low","sourceUrl":null},{"id":"misc_shopping_walk","name":"买菜购物步行","met":2.3,"category":"日常活动","code":null,"note":"推车或提袋步行购物、走走停停；未核实到原始行，按汇编购物档约 2.3 填写，属估计值。","verified":false,"confidence":"low","sourceUrl":null},{"id":"misc_aerobics","name":"跳操/健身操（中高强度）","met":7.3,"category":"健身操","code":null,"note":"有氧操高冲击、持续跑跳；未核实到原始行，按汇编高冲击有氧操常用值 7.3 填写，属估计值。","verified":false,"confidence":"low","sourceUrl":null},{"id":"misc_spinning","name":"动感单车（室内骑行中高强度）","met":8.5,"category":"骑行","code":null,"note":"室内动感单车中等阻力持续踩踏；固定单车 90–100 W 为 6.0、151–199 W 为 10.3，此处取 8.5，属估计值。","verified":false,"confidence":"low","sourceUrl":null}],"oneMETkcalPerKgHour":1,"cookingMethods":[{"name":"水煮","addedOilGPer100g":0,"kcalMultiplier":1,"note":"纯水汆煮、白水煮，不额外加油；吸油量为 0，是减脂期最推荐的烹饪方式（估算）。"},{"name":"清蒸","addedOilGPer100g":0,"kcalMultiplier":1,"note":"只靠蒸汽加热，通常出锅淋少量豉油；若淋了热油请按「一勺约10克」另行加上。吸油量按 0 估算。"},{"name":"白灼","addedOilGPer100g":0.8,"kcalMultiplier":1.05,"note":"沸水快焯后配少量豉油/葱油。广式白灼常淋一勺热油（约 8–10 克/500 克食材），折合约 0.8 克/100 克（估算）。"},{"name":"凉拌","addedOilGPer100g":3,"kcalMultiplier":1.18,"note":"通常拌入香油/辣油 5–15 克/300 克食材，折合约 2–5 克/100 克；叶菜吸油少、粉丝/木耳吸油多。以 3 克/100 克估算。"},{"name":"清炒","addedOilGPer100g":4,"kcalMultiplier":1.24,"note":"家庭/食堂少油快炒，锅底油约 15–20 克/400 克成品，折合约 4 克/100 克（估算）。"},{"name":"家常炒","addedOilGPer100g":6,"kcalMultiplier":1.36,"note":"常规家常炒菜，含爆香用油与二次补油，约 25–30 克油/450 克成品，折合约 6 克/100 克（估算）。"},{"name":"红烧","addedOilGPer100g":6,"kcalMultiplier":1.45,"note":"先煎/煸再加油、糖、酱油焖烧。除约 6 克/100 克吸油外，还含糖 3–8 克/100 克（约 12–32 千卡），故倍数高于「家常炒」（估算）。"},{"name":"油炸","addedOilGPer100g":12,"kcalMultiplier":1.72,"note":"挂糊/裹粉油炸，面衣与食材合计吸油约 8–18 克/100 克；蔬菜类油炸吸油更多（可达 20 克/100 克）。以 12 克/100 克估算，属减脂期应尽量避免的做法。"},{"name":"空气炸","addedOilGPer100g":2,"kcalMultiplier":1.12,"note":"仅表面刷/喷一层油（约 2–4 克/100 克），无需浸没油炸；比油炸少约 8–10 克油/100 克（估算）。"},{"name":"烤箱","addedOilGPer100g":3,"kcalMultiplier":1.18,"note":"烤箱烘烤通常刷油防粘（约 2–4 克/100 克）；若同时刷蜂蜜/烧烤酱需另计糖分（估算）。"},{"name":"烧烤","addedOilGPer100g":3.5,"kcalMultiplier":1.22,"note":"炭烤/铁板烤，边烤边刷油与酱料，约 3–4 克油/100 克，另加腌料糖分；肉类的滴油损失未计入（估算）。"},{"name":"火锅","addedOilGPer100g":10,"kcalMultiplier":1.6,"note":"涮煮后食材表面带出汤底油脂，麻辣/牛油锅底可达 8–15 克/100 克；蘸料（麻酱、香油碟）热量另计，一碗麻酱约 150–200 千卡（估算）。"},{"name":"炖煮","addedOilGPer100g":2,"kcalMultiplier":1.12,"note":"先少量油煸炒再加水慢炖，或直接清炖。食材本身出油入汤，实际摄入取决于是否喝汤；以 2 克/100 克估算，喝汤需按汤底油脂另计。"}]},"evidence":[{"id":"hall2011lancet","topic":"能量平衡模型 / 体重变化预测","claim":"体重对能量摄入变化的响应很慢（半衰期约 1 年），且随体重下降总能量消耗同步降低；因此按固定热量缺口做线性外推会高估长期减重效果，必须用动态能量平衡模型预测。","citation":"Hall KD, Sacks G, Chandramohan D, Chow CC, Wang YC, Gortmaker SL, Swinburn BA. Quantification of the effect of energy imbalance on bodyweight. Lancet. 2011;378(9793):826-837.","doi":"10.1016/S0140-6736(11)60812-X","url":"https://pubmed.ncbi.nlm.nih.gov/21872751/","evidenceLevel":"Mechanistic modeling","keyNumbers":"体重对能量摄入变化的响应半衰期约 1 年；初始体脂越多者在同样能量摄入变化下预期减重更多、但达到新稳态所需时间更长；造成美国成人肥胖流行的平均每日能量失衡仅约 30 kJ/d，而为维持已增加体重所需的能量摄入增量（维持能量缺口）约 0.9 MJ/d","usedFor":["计划生成","平台期判断","预期管理"]},{"id":"mifflin1990ajcn","topic":"基础代谢预测公式","claim":"Mifflin-St Jeor 公式由 498 名 19-78 岁非肥胖与肥胖成人的间接测热实测静息能量消耗推导而来，是临床最常用的 REE 预测公式之一；去脂体重是 REE 的最佳单一预测因子。","citation":"Mifflin MD, St Jeor ST, Hill LA, Scott BJ, Daugherty SA, Koh YO. A new predictive equation for resting energy expenditure in healthy individuals. Am J Clin Nutr. 1990;51(2):241-247.","doi":"10.1093/ajcn/51.2.241","url":"https://pubmed.ncbi.nlm.nih.gov/2305711/","evidenceLevel":"Cohort","keyNumbers":"男：REE = 10×体重(kg) + 6.25×身高(cm) − 5×年龄(y) + 5；女：REE = 10×体重(kg) + 6.25×身高(cm) − 5×年龄(y) − 161（kcal/d，R²=0.71）；FFM 单变量 R²=0.64，REE = 19.7×FFM + 413；体重单变量 R²=0.56，REE = 15.1×体重 + 371；Harris-Benedict 公式平均高估实测 REE 约 5%","usedFor":["BMR 估算","计划生成","热量缺口计算"]},{"id":"frankenfield2005jada","topic":"基础代谢预测公式的有效性","claim":"系统评价显示，在非肥胖与肥胖成人中 Mifflin-St Jeor 公式预测静息代谢率落在实测值 ±10% 以内的比例高于 Harris-Benedict、Owen、WHO/FAO/UNU 等常用公式，且误差范围最窄；但个体层面误差仍不可忽略。","citation":"Frankenfield D, Roth-Yousey L, Compher C. Comparison of predictive equations for resting metabolic rate in healthy nonobese and obese adults: a systematic review. J Am Diet Assoc. 2005;105(5):775-789.","doi":"10.1016/j.jada.2005.02.005","url":"https://pubmed.ncbi.nlm.nih.gov/15883556/","evidenceLevel":"Systematic review","keyNumbers":"Mifflin-St Jeor 公式预测 RMR 落在实测值 ±10% 以内的受试者比例高于其他公式，误差范围最窄；老年人及美国少数族裔在公式推导与验证研究中代表性不足；WHO/FAO/UNU 公式缺少针对个体误差的验证研究","usedFor":["BMR 估算","计划生成","风险提示"]},{"id":"cunningham1980ajcn","topic":"去脂体重基础代谢公式","claim":"基于 Harris-Benedict 1919 年 223 名受试者数据的再分析显示，去脂体重（LBM）是基础代谢率的单一最佳预测因子，性别与年龄的额外解释力很小；这一“以去脂体重为自变量”的思路是 Katch-McArdle 等公式的共同基础。","citation":"Cunningham JJ. A reanalysis of the factors influencing basal metabolic rate in normal adults. Am J Clin Nutr. 1980;33(11):2372-2374.","doi":"10.1093/ajcn/33.11.2372","url":"https://pubmed.ncbi.nlm.nih.gov/7435418/","evidenceLevel":"Cohort","keyNumbers":"BMR(kcal/d) = 500 + 22 × 去脂体重(kg)；性别与年龄在该模型中的额外贡献很小；样本为 Harris-Benedict 1919 研究的 223 名受试者","usedFor":["BMR 估算","体脂率估算","计划生成"]},{"id":"deurenberg1991bjn","topic":"BMI 与体脂率的关系","claim":"BMI 与体脂率之间存在可量化的经验关系，但回归中必须纳入年龄与性别；该公式对肥胖者会略微高估体脂率，个体预测误差（SEE 约 4%）与皮褶法、生物电阻抗法相当。","citation":"Deurenberg P, Weststrate JA, Seidell JC. Body mass index as a measure of body fatness: age- and sex-specific prediction formulas. Br J Nutr. 1991;65(2):105-114.","doi":"10.1079/BJN19910073","url":"https://pubmed.ncbi.nlm.nih.gov/2043597/","evidenceLevel":"Cohort","keyNumbers":"成人：BF% = 1.20×BMI + 0.23×年龄 − 10.8×性别(男=1, 女=0) − 5.4（R²=0.79，SEE=4.1% BF）；≤15 岁儿童另式：BF% = 1.51×BMI − 0.70×年龄 − 3.6×性别 + 1.4（R²=0.38，SEE=4.4%）；样本 1229 人（男 521、女 708），BMI 13.9-40.9 kg/m²，年龄 7-83 岁","usedFor":["体脂率估算","BMI 判定","计划生成"]},{"id":"ode2007msse","topic":"BMI 在运动人群中的误判","claim":"在大学运动员与非运动员中，以 BMI≥25 判定超重的敏感性高但特异性低，会把大量肌肉量高的运动员误判为超重/肥胖；不同人群的最优 BMI 切点差异很大，BMI 用于运动人群的体脂分类必须谨慎。","citation":"Ode JJ, Pivarnik JM, Reeves MJ, Knous JL. Body mass index as a predictor of percent fat in college athletes and nonathletes. Med Sci Sports Exerc. 2007;39(3):403-409.","doi":"10.1249/01.mss.0000247008.19127.3e","url":"https://pubmed.ncbi.nlm.nih.gov/17473765/","evidenceLevel":"Cohort","keyNumbers":"226 名大学生运动员与 213 名非运动员；男性运动员/男性非运动员/女性运动员以 BMI≥25 判定超重的敏感性 0.83-1.0 但特异性仅 0.27-0.66（美式橄榄球锋线球员敏感性 1.0）；女性非运动员敏感性 0.56、特异性 0.90；判定体脂过高的最优 BMI 切点分别为男运动员 27.9、锋线球员 34.1、男非运动员 26.5、女运动员 27.7、女非运动员 24.0 kg/m²","usedFor":["BMI 判定","体脂率估算","风险提示"]},{"id":"westerterp2013frontphysiol","topic":"每日总能耗与活动系数（PAL）","claim":"体力活动水平（PAL = 总能量消耗 / 静息能量消耗）是可比较的、无量纲的活动系数；自由生活成人的 PAL 有一个生理上限，不能靠无限增加活动量无限提高每日总能耗，因此用固定活动系数估算 TDEE 时必须限定在合理区间。","citation":"Westerterp KR. Physical activity and physical activity induced energy expenditure in humans: measurement, determinants, and effects. Front Physiol. 2013;4:90.","doi":"10.3389/fphys.2013.00090","url":"https://pubmed.ncbi.nlm.nih.gov/23637685/","evidenceLevel":"Narrative review","keyNumbers":"可持续生活方式的 PAL 下限约 1.1-1.2、上限约 2.0-2.5；平均 PAL 由 1 岁约 1.4 升至生育年龄 1.7-1.8，90 岁再降至约 1.4；职业耐力运动员 PAL 可达约 4.0；PAL 的个体差异大部分可归因于体质倾向","usedFor":["TDEE 估算","有氧处方","计划生成"]},{"id":"helms2014jissn","topic":"减脂速度的安全性区间","claim":"为最大化保留肌肉，自然健美备赛期建议把热量摄入设定在使体重每周下降约 0.5-1% 的水平；更快的减重速度会牺牲瘦体重。","citation":"Helms ER, Aragon AA, Fitschen PJ. Evidence-based recommendations for natural bodybuilding contest preparation: nutrition and supplementation. J Int Soc Sports Nutr. 2014;11:20.","doi":"10.1186/1550-2783-11-20","url":"https://pubmed.ncbi.nlm.nih.gov/24864135/","evidenceLevel":"Narrative review","keyNumbers":"推荐每周减重约 0.5-1% 体重；蛋白质 2.3-3.1 g/kg 去脂体重/d；脂肪供能 15-30%，其余由碳水提供；每日 3-6 餐，训练前后各摄入 0.4-0.5 g/kg 体重的蛋白质；赛前脱水与电解质操纵存在危险且未必改善外观","usedFor":["减脂速度控制","蛋白质目标","计划生成","风险提示"]},{"id":"garthe2011ijsnem","topic":"减脂速度与瘦体重保留","claim":"在精英运动员中，每周减重约 0.7% 体重的慢速方案使去脂体重增加，而每周减重约 1.4% 体重的快速方案去脂体重没有变化，且快速减重时减掉的体重中脂肪占比更低；因此减脂速度不宜超过每周约 0.7-1% 体重。","citation":"Garthe I, Raastad T, Refsnes PE, Koivisto A, Sundgot-Borgen J. Effect of two different weight-loss rates on body composition and strength and power-related performance in elite athletes. Int J Sport Nutr Exerc Metab. 2011;21(2):97-104.","doi":"10.1123/ijsnem.21.2.97","url":"https://pubmed.ncbi.nlm.nih.gov/21558571/","evidenceLevel":"RCT","keyNumbers":"24 名运动员随机分为慢速减重组（SR，0.7%/周）与快速减重组（FR，1.4%/周），均每周 4 次抗阻训练；SR 组去脂体重增加 2.1%±0.4%，FR 组无变化（−0.2%±0.7%），组间 P<0.01；两组体重与脂肪量均下降约 5.5-5.6%，实际周减重 0.7%±0.8% vs 1.0%±0.4%；作者结论：想同时增肌与提高 1RM 者应以每周约 0.7% 体重为目标","usedFor":["减脂速度控制","训练计划","预期管理"]},{"id":"tsai2006obesity","topic":"极低热量饮食（VLCD）的风险与长期效果","claim":"极低热量饮食（<800 kcal/d）相比常规低热量饮食只能带来更好的短期减重，1 年以上的长期减重并无差异，脱落率也相近；因此不应以 VLCD 作为常规减脂方案的默认选择。","citation":"Tsai AG, Wadden TA. The evolution of very-low-calorie diets: an update and meta-analysis. Obesity (Silver Spring). 2006;14(8):1283-1293.","doi":"10.1038/oby.2006.146","url":"https://pubmed.ncbi.nlm.nih.gov/16988070/","evidenceLevel":"Meta-analysis","keyNumbers":"6 项随机对照试验：VLCD 短期减重 16.1%±1.6% 初始体重 vs 低热量饮食 9.7%±2.4%（P=0.0001）；长期（≥1 年）减重 6.3%±3.2% vs 5.0%±4.0%（P>0.2）；两组脱落率相似","usedFor":["热量缺口计算","风险提示","预期管理"]},{"id":"wadden1993anninternmed","topic":"热量缺口大小与依从性","claim":"中等程度热量限制（约 1200 kcal/d 常规减重饮食 + 行为矫正）与医学监督下的严格限制（400-800 kcal/d）都能取得减重，但两者随时间都会出现体重回升；严格限制的短期减重幅度更大，长期维持比例反而更低。","citation":"Wadden TA. Treatment of obesity by moderate and severe caloric restriction. Results of clinical research trials. Ann Intern Med. 1993;119(7 Pt 2):688-693.","doi":"10.7326/0003-4819-119-7_part_2-199310011-00012","url":"https://pubmed.ncbi.nlm.nih.gov/8363198/","evidenceLevel":"Narrative review","keyNumbers":"常规 1200 kcal/d 减重饮食 + 行为矫正：20 周约减 8.5 kg，1 年后维持约三分之二；医学监督下极低热量饮食（400-800 kcal/d）：12-16 周约减 20 kg，次年维持二分之一至三分之二；参加正式减重维持项目或规律运动者长期效果最好","usedFor":["热量缺口计算","预期管理","长期维持"]},{"id":"jager2017jissn","topic":"蛋白质摄入量（ISSN 立场声明）","claim":"对大多数运动人群，每日 1.4-2.0 g/kg 体重蛋白质足以维持肌肉蛋白正平衡；而在限能量（减脂）期间，为最大化保留瘦体重可能需要提高到 2.3-3.1 g/kg/d。","citation":"Jäger R, Kerksick CM, Campbell BI, Cribb PJ, Wells SD, Skwiat TM, et al. International Society of Sports Nutrition Position Stand: protein and exercise. J Int Soc Sports Nutr. 2017;14:20.","doi":"10.1186/s12970-017-0177-8","url":"https://pubmed.ncbi.nlm.nih.gov/28642676/","evidenceLevel":"Position stand","keyNumbers":"多数运动者每日 1.4-2.0 g/kg 体重即可；限能量期间为最大化保留瘦体重可能需要 2.3-3.1 g/kg/d；单次 0.25 g/kg 体重或 20-40 g 优质蛋白，每 3-4 小时一次；单次含 700-3000 mg 亮氨酸；睡前酪蛋白 30-40 g 可提高夜间肌肉蛋白合成","usedFor":["蛋白质目标","计划生成","减脂速度控制"]},{"id":"morton2018bjsm","topic":"蛋白质摄入量的平台效应","claim":"在抗阻训练人群中，补充蛋白质能显著增加肌肉量与力量，但总蛋白质摄入超过约 1.62 g/kg/d 后，去脂体重的进一步增长不再增加，提示存在摄入平台。","citation":"Morton RW, Murphy KT, McKellar SR, Schoenfeld BJ, Henselmans M, Helms E, et al. A systematic review, meta-analysis and meta-regression of the effect of protein supplementation on resistance training-induced gains in muscle mass and strength in healthy adults. Br J Sports Med. 2018;52(6):376-384.","doi":"10.1136/bjsports-2017-097608","url":"https://pubmed.ncbi.nlm.nih.gov/28698222/","evidenceLevel":"Meta-analysis","keyNumbers":"49 项随机对照试验、1863 名受试者；蛋白质补充使 1RM 力量增加 2.49 kg（95%CI 0.64-4.33）、去脂体重增加 0.30 kg（95%CI 0.09-0.52）、肌纤维横截面积增加 310 µm²（95%CI 51-570）；两阶段拐点分析显示总蛋白质摄入达到 1.62 g/kg/d 后去脂体重增长不再进一步增加；年龄越大效果越小、有训练经验者效果更大","usedFor":["蛋白质目标","计划生成"]},{"id":"longland2016ajcn","topic":"减脂期高蛋白与体成分","claim":"在明显的能量缺口下配合高强度训练，摄入 2.4 g/kg/d 蛋白质比 1.2 g/kg/d 更能增加瘦体重、并带来更多脂肪减少，说明减脂期蛋白质应显著高于常规推荐量。","citation":"Longland TM, Oikawa SY, Mitchell CJ, Devries MC, Phillips SM. Higher compared with lower dietary protein during an energy deficit combined with intense exercise promotes greater lean mass gain and fat mass loss: a randomized trial. Am J Clin Nutr. 2016;103(3):738-746.","doi":"10.3945/ajcn.115.119339","url":"https://pubmed.ncbi.nlm.nih.gov/26817506/","evidenceLevel":"RCT","keyNumbers":"40 名青年男性，4 周约 40% 能量缺口（33 kcal/kg 瘦体重/d），每周 6 天抗阻 + 高强度间歇训练；高蛋白组（2.4 g/kg/d）瘦体重增加 1.2±1.0 kg、脂肪减少 4.8±1.6 kg；低蛋白组（1.2 g/kg/d）瘦体重增加 0.1±1.0 kg、脂肪减少 3.5±1.4 kg（组间 P<0.05）","usedFor":["蛋白质目标","训练计划","计划生成"]},{"id":"cava2017advnutr","topic":"减脂期保留肌肉的策略","claim":"饮食减重会减少肌肉量但并不降低肌力；充足（而非过量）的蛋白质摄入有助于保留瘦体重与肌肉量，而抗阻运动既能保留肌肉量又能提高肌力，因此减脂方案应同时包含适量蛋白质与抗阻训练。","citation":"Cava E, Yeat NC, Mittendorfer B. Preserving Healthy Muscle during Weight Loss. Adv Nutr. 2017;8(3):511-519.","doi":"10.3945/an.116.014506","url":"https://pubmed.ncbi.nlm.nih.gov/28507015/","evidenceLevel":"Narrative review","keyNumbers":"减重所致肌肉量下降未伴随肌力下降；减重改善整体躯体功能（主要归因于脂肪量下降）；高蛋白摄入有助于保留瘦体重与肌肉量，但未改善肌力，且可能对代谢功能有不良影响；耐力型与抗阻型运动均有助于保留肌肉量，抗阻运动还能提高肌力","usedFor":["训练计划","蛋白质目标","计划生成"]},{"id":"willis2012japplphysiol","topic":"抗阻训练 vs 纯有氧的体成分差异","claim":"在超重/肥胖成人中，同等时间投入下有氧训练减体重与减脂优于单纯抗阻训练，但只有包含抗阻训练的方案才能增加瘦体重；有氧加抗阻（时间翻倍）并未比单纯有氧带来更多减脂。","citation":"Willis LH, Slentz CA, Bateman LA, Shields AT, Piner LW, Bales CW, Houmard JA, Kraus WE. Effects of aerobic and/or resistance training on body mass and fat mass in overweight or obese adults. J Appl Physiol (1985). 2012;113(12):1831-1837.","doi":"10.1152/japplphysiol.01370.2011","url":"https://pubmed.ncbi.nlm.nih.gov/23019316/","evidenceLevel":"RCT","keyNumbers":"119 名久坐超重/肥胖成人随机分入 8 个月抗阻（RT）、有氧（AT）、有氧+抗阻（AT/RT）三组；AT 与 AT/RT 减体重和脂肪量均多于 RT（P<0.05），两者之间无差异；RT 与 AT/RT 增加瘦体重多于 AT（P<0.05）；AT/RT 用时为 AT 的两倍但未带来额外减脂","usedFor":["训练计划","有氧处方","计划生成"]},{"id":"keating2017obesrev","topic":"间歇训练与持续有氧对体脂的作用","claim":"在直接比较中，高强度间歇/冲刺间歇训练（HIIT/SIT）与中等强度持续训练（MICT）对体脂的改善没有差异，间歇训练并非在单位时间内更高效的减脂手段；且短期两种训练都难以带来有临床意义的体脂下降。","citation":"Keating SE, Johnson NA, Mielke GI, Coombes JS. A systematic review and meta-analysis of interval training versus moderate-intensity continuous training on body adiposity. Obes Rev. 2017;18(8):943-964.","doi":"10.1111/obr.12536","url":"https://pubmed.ncbi.nlm.nih.gov/28513103/","evidenceLevel":"Meta-analysis","keyNumbers":"31 项研究（≥4 周）：组内体脂率下降 HIIT/SIT −1.26%（95%CI −1.80 至 −0.72）、MICT −1.48%（95%CI −1.89 至 −1.06）；脂肪量下降 HIIT/SIT −1.38 kg（95%CI −1.99 至 −0.77）、MICT −0.91 kg（95%CI −1.45 至 −0.37）；两者在所有体脂指标上组间无差异；当比较时间投入或能量消耗更低的 HIIT/SIT 与 MICT 时，反而略倾向于 MICT（P=0.09）","usedFor":["有氧处方","训练计划","预期管理"]},{"id":"pontzer2016currbiol","topic":"受限总能耗模型与能量补偿","claim":"总能量消耗并不随体力活动无限线性增加：在活动量较低区间总能耗随活动量上升，但在高活动量区间出现平台，说明身体会通过降低其他组分能耗来维持总能耗在较窄范围内（受限总能耗模型）。","citation":"Pontzer H, Durazo-Arvizu R, Dugas LR, Plange-Rhule J, Bovet P, Forrester TE, Lambert EV, Cooper RS, Schoeller DA, Luke A. Constrained Total Energy Expenditure and Metabolic Adaptation to Physical Activity in Adult Humans. Curr Biol. 2016;26(3):410-417.","doi":"10.1016/j.cub.2015.12.046","url":"https://pubmed.ncbi.nlm.nih.gov/26832439/","evidenceLevel":"Cohort","keyNumbers":"332 名成人、5 个人群，用双标水法测总能量消耗、加速度计测体力活动；校正体型与体成分后，总能耗与体力活动正相关，但在高活动量区间关系明显减弱并出现平台；体脂率与活动强度会调节该代谢反应","usedFor":["TDEE 估算","有氧处方","平台期判断","预期管理"]},{"id":"wewege2017obesrev","topic":"HIIT vs 中等强度持续有氧","claim":"在超重/肥胖成人中，HIIT 与 MICT 在全身脂肪量、腰围等所有体成分指标上效果相当，但 HIIT 所需的训练时间约少 40%，因此可作为时间受限者的高效替代方案；训练模式（跑步 vs 骑行）会影响减脂效果。","citation":"Wewege M, van den Berg R, Ward RE, Keech A. The effects of high-intensity interval training vs. moderate-intensity continuous training on body composition in overweight and obese adults: a systematic review and meta-analysis. Obes Rev. 2017;18(6):635-646.","doi":"10.1111/obr.12532","url":"https://pubmed.ncbi.nlm.nih.gov/28401638/","evidenceLevel":"Meta-analysis","keyNumbers":"13 项研究，平均 10 周、每周 3 次；HIIT 与 MICT 均显著降低全身脂肪量与腰围（p<0.05），两者在所有体成分指标上无显著差异；HIIT 所需训练时间约少 40%；跑步训练对全身脂肪量效应量大（SMD −0.82 与 −0.85），而骑行训练未引起脂肪下降；短期中高强度训练可在体重不变的情况下改善体成分","usedFor":["有氧处方","训练计划","计划生成"]},{"id":"donnelly2009msse","topic":"减重维持期的运动量（ACSM 立场声明）","claim":"中等强度体力活动 150-250 min/周可预防体重增加但只带来小幅减重，超过 250 min/周才与临床显著减重相关；减重后维持体重同样需要 >250 min/周；抗阻训练不增加减重，但可增加去脂体重并促进脂肪减少。","citation":"Donnelly JE, Blair SN, Jakicic JM, Manore MM, Rankin JW, Smith BK; American College of Sports Medicine. American College of Sports Medicine Position Stand. Appropriate physical activity intervention strategies for weight loss and prevention of weight regain for adults. Med Sci Sports Exerc. 2009;41(2):459-471.","doi":"10.1249/MSS.0b013e3181949333","url":"https://pubmed.ncbi.nlm.nih.gov/19127177/","evidenceLevel":"Position stand","keyNumbers":"预防体重增加：中等强度体力活动 150-250 min/周；该范围内仅带来小幅减重；>250 min/周与临床显著减重相关；在中等（而非严格）饮食限制下，150-250 min/周可改善减重；减重后体重维持与体力活动 >250 min/周相关；抗阻训练不增强减重但可增加去脂体重、增加脂肪减少并降低健康风险；NHLBI 指南鼓励减重 10%，而相当多文献显示减重 3%-5% 即可降低健康风险","usedFor":["长期维持","有氧处方","训练计划","计划生成"]},{"id":"bellicha2021obesrev","topic":"运动对减重、体成分与维持的作用","claim":"汇总 12 篇系统综述显示，运动训练可带来显著但幅度有限的减重、减脂与内脏脂肪减少；抗阻训练能减少减重期间的瘦体重丢失；在能量消耗相等时，有氧训练与高强度间歇训练在减脂上没有差别；对体重维持尚无一致有效的运动方案证据。","citation":"Bellicha A, van Baak MA, Battista F, Beaulieu K, Blundell JE, Busetto L, et al. Effect of exercise training on weight loss, body composition changes, and weight maintenance in adults with overweight or obesity: An overview of 12 systematic reviews and 149 studies. Obes Rev. 2021;22(Suppl 4):e13256.","doi":"10.1111/obr.13256","url":"https://pubmed.ncbi.nlm.nih.gov/33955140/","evidenceLevel":"Systematic review","keyNumbers":"12 篇系统综述/荟萃分析（149 项研究）：减重 MD 为 −1.5 至 −3.5 kg（4 篇）；减脂 MD 为 −1.3 至 −2.6 kg（4 篇）；内脏脂肪 SMD 为 −0.33 至 −0.56（3 篇）；抗阻训练减少减重期间瘦体重丢失 MD 0.8 kg（95%CI 0.4-1.3）；能量消耗相等时有氧与 HIIT 无差异；体重维持方面未发现运动有显著效果（1 篇）","usedFor":["长期维持","训练计划","预期管理"]},{"id":"gardner2018jama","topic":"不同宏量营养素比例对减重的差异","claim":"在 12 个月的健康低脂饮食与健康低碳饮食对比中，两组减重无显著差异，且基因型模式与胰岛素分泌都不能预测哪种饮食更有效；决定减重效果的不是宏量营养素比例。","citation":"Gardner CD, Trepanowski JF, Del Gobbo LC, Hauser ME, Rigdon J, Ioannidis JPA, Desai M, King AC. Effect of Low-Fat vs Low-Carbohydrate Diet on 12-Month Weight Loss in Overweight Adults and the Association With Genotype Pattern or Insulin Secretion: The DIETFITS Randomized Clinical Trial. JAMA. 2018;319(7):667-679.","doi":"10.1001/jama.2018.0245","url":"https://pubmed.ncbi.nlm.nih.gov/29466592/","evidenceLevel":"RCT","keyNumbers":"609 名 BMI 28-40 的成人，12 个月；实际达成宏量营养素占比：碳水 48% vs 30%、脂肪 29% vs 45%、蛋白 21% vs 23%；12 个月减重 −5.3 kg（低脂）vs −6.0 kg（低碳），组间差 0.7 kg（95%CI −0.2 至 1.6）；饮食×基因型交互 P=0.20、饮食×胰岛素分泌交互 P=0.47，均不显著","usedFor":["饮食结构建议","计划生成","预期管理"]},{"id":"sacks2009nejm","topic":"不同宏量营养素比例对减重的差异","claim":"在 2 年、四种不同脂肪/蛋白/碳水比例的减热量饮食对比中，各组减重无显著差异，说明只要热量减少，减重效果与强调哪种宏量营养素无关；出席行为干预课程的次数与减重强相关。","citation":"Sacks FM, Bray GA, Carey VJ, Smith SR, Ryan DH, Anton SD, et al. Comparison of weight-loss diets with different compositions of fat, protein, and carbohydrates. N Engl J Med. 2009;360(9):859-873.","doi":"10.1056/NEJMoa0804748","url":"https://pubmed.ncbi.nlm.nih.gov/19246357/","evidenceLevel":"RCT","keyNumbers":"811 名超重成人，目标脂肪/蛋白/碳水比例为 20/15/65、20/25/55、40/15/45、40/25/35；6 个月各组平均减重约 6 kg（约 7% 初始体重），12 个月后开始回升；2 年时 15% 与 25% 蛋白组分别减 3.0 与 3.6 kg，20% 与 40% 脂肪组均为 3.3 kg，65% 与 35% 碳水组分别减 2.9 与 3.4 kg（所有比较 P>0.20）；完成试验者平均减重 4 kg，14%-15% 减重达初始体重 10% 以上；出席课程次数与减重相关（每次约 0.2 kg）","usedFor":["饮食结构建议","行为干预","计划生成"]},{"id":"johnston2014jama","topic":"不同饮食方案的减重差异（网状 meta）","claim":"网状荟萃分析显示，任何低碳或低脂饮食都能带来显著减重，但各命名饮食方案之间的减重差异很小，因此推荐应基于患者能否长期坚持，而不是追求“最优”饮食模式。","citation":"Johnston BC, Kanters S, Bandayrel K, Wu P, Naji F, Siemieniuk RA, et al. Comparison of weight loss among named diet programs in overweight and obese adults: a meta-analysis. JAMA. 2014;312(9):923-933.","doi":"10.1001/jama.2014.10397","url":"https://pubmed.ncbi.nlm.nih.gov/25182101/","evidenceLevel":"Meta-analysis","keyNumbers":"48 项随机试验、7286 名受试者；相较不节食，低碳饮食 6 个月减重 8.73 kg（95% credible interval 7.27-10.20）、12 个月 7.25 kg（95%CI 5.33-9.25）；低脂饮食 6 个月 7.99 kg（95%CI 6.01-9.92）、12 个月 7.27 kg（95%CI 5.26-9.34）；Atkins 比 Zone 在 6 个月多减 1.71 kg；行为支持的影响在 6 个月为 3.23 kg、12 个月降至 1.08 kg","usedFor":["饮食结构建议","行为干预","预期管理"]},{"id":"trepanowski2017jamainternmed","topic":"间歇性断食与常规热量限制的比较","claim":"在 1 年的随机试验中，隔日禁食在依从性、减重、体重维持与心血管保护方面均不优于每日热量限制，且隔日禁食组脱落率最高，因此不建议把隔日禁食作为优于常规热量限制的方案。","citation":"Trepanowski JF, Kroeger CM, Barnosky A, Klempel MC, Bhutani S, Hoddy KK, et al. Effect of Alternate-Day Fasting on Weight Loss, Weight Maintenance, and Cardioprotection Among Metabolically Healthy Obese Adults: A Randomized Clinical Trial. JAMA Intern Med. 2017;177(7):930-938.","doi":"10.1001/jamainternmed.2017.0936","url":"https://pubmed.ncbi.nlm.nih.gov/28459931/","evidenceLevel":"RCT","keyNumbers":"100 名肥胖成人；隔日禁食（禁食日 25%、进食日 125% 能量需求）vs 每日热量限制（75% 能量需求）vs 无干预对照；第 6 个月减重均为 −6.8%（95%CI −9.1 至 −4.5 / −4.6），第 12 个月分别为 −6.0%（95%CI −8.5 至 −3.6）与 −5.3%（95%CI −7.6 至 −3.0）；脱落率隔日禁食 38%（13/34）> 每日限制 29%（10/35）> 对照 26%（8/31）；12 个月时隔日禁食组 LDL-C 升高 11.5 mg/dL（95%CI 1.9-21.1）","usedFor":["饮食结构建议","风险提示","预期管理"]},{"id":"lowe2020jamainternmed","topic":"限时进食（16:8）与常规进食","claim":"在不限制总热量的前提下，16:8 限时进食 12 周并不比正常三餐进食更有效减重，且限时进食组的四肢瘦体重指数下降更多，提示单纯压缩进食窗口可能不利于瘦体重保留。","citation":"Lowe DA, Wu N, Rohdin-Bibby L, Moore AH, Kelly N, Liu YE, et al. Effects of Time-Restricted Eating on Weight Loss and Other Metabolic Parameters in Women and Men With Overweight and Obesity: The TREAT Randomized Clinical Trial. JAMA Intern Med. 2020;180(11):1491-1499.","doi":"10.1001/jamainternmed.2020.4153","url":"https://pubmed.ncbi.nlm.nih.gov/32986097/","evidenceLevel":"RCT","keyNumbers":"116 名 BMI 27-43 的成人，12 周；限时进食组（12:00-20:00 自由进食）减重 −0.94 kg（95%CI −1.68 至 −0.20, P=0.01），正常进食组 −0.68 kg（95%CI −1.41 至 0.05, P=0.07），组间差 −0.26 kg（95%CI −1.30 至 0.78, P=0.63）；两组估算能量摄入无差异；四肢瘦体重指数组间差 −0.16 kg/m²（95%CI −0.27 至 −0.05, P=0.005）","usedFor":["饮食结构建议","风险提示","计划生成"]},{"id":"liu2022nejm","topic":"限时进食 + 热量限制 vs 单纯热量限制","claim":"在 12 个月、以热量限制为基础的治疗中，加入 8 小时限时进食并未带来额外减重、减脂或代谢风险改善，说明限时进食本身不是减重的必要条件。","citation":"Liu D, Huang Y, Huang C, Yang S, Wei X, Zhang P, et al. Calorie Restriction with or without Time-Restricted Eating in Weight Loss. N Engl J Med. 2022;386(16):1495-1504.","doi":"10.1056/NEJMoa2114833","url":"https://pubmed.ncbi.nlm.nih.gov/35443107/","evidenceLevel":"RCT","keyNumbers":"139 名肥胖患者随机分为限时进食（8:00-16:00）+ 热量限制组与单纯每日热量限制组；全程热量目标男性 1500-1800 kcal/d、女性 1200-1500 kcal/d；12 个月减重 −8.0 kg（95%CI −9.6 至 −6.4）vs −6.3 kg（95%CI −7.8 至 −4.7），净差 −1.8 kg（95%CI −4.0 至 0.4, P=0.11）；腰围、BMI、体脂、瘦体重、血压与代谢危险因素结果一致；两组不良事件无实质差异","usedFor":["饮食结构建议","热量缺口计算","计划生成"]},{"id":"hall2019cellmetab","topic":"超加工食品与自发进食量","claim":"在能量密度、宏量营养素、糖、钠与纤维均匹配的住院交叉试验中，超加工饮食使受试者在自由进食条件下每天多摄入约 508 kcal 并导致体重增加，改为未加工饮食后体重下降；减少超加工食品摄入是控制自发进食量的有效策略。","citation":"Hall KD, Ayuketah A, Brychta R, Cai H, Cassimatis T, Chen KY, et al. Ultra-Processed Diets Cause Excess Calorie Intake and Weight Gain: An Inpatient Randomized Controlled Trial of Ad Libitum Food Intake. Cell Metab. 2019;30(1):67-77.e3.","doi":"10.1016/j.cmet.2019.05.008","url":"https://pubmed.ncbi.nlm.nih.gov/31105044/","evidenceLevel":"Crossover RCT","keyNumbers":"20 名体重稳定成人（平均 31.2±1.6 岁，BMI 27±1.5）；超加工饮食期间自由进食能量摄入比未加工饮食多 508±106 kcal/d（P=0.0001），其中碳水多 280±54 kcal/d、脂肪多 230±53 kcal/d，蛋白质无差异（−2±12 kcal/d, P=0.85）；超加工期体重增加 0.9±0.3 kg（P=0.009），未加工期体重下降 0.9±0.3 kg（P=0.007）；体重变化与能量摄入高度相关（r=0.8, P<0.0001）","usedFor":["饮食结构建议","计划生成","行为干预"]},{"id":"reynolds2019lancet","topic":"膳食纤维摄入量与体重","claim":"大样本系统评价与荟萃分析显示，较高膳食纤维摄入与更低体重、更低收缩压和总胆固醇相关，且每日摄入 25-29 g 时关键结局的风险降低幅度最大；剂量反应提示更高摄入可能带来更大获益。","citation":"Reynolds A, Mann J, Cummings J, Winter N, Mete E, Te Morenga L. Carbohydrate quality and human health: a series of systematic reviews and meta-analyses. Lancet. 2019;393(10170):434-445.","doi":"10.1016/S0140-6736(18)31809-9","url":"https://pubmed.ncbi.nlm.nih.gov/30638909/","evidenceLevel":"Meta-analysis","keyNumbers":"185 项前瞻性研究（近 1.35 亿人年）与 58 项临床试验（4635 名成人）；最高 vs 最低膳食纤维摄入者全因死亡与心血管相关死亡、冠心病、卒中、2 型糖尿病和结直肠癌发生风险降低 15%-30%；临床试验显示较高纤维摄入者体重、收缩压与总胆固醇显著更低；每日摄入 25-29 g 时关键结局风险降低幅度最大；剂量反应曲线提示更高摄入对心血管病、2 型糖尿病与结直肠癌等可提供更大保护；膳食纤维的证据确定性为中等","usedFor":["纤维目标","饮食结构建议","计划生成"]},{"id":"malik2013ajcn","topic":"含糖饮料与体重","claim":"前瞻性队列与随机试验的汇总证据表明，含糖饮料消费会促进儿童与成人体重增加：队列研究中每增加 1 份/日与体重上升相关，成人试验中添加含糖饮料使体重增加。","citation":"Malik VS, Pan A, Willett WC, Hu FB. Sugar-sweetened beverages and weight gain in children and adults: a systematic review and meta-analysis. Am J Clin Nutr. 2013;98(4):1084-1102.","doi":"10.3945/ajcn.113.058362","url":"https://pubmed.ncbi.nlm.nih.gov/23966427/","evidenceLevel":"Meta-analysis","keyNumbers":"32 篇原始文献：儿童 20 篇（15 项队列 n=25745；5 项试验 n=2772），成人 12 篇（7 项队列 n=174252；5 项试验 n=292）；队列研究中每日每增加 1 份含糖饮料，1 年内儿童 BMI 增加 0.06（95%CI 0.02-0.10，随机效应）与 0.05（95%CI 0.03-0.07，固定效应），成人体重增加 0.22 kg（95%CI 0.09-0.34）与 0.12 kg（95%CI 0.10-0.14）；儿童试验中减少含糖饮料可减少 BMI 增长（固定效应 −0.12，95%CI −0.22 至 −0.2）；成人试验中添加含糖饮料使体重增加 0.85 kg（95%CI 0.50-1.20）","usedFor":["饮食结构建议","计划生成","行为干预"]},{"id":"nedeltcheva2010anninternmed","topic":"睡眠不足与减脂质量","claim":"在同样热量限制条件下，睡眠不足会显著降低减掉的体重中脂肪的比例，并增加去脂体重的丢失，说明睡眠时长直接决定减脂的“质量”而非仅仅是总量。","citation":"Nedeltcheva AV, Kilkus JM, Imperial J, Schoeller DA, Penev PD. Insufficient sleep undermines dietary efforts to reduce adiposity. Ann Intern Med. 2010;153(7):435-441.","doi":"10.7326/0003-4819-153-7-201010050-00006","url":"https://pubmed.ncbi.nlm.nih.gov/20921542/","evidenceLevel":"Crossover RCT","keyNumbers":"10 名超重成人（3 女 7 男，平均 41 岁，BMI 27.4±2.0），14 天中等热量限制、夜间睡眠机会 8.5 h vs 5.5 h 交叉；睡眠限制使脂肪减少占总减重的比例下降 55%（脂肪 1.4 kg vs 0.6 kg，P=0.043），去脂体重丢失增加 60%（1.5 kg vs 2.4 kg，P=0.002）；同时出现饥饿感增加与底物利用向少氧化脂肪方向偏移","usedFor":["睡眠建议","计划生成","风险提示"]},{"id":"greer2013natcommun","topic":"睡眠剥夺与食物渴望","claim":"睡眠剥夺会改变大脑对食物价值的评估：前额叶与脑岛等食欲评估区活动下降、杏仁核反应增强，并显著提高对高热量、促体重增加食物的渴望，其程度与主观睡眠不足严重程度相关——这为睡眠不足促进肥胖提供了中枢机制解释。","citation":"Greer SM, Goldstein AN, Walker MP. The impact of sleep deprivation on food desire in the human brain. Nat Commun. 2013;4:2259.","doi":"10.1038/ncomms3259","url":"https://pubmed.ncbi.nlm.nih.gov/23922121/","evidenceLevel":"Crossover RCT","keyNumbers":"睡眠剥夺后对高热量、促体重增加食物的渴望显著增加，且增加幅度可由受试者主观睡眠不足的严重程度预测；同时额叶与脑岛食欲评估区活动下降、杏仁核活动增强","usedFor":["睡眠建议","行为干预","风险提示"]},{"id":"wang2018sleep","topic":"睡眠限制与减重期体成分","claim":"在 8 周热量限制中，每周累计约 169 分钟的睡眠限制虽然不改变减重总量，却显著降低减掉的体重中脂肪的比例，且“补觉”不能完全逆转，提示减脂期应避免慢性睡眠限制。","citation":"Wang X, Sparks JR, Bowyer KP, Youngstedt SD. Influence of sleep restriction on weight loss outcomes associated with caloric restriction. Sleep. 2018;41(5):zsy027.","doi":"10.1093/sleep/zsy027","url":"https://pubmed.ncbi.nlm.nih.gov/29438540/","evidenceLevel":"RCT","keyNumbers":"超重/肥胖成人随机分入单纯热量限制组（n=15）与热量限制+睡眠限制组（n=21），8 周，热量摄入限制至实测静息代谢率的 95%；睡眠限制组在 5 个夜晚减少卧床时间、另 2 晚自由睡眠，净减少睡眠约 169±75 min/周（限制夜减少 57±36 min/d）；两组减重、减瘦体重与减脂总量相似，但单纯热量限制组减掉的体重中脂肪占比显著更高（P=0.016）","usedFor":["睡眠建议","计划生成","风险提示"]},{"id":"leibel1995nejm","topic":"代谢适应 / 平台期机制","claim":"维持低于初始 10% 以上的体重会伴随总能量消耗的补偿性下降（超出体成分变化所能解释的程度），而维持高于初始 10% 的体重则伴随能量消耗上升；这种补偿性变化是减重后难以维持的重要原因。","citation":"Leibel RL, Rosenbaum M, Hirsch J. Changes in energy expenditure resulting from altered body weight. N Engl J Med. 1995;332(10):621-628.","doi":"10.1056/NEJM199503093321001","url":"https://pubmed.ncbi.nlm.nih.gov/7632212/","evidenceLevel":"Cohort","keyNumbers":"18 名肥胖者与 23 名从未肥胖者；体重降至初始 10% 以下时，总能量消耗分别比预期低 6±3（从未肥胖者）与 8±5（肥胖者）kcal/kg 去脂体重/d（均 P<0.001），静息与非静息能量消耗各下降 3-4 kcal/kg FFM/d；体重升至初始 10% 以上时总能量消耗分别增加 9±7 与 8±4 kcal/kg FFM/d；这些变化与肥胖程度及性别无关","usedFor":["平台期判断","TDEE 估算","预期管理"]},{"id":"rosenbaum2010ijo","topic":"适应性产热与体重反弹","claim":"减重成功后恢复到减重前体脂水平的比例超过 80%，其原因是代谢、行为、神经内分泌与自主神经反应的协同作用主动“防御”体内脂肪储备（适应性产热），且这一机制在瘦者与肥胖者中都存在，主要由瘦素介导。","citation":"Rosenbaum M, Leibel RL. Adaptive thermogenesis in humans. Int J Obes (Lond). 2010;34(Suppl 1):S47-S55.","doi":"10.1038/ijo.2010.184","url":"https://pubmed.ncbi.nlm.nih.gov/20935667/","evidenceLevel":"Narrative review","keyNumbers":"成功减重后恢复到减重前体脂水平的比例超过 80%；适应性产热在瘦者与肥胖者中均存在；该过程很大程度上由脂肪细胞来源的瘦素介导","usedFor":["平台期判断","长期维持","预期管理"]},{"id":"byrne2018ijo","topic":"饮食间歇（diet break）与代谢适应","claim":"把连续能量限制改成“限制期 + 能量平衡休息期”交替的间歇方案，可以获得更大的体重与脂肪下降，并减轻校正体成分后的静息能量消耗下降，提示饮食间歇有助于缓解代谢适应。","citation":"Byrne NM, Sainsbury A, King NA, Hills AP, Wood RE. Intermittent energy restriction improves weight loss efficiency in obese men: the MATADOR study. Int J Obes (Lond). 2018;42(2):129-138.","doi":"10.1038/ijo.2017.206","url":"https://pubmed.ncbi.nlm.nih.gov/28925405/","evidenceLevel":"RCT","keyNumbers":"51 名肥胖男性随机分为连续（CON，16 周持续限制）与间歇（INT，8×2 周限制 + 7×2 周能量平衡，共 30 周）两组，限制期能量摄入为维持需求的 67%；完成者中 INT 减重 14.1±5.6 kg vs CON 9.1±2.9 kg（P<0.001），脂肪减少 12.3±4.8 kg vs 8.0±4.2 kg（P<0.01），去脂体重丢失相似（1.8±1.6 vs 1.2±2.5 kg, P=0.4）；间歇期能量平衡阶段平均体重变化仅 0.0±0.3 kg；校正体成分后 INT 组静息能量消耗下降更少（−360±502 vs −749±498 kJ/d, P<0.05）","usedFor":["平台期判断","计划生成","长期维持"]},{"id":"barakat2020scj","topic":"体成分重组（body recomposition）","claim":"系统梳理文献后可确认，体成分重组（同时增肌与减脂）不仅发生在未训练或超重/肥胖人群中，在有抗阻训练经验的人群中也有相当证据；其两个关键驱动因素是渐进超负荷的抗阻训练与循证的营养策略，而体成分测量方法的局限是主要混杂来源。","citation":"Barakat C, Pearson J, Escalante G, Campbell B, De Souza EO. Body Recomposition: Can Trained Individuals Build Muscle and Lose Fat at the Same Time? Strength Cond J. 2020;42(5):7-21.","doi":"10.1519/SSC.0000000000000584","url":"https://doi.org/10.1519/SSC.0000000000000584","evidenceLevel":"Narrative review","keyNumbers":null,"usedFor":["训练计划","计划生成","预期管理"]},{"id":"who2020bjsm","topic":"WHO 体力活动与久坐行为指南","claim":"WHO 2020 指南建议所有成人每周进行 150-300 分钟中等强度或 75-150 分钟高强度有氧身体活动（或等效组合），并建议所有年龄组定期进行肌肉强化活动；久坐行为的阈值因证据不足未能量化。","citation":"Bull FC, Al-Ansari SS, Biddle S, Borodulin K, Buman MP, Cardon G, et al. World Health Organization 2020 guidelines on physical activity and sedentary behaviour. Br J Sports Med. 2020;54(24):1451-1462.","doi":"10.1136/bjsports-2020-102955","url":"https://pubmed.ncbi.nlm.nih.gov/33239350/","evidenceLevel":"Guideline","keyNumbers":"成人：每周 150-300 min 中等强度或 75-150 min 高强度有氧活动，或等效的中高强度组合；儿童青少年：全周平均每天 60 min 中高强度有氧活动；所有年龄组均建议规律进行肌肉强化活动；建议减少久坐行为，但证据不足以量化久坐行为阈值","usedFor":["有氧处方","训练计划","计划生成"]},{"id":"jensen2014circulation","topic":"AHA/ACC/TOS 成人肥胖管理指南","claim":"该指南是美国心脏病学会/美国心脏协会/肥胖学会联合发布的成人超重与肥胖管理循证指南，由指南工作组基于系统证据审查形成推荐，是北美体重管理临床路径的权威依据。","citation":"Jensen MD, Ryan DH, Apovian CM, Ard JD, Comuzzie AG, Donato KA, et al. 2013 AHA/ACC/TOS guideline for the management of overweight and obesity in adults: a report of the American College of Cardiology/American Heart Association Task Force on Practice Guidelines and The Obesity Society. Circulation. 2014;129(25 Suppl 2):S102-S138.","doi":"10.1161/01.cir.0000437739.71477.ee","url":"https://pubmed.ncbi.nlm.nih.gov/24222017/","evidenceLevel":"Guideline","keyNumbers":null,"usedFor":["计划生成","风险提示","边界说明"]},{"id":"yumuk2015obesfacts","topic":"欧洲肥胖管理指南","claim":"欧洲肥胖研究学会指南指出：临床用 BMI 估计体脂程度、用腰围评估内脏脂肪蓄积；平衡的低热量饮食无论强调何种宏量营养素都能带来临床有意义的减重；有氧训练是减少脂肪量的最佳运动方式，而增加瘦体重需要包含抗阻训练的方案。","citation":"Yumuk V, Tsigos C, Fried M, Schindler K, Busetto L, Micic D, Toplak H; Obesity Management Task Force of the European Association for the Study of Obesity. European Guidelines for Obesity Management in Adults. Obes Facts. 2015;8(6):402-424.","doi":"10.1159/000442721","url":"https://pubmed.ncbi.nlm.nih.gov/26641646/","evidenceLevel":"Guideline","keyNumbers":"用 BMI 估计体脂程度、用腰围评估内脏脂肪蓄积；平衡低热量饮食无论宏量营养素构成如何均可带来临床有意义的减重；有氧训练是减少脂肪量的最佳运动方式，增加瘦体重需要包含抗阻训练的方案；认知行为治疗针对需要改变的行为，是减重与维持的关键组成","usedFor":["计划生成","训练计划","饮食结构建议","风险提示"]},{"id":"china-dietary-guidelines-2022","topic":"中国居民膳食指南（2022）","claim":"《中国居民膳食指南（2022）》是中国营养学会组织编写的国家层面膳食指导文件，以平衡膳食八准则为核心，给出食物多样、吃动平衡健康体重、多吃蔬果奶类全谷大豆、适量吃鱼禽蛋瘦肉、少盐少油控糖限酒等定量膳食建议，是中文减脂食谱结构设计的权威依据。","citation":"中国营养学会. 中国居民膳食指南（2022）. 北京：人民卫生出版社，2022.","doi":null,"url":"https://www.cnsoc.org/","evidenceLevel":"Guideline","keyNumbers":null,"usedFor":["饮食结构建议","纤维目标","计划生成"]},{"id":"china-weight-management-2024","topic":"中国成人 BMI 标准与减重速度（国家卫健委）","claim":"国家卫生健康委《体重管理指导原则（2024 年版）》给出中国成人 BMI 分类标准，并为超重或轻度肥胖者设定每周减重约 0.5-1 kg、每月 2-4 kg、6 个月内减少当前体重 5%-15% 并维持的目标，明确不建议节食减重和快速减重，强调生活方式干预是所有减重方案的基础。","citation":"国家卫生健康委员会. 体重管理指导原则（2024 年版）. 北京：国家卫生健康委员会，2024.","doi":null,"url":"https://health.nua.edu.cn/2025/0321/c5357a113943/page.htm","evidenceLevel":"Guideline","keyNumbers":"中国 18 岁及以上成人 BMI 判定（引自 WS/T 428—2013）：<18.5 kg/m² 体重过低，18.5≤BMI<24.0 正常，24.0≤BMI<28.0 超重，BMI≥28.0 肥胖；24.0≤BMI<32.5（超重或轻度肥胖）者初始目标为每周减重约 0.5-1 kg、每月 2-4 kg、6 个月内减轻当前体重 5%-15% 并维持；BMI≥32.5（中重度肥胖）者按减轻现体重 5%、10%、15% 分阶段设定周/月目标；不建议节食减重和快速减重；所有有减重需求者都应接受全面生活方式干预，无论是否联合药物或手术治疗；在“孕前体重管理”一节中明确超重肥胖者应结合饮食调整，每周至少进行 150 分钟中等强度有氧运动及 2~3 次抗阻运动；80 岁以上高龄老人 BMI 适宜范围 22.0-26.9 kg/m²；老年人群一节建议每日 7 小时睡眠、午睡不超过 1 小时","usedFor":["BMI 判定","减脂速度控制","计划生成","风险提示","长期维持"]},{"id":"careau2021currbiol","topic":"能量补偿（运动消耗的“打折”效应）","claim":"在迄今最大的成人双标水数据库中，人体对额外身体活动的能量补偿平均约 28%：多活动所消耗的热量中只有约 72% 会转化为当日总能量消耗的增加；补偿程度随体成分不同而差异很大，且与体脂水平相关。","citation":"Careau V, Halsey LG, Pontzer H, Ainslie PN, Andersen LF, Anderson LJ, et al.; IAEA DLW database group. Energy compensation and adiposity in humans. Curr Biol. 2021;31(20):4659-4666.e2.","doi":"10.1016/j.cub.2021.08.016","url":"https://pubmed.ncbi.nlm.nih.gov/34453886/","evidenceLevel":"Cohort","keyNumbers":"n=1754 名正常生活成人的总能量消耗与基础能量消耗数据；能量补偿平均值约 28%（即额外活动消耗的热量仅约 72% 转化为当日总能耗增量）；补偿程度在不同体成分人群间差异明显，且与体脂水平相关","usedFor":["TDEE 估算","有氧处方","预期管理","平台期判断"]},{"id":"who2004lancet","topic":"亚洲人群 BMI 切点","claim":"WHO 专家咨询组确认亚洲人群在较低 BMI 下即出现较高的 2 型糖尿病与心血管病风险（其超重国际切点仍为 BMI≥25 kg/m²），但不同亚洲人群的风险切点差异较大（观察风险 22-25、高风险 26-31 kg/m²），因此未对每个人群单独重新定义切点，而是提出 23.0、27.5、32.5、37.5 kg/m² 作为可供各国选择公共卫生行动点的参考值。","citation":"WHO Expert Consultation. Appropriate body-mass index for Asian populations and its implications for policy and intervention strategies. Lancet. 2004;363(9403):157-163.","doi":"10.1016/S0140-6736(03)15268-3","url":"https://pubmed.ncbi.nlm.nih.gov/14726171/","evidenceLevel":"Guideline","keyNumbers":"亚洲人群观察风险的 BMI 切点在不同人群间为 22-25 kg/m²，高风险切点为 26-31 kg/m²；WHO 超重国际切点保留为 ≥25 kg/m²；提出的额外公共卫生行动点为 23.0、27.5、32.5、37.5 kg/m²","usedFor":["BMI 判定","风险提示","计划生成"]},{"id":"ainsworth2011msse","topic":"体力活动 MET 值来源","claim":"2011 版体力活动汇编（Compendium of Physical Activities）对 5 位数字活动编码给出标准化 MET 值，是把“运动项目 + 时长”换算为能量消耗的通用参考标准，可用于运动处方与 TDEE 估算中的活动能量消耗计算。","citation":"Ainsworth BE, Haskell WL, Herrmann SD, Meckes N, Bassett DR Jr, Tudor-Locke C, Greer JL, Vezina J, Whitt-Glover MC, Leon AS. 2011 Compendium of Physical Activities: a second update of codes and MET values. Med Sci Sports Exerc. 2011;43(8):1575-1581.","doi":"10.1249/MSS.0b013e31821ece12","url":"https://pubmed.ncbi.nlm.nih.gov/21681120/","evidenceLevel":"Guideline","keyNumbers":"2011 版汇编共含 821 个活动编码，较上一版新增 217 个；其中 68%（561/821）具有实测 MET 值；2000 版 604 个编码中约一半（317/604）被修订，MET 值更新占全部编码改动的 73%；MET 定义为完成该活动时的能量消耗率（代谢当量），编码体系与前版兼容。注意：单项活动（例如乒乓球）的具体 MET 值须查汇编原表，本文摘要不含活动-MET 对照表","usedFor":["MET 计算","有氧处方","TDEE 估算"]},{"id":"steinberg2015jand","topic":"每日自我称重与行为干预","claim":"在 6 个月减重干预中，坚持每天称重者比非每天称重者减重显著更多，并采纳更多体重控制行为，而两组在饮食策略、热量摄入与运动消耗上并无差异，提示每日称重通过行为自我调节产生作用。","citation":"Steinberg DM, Bennett GG, Askew S, Tate DF. Weighing every day matters: daily weighing improves weight loss and adoption of weight control behaviors. J Acad Nutr Diet. 2015;115(4):511-518.","doi":"10.1016/j.jand.2014.12.011","url":"https://pubmed.ncbi.nlm.nih.gov/25683820/","evidenceLevel":"Cohort","keyNumbers":"6 个月随机对照试验干预组 47 名超重成人；51%（n=24）做到每天称重，其余平均每周 5.4±1.2 天；每日称重者比非每日称重者多减重 6.1 kg（95%CI −10.2 至 −2.1, P=0.004）；采纳的体重控制行为总数更多（17.6±7.6 vs 11.2±6.4, P=0.004）；两组饮食策略、热量摄入与运动热量消耗无差异","usedFor":["进度追踪","行为干预","长期维持"]},{"id":"wilding2021nejm","topic":"减重药物的效果边界（仅作边界说明）","claim":"司美格鲁肽 2.4 mg 每周一次联合生活方式干预可在 68 周带来约 15% 的体重下降，远大于安慰剂，但存在胃肠道不良反应与停药风险；该证据用于说明药物减重的效果量级与适用边界，不作为本网站推荐手段。","citation":"Wilding JPH, Batterham RL, Calanna S, Davies M, Van Gaal LF, Lingvay I, et al.; STEP 1 Study Group. Once-Weekly Semaglutide in Adults with Overweight or Obesity. N Engl J Med. 2021;384(11):989-1002.","doi":"10.1056/NEJMoa2032183","url":"https://pubmed.ncbi.nlm.nih.gov/33567185/","evidenceLevel":"RCT","keyNumbers":"1961 名 BMI≥30（或 ≥27 伴至少 1 项体重相关合并症）且无糖尿病的成人，随机 2:1 接受司美格鲁肽 2.4 mg 每周皮下注射或安慰剂 68 周 + 生活方式干预；体重变化 −14.9% vs −2.4%，治疗差 −12.4 个百分点（95%CI −13.4 至 −11.5, P<0.001）；体重下降 ≥5%、≥10%、≥15% 者分别占 86.4% vs 31.5%、69.1% vs 12.0%、50.5% vs 4.9%；绝对体重变化 −15.3 kg vs −2.6 kg（治疗差 −12.7 kg, 95%CI −13.7 至 −11.7）；因胃肠道事件停药 4.5% vs 0.8%","usedFor":["边界说明","预期管理","风险提示"]},{"id":"sperlich2011ijspp","topic":"乒乓球运动的代谢强度（MET）","claim":"乒乓球训练课实测均值 6.8 ± 2.0 METs（峰值 11.2），正式比赛均值 4.8 ± 1.4 METs（峰值 9.6）；心率与血乳酸都不高，说明它属于中低强度的间歇性活动，消耗不能按高强度有氧估算。","citation":"Sperlich B, Koehler K, Holmberg HC, Zinner C, Mester J. Table tennis: cardiorespiratory and metabolic analysis of match and exercise in elite junior national players. Int J Sports Physiol Perform. 2011;6(2):234-242.","doi":"10.1123/ijspp.6.2.234","url":"https://pubmed.ncbi.nlm.nih. <script>
/* =====================================================================
 * 减脂计划核心算法 core.js
 * ---------------------------------------------------------------------
 * 设计原则：
 *  1. 本文件是纯函数库，不碰 DOM、不碰 localStorage，可在浏览器和 Node 里
 *     跑同一份代码（tests/core.test.mjs 就是直接 require 它做回归测试）。
 *  2. 每个关键数字都标注了文献依据编号（evidence id），这些编号对应
 *     data/evidence.json 里的真实论文，界面上的「科学依据」页会展开。
 *  3. 所有会产生「热量下限」「减重速度上限」「目标体重是否合理」的判定

 * ===================================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.FLCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ------------------------------------------------------------------
   * 0. 被文献支撑的常量
   * ------------------------------------------------------------------ */

  // 1 kg 脂肪组织约 7700 kcal（传统「能量平衡」近似值）。
