  //       garthe2011ijsnem（RCT：0.7%/周 组去脂体重 +2.1%，1.4%/周 组无变化，作者推荐约 0.7%）
  //       china-weight-management-2024（超重人群初始每周减 0.5–1 kg，不建议快速减重）
  // 注意：本证据库中没有支持「低于 0.5%/周」或「高于 1.0%/周」的档位，
  //       所以三档全部放在 0.5–1.0% 这一段，而不是常见的 0.25/0.5/1.0。
  const SPEED_PRESETS = {
    gentle: {
      key: 'gentle', label: '温和', pct: 0.5, weeklyKgFactor: 0.005,
      desc: '每周约 0.5% 体重（保肌优先）。位于 Helms 建议区间下沿，对应 Garthe 试验里的「慢速减重」组，去脂体重反而有增长。'
    },
    standard: {
      key: 'standard', label: '标准', pct: 0.75, weeklyKgFactor: 0.0075,
      desc: '每周约 0.75% 体重。Garthe 随机对照试验中作者推荐的速率，减脂速度与保肌效果平衡最好。'
    },
    aggressive: {
      key: 'aggressive', label: '激进', pct: 1.0, weeklyKgFactor: 0.01,
      desc: '每周约 1% 体重，是文献建议的上限。体脂较高者可行，但饿感强、训练表现下降、瘦体重流失与胆结石风险上升；超过 1%/周 本工具不接受。'
    }
  };

  // 每日热量硬下限：低于这个值极难满足微量营养素需求，且需要医学监督。
  // 依据：liu2022nejm（12 个月热量限制试验的处方目标：男 1500–1800、女 1200–1500 kcal/d，
  //       此处取其下限作为「不生成更低目标」的保守地板，不是推荐摄入量）
  //       yumuk2015obesfacts / jensen2014circulation（肥胖管理指南要求此类方案需医学监督）
  const MIN_INTAKE = { male: 1500, female: 1200 };

  // 极低热量饮食（VLCD）阈值：低于 800 kcal/d 属于 VLCD，必须医学监督，
  // 且长期减重效果并不优于常规低热量饮食。依据：tsai2006obesity、wadden1993anninternmed
  const VLCD_THRESHOLD = 800;

  // 缺口上限：不超过 TDEE 的 30%（体脂低的人收紧到 25%）。
  // 说明：这是把「每周不超过 1% 体重」的文献上限（helms2014jissn、garthe2011ijsnem）
  //       换算后额外加的一层保守实现上限，不是独立文献里的 30% 阈值。
  const MAX_DEFICIT_RATIO = { default: 0.30, lean: 0.25 };

  // 运动的能量补偿：额外运动消耗平均只有约 72% 会转化为当日总能耗增量
  // （其余被静息代谢下降、日常活动减少等补偿掉）。依据：careau2021currbiol（n=1754 双标水）
  //       pontzer2016currbiol（高活动量区间总能耗出现平台）
  const EXERCISE_COMPENSATION = 0.72;

  // 蛋白质：减脂期 1.6–2.4 g/kg 体重。
  // 依据：jager2017jissn（ISSN 立场声明）、morton2018bjsm（1.6 g/kg 平台）、
  //       longland2016ajcn（减脂+抗阻时更高蛋白改善体成分）、helms2014jissn
  const PROTEIN = {
    trainingRange: [1.8, 2.4],
    dietOnlyRange: [1.6, 2.0],
    maxPerKgLean: 2.6,      // 上限按去脂体重约束，防止超重人群蛋白定得过高
    min: 1.6
  };

  // 脂肪下限：0.6 g/kg 体重（约占总热量 20%），保障脂溶性维生素与激素合成。
  // 依据：jager2017jissn（ISSN 立场声明：脂肪不宜长期过低）、helms2014jissn
  const FAT_MIN_PER_KG = 0.6;

  // 膳食纤维：循证最优区间 25–29 g/d（剂量反应显示该区间关键结局风险降幅最大）。
  // 依据：reynolds2019lancet（185 项前瞻研究 + 58 项临床试验的系列 meta 分析）
  // 注意：常见资料引用的 38 g/d 与「14 g/1000 kcal」在本证据库中没有可靠来源，故不采用。
  const FIBER = { min: 25, max: 29 };

  // 睡眠：下限 7 h。依据：china-weight-management-2024（建议每日 7 小时睡眠）、
  // nedeltcheva2010anninternmed（8.5h 相比 5.5h，减掉的脂肪占比高 55%、去脂体重丢失少 60%）、
  // wang2018sleep（睡眠限制显著降低减重中脂肪的占比，且补觉不能完全逆转）
  // 本证据库没有睡眠时长上限的来源，因此不设上限。
  const SLEEP = { min: 7, max: null };

  // 饮水：约 30–35 ml/kg，运动日额外补 500–1000 ml。
  const WATER_ML_PER_KG = 33;

  // 体脂率分级：ACE/ACSM 常用的九段分类，仅用于展示分级，**不是本证据库的来源**。
  // 证据库里唯一可核实的体脂阈值是 ode2007msse 的「体脂过高」判定：男 >20%、女 >33%。
  const BODY_FAT_OVERFAT = { male: 20, female: 33 };
  const BODY_FAT_TABLE = {
    male: [
      { label: '必需脂肪', max: 5 },
      { label: '运动员', min: 5, max: 13 },
      { label: '健康偏低', min: 13, max: 17 },
      { label: '健康', min: 17, max: 24 },
      { label: '偏高', min: 24, max: 30 },
      { label: '肥胖', min: 30 }
    ],
    female: [
      { label: '必需脂肪', max: 13 },
      { label: '运动员', min: 13, max: 20 },
      { label: '健康偏低', min: 20, max: 24 },
      { label: '健康', min: 24, max: 31 },
      { label: '偏高', min: 31, max: 37 },
      { label: '肥胖', min: 37 }
    ]
  };

  // 中国成人 BMI 分类（WS/T 428-2013 与《中国成人超重和肥胖症预防控制指南》）
  const BMI_TABLE_CN = [
    { label: '偏瘦', max: 18.5, tone: 'warn' },
    { label: '正常', min: 18.5, max: 24, tone: 'ok' },
    { label: '超重', min: 24, max: 28, tone: 'warn' },
    { label: '肥胖', min: 28, tone: 'bad' }
  ];
  // WHO 国际标准，仅作对照展示
  const BMI_TABLE_WHO = [
    { label: '偏瘦', max: 18.5, tone: 'warn' },
    { label: '正常', min: 18.5, max: 25, tone: 'ok' },
    { label: '超重', min: 25, max: 30, tone: 'warn' },
    { label: '肥胖', min: 30, tone: 'bad' }
  ];

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const round = (v, d = 1) => {
    const f = Math.pow(10, d);
    return Math.round(v * f) / f;
  };
  const sum = (arr, f) => arr.reduce((a, b) => a + (f ? f(b) : b), 0);

  /* ------------------------------------------------------------------
   * 1. 基础指标：BMI / 体脂率 / 去脂体重
   * ------------------------------------------------------------------ */

  function bmi(heightCm, weightKg) {
    if (!heightCm || !weightKg) return null;
    const m = heightCm / 100;
    return weightKg / (m * m);
  }

  function bmiCategory(value, standard) {
    const table = standard === 'WHO' ? BMI_TABLE_WHO : BMI_TABLE_CN;
    for (const row of table) {
      const lo = row.min == null ? -Infinity : row.min;
      const hi = row.max == null ? Infinity : row.max;
      if (value >= lo && value < hi) return row;
    }
    return table[table.length - 1];
  }

  function healthyWeightRange(heightCm, standard) {
    const m = heightCm / 100;
    const lo = standard === 'WHO' ? 18.5 : 18.5;
    const hi = standard === 'WHO' ? 24.9 : 23.9;
    return { min: round(lo * m * m, 1), max: round(hi * m * m, 1) };
  }

  /**
   * 没有体脂数据时，用 BMI + 年龄 + 性别估算体脂率。
   * 依据：deurenberg1991bjn（BF% = 1.20×BMI + 0.23×age − 10.8×sex − 5.4，sex: 男=1 女=0）
   * 注意：这是群体回归公式，个体误差可达 ±4–5 个百分点，界面上会标注「估算值」。
   */
  function estimateBodyFatFromBMI(sex, age, bmiValue) {
    const s = sex === 'male' ? 1 : 0;
    const bf = 1.20 * bmiValue + 0.23 * age - 10.8 * s - 5.4;
    return clamp(bf, 2, 60);
  }

  function bodyFatCategory(sex, bf) {
    const rows = BODY_FAT_TABLE[sex === 'female' ? 'female' : 'male'];
    for (const row of rows) {
      const lo = row.min == null ? -Infinity : row.min;
      const hi = row.max == null ? Infinity : row.max;
      if (bf >= lo && bf < hi) return row;
    }
    return rows[rows.length - 1];
  }

  function leanMass(weightKg, bodyFatPct) {
    return weightKg * (1 - bodyFatPct / 100);
  }

  function fatMass(weightKg, bodyFatPct) {
    return weightKg * (bodyFatPct / 100);
  }

  /* ------------------------------------------------------------------
   * 2. 静息代谢率（RMR）与总消耗（TDEE）
   * ------------------------------------------------------------------ */

  /** Mifflin-St Jeor（不知道体脂率时的首选）。依据：mifflin1990ajcn */
  function rmrMifflin(p) {
    const s = p.sex === 'male' ? 5 : -161;
    return 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + s;
  }

  /** Katch-McArdle（已知体脂率时更准，因为它只跟去脂体重有关）。依据：frankenfield2005jada */
  function rmrKatch(leanKg) {
    return 370 + 21.6 * leanKg;
  }

  /** Cunningham。依据：cunningham1980ajcn */
  function rmrCunningham(leanKg) {
    return 500 + 22 * leanKg;
  }

  /**
   * 选一个 RMR：有实测体脂率就用 Katch 与 Cunningham 的均值（两者都基于去脂体重，
   * 取均值可减小单一公式偏差），否则用 Mifflin-St Jeor。
   */
  function computeRMR(p) {
    const mifflin = rmrMifflin(p);
    const hasBf = p.bodyFatPct != null && p.bodyFatPct > 0;
    const lm = hasBf ? leanMass(p.weightKg, p.bodyFatPct) : null;
    const katch = hasBf ? rmrKatch(lm) : null;
    const cunningham = hasBf ? rmrCunningham(lm) : null;
    if (hasBf) {
      return {
        value: round((katch + cunningham) / 2, 0),
        method: 'Katch-McArdle + Cunningham 均值（基于去脂体重）',
        evidence: ['frankenfield2005jada', 'cunningham1980ajcn'],
        detail: { mifflin: round(mifflin, 0), katch: round(katch, 0), cunningham: round(cunningham, 0), leanKg: round(lm, 1) }
      };
    }
    return {
      value: round(mifflin, 0),
      method: 'Mifflin-St Jeor（未提供体脂率）',
      evidence: ['mifflin1990ajcn', 'frankenfield2005jada'],
      detail: { mifflin: round(mifflin, 0) }
    };
  }

  /**
   * 日常活动系数（PAL）：只由「非运动」的日常活动量（步数 / 生活形态）决定，
   * 结构化运动的热量单独用 MET 计算后相加，避免重复计算。
   * 依据：westerterp2013frontphysiol（可持续生活方式的 PAL 为 1.1–2.5，
   *       常见平均 1.4–1.8，职业耐力运动员可达约 4.0）
   */
  const STEP_PAL = [
    { max: 3000, pal: 1.40, label: '久坐（<3000 步）' },
    { max: 7000, pal: 1.50, label: '轻度活动（3000–7000 步）' },
    { max: 12000, pal: 1.60, label: '中度活动（7000–12000 步，典型校园通勤）' },
    { max: Infinity, pal: 1.70, label: '高度活动（>12000 步 / 体力工作）' }
  ];

  function palFromSteps(steps) {
    const s = steps == null ? 10000 : steps;
    for (const row of STEP_PAL) if (s < row.max) return row;
    return STEP_PAL[STEP_PAL.length - 1];
  }

  /** 运动的净消耗：kcal = (MET − 1) × 体重kg × 小时。减 1 是扣掉「躺着也要消耗」的那部分。 */
  function activityKcal({ met, weightKg, minutes, net = true }) {
    const m = net ? Math.max(met - 1, 0.6) : met;
    return round((m * weightKg * minutes) / 60, 0);
  }

  /**
   * 能量补偿：额外运动消耗平均只有约 72% 会体现在当日总能耗上，
   * 剩下的被静息代谢下降、日常活动减少等「补偿」掉了。
   * 依据：careau2021currbiol（n=1754 双标水：平均补偿 28%）、pontzer2016currbiol
   */
  function compensatedKcal(rawKcal) {
    return round(rawKcal * EXERCISE_COMPENSATION, 0);
  }

  /** 一周运动的日均「计入 TDEE」的净消耗（已按 0.72 补偿系数折算）。 */
  function averageDailyExerciseKcal(weeklySessions, weightKg) {
    if (!weeklySessions || !weeklySessions.length) return 0;
    const total = sum(weeklySessions, (s) => compensatedKcal(activityKcal({ met: s.met, weightKg, minutes: s.minutes })));
    return round(total / 7, 0);
  }

  function computeTDEE(p, opts) {
    const o = opts || {};
    const rmr = o.rmr || computeRMR(p);
    const pal = palFromSteps(p.steps);
    const eat = o.avgExerciseKcal || 0;
    const base = rmr.value * pal.pal;
    return {
      value: round(base + eat, 0),
      rmr: rmr.value,
      rmrMethod: rmr.method,
      rmrEvidence: rmr.evidence,
      rmrDetail: rmr.detail,
      pal: pal.pal,
      palLabel: pal.label,
      palEvidence: ['westerterp2013frontphysiol'],
      exerciseKcal: eat,
      note: 'TDEE = RMR × 日常活动系数 + 运动净消耗。运动不重复计入活动系数。'
    };
  }

  /* ------------------------------------------------------------------
   * 3. 热量缺口与每日目标摄入
   * ------------------------------------------------------------------ */

  function speedPreset(key) {
    return SPEED_PRESETS[key] || SPEED_PRESETS.standard;
  }

  /**
   * 由「减脂速度」反推每日热量缺口，并施加三层安全约束：
   *   ① 缺口不超过 TDEE 的 30%（体脂偏低时 25%）
   *   ② 摄入不低于性别硬下限（男 1500 / 女 1200 kcal）
   *   ③ 摄入不低于自身 RMR（低于 RMR 的方案必须有医生监督）
   */
  function computeIntakePlan(p, tdee, speedKey) {
    const preset = speedPreset(speedKey);
    const sex = p.sex === 'female' ? 'female' : 'male';
    const isLean = sex === 'male'
      ? (p.bodyFatPct != null ? p.bodyFatPct < 15 : false)
      : (p.bodyFatPct != null ? p.bodyFatPct < 23 : false);
    const maxRatio = isLean ? MAX_DEFICIT_RATIO.lean : MAX_DEFICIT_RATIO.default;

    const targetWeeklyKg = preset.weeklyKgFactor * p.weightKg;
    const wantedDeficit = Math.round((targetWeeklyKg * KCAL_PER_KG) / 7);
    const capDeficit = Math.round(tdee.value * maxRatio);
    let deficit = Math.min(wantedDeficit, capDeficit);

    const floorHard = MIN_INTAKE[sex];
    const floorRMR = Math.round(tdee.rmr);
    let intake = tdee.value - deficit;
    const notes = [];

    if (deficit < wantedDeficit) {
      notes.push(`按「${preset.label}」档本应缺口 ${wantedDeficit} kcal，但已限制在 TDEE 的 ${Math.round(maxRatio * 100)}%（${capDeficit} kcal）：每周下降速度不应超过体重的 1%，否则瘦体重流失明显增加。`);
      deficit = capDeficit;
      intake = tdee.value - deficit;
    }
    if (intake < floorRMR) {
      notes.push(`热量被抬到你的静息代谢（${floorRMR} kcal）附近；长期低于 RMR 的方案需要医生或营养师监督。`);
      intake = floorRMR;
      deficit = tdee.value - intake;
    }
    if (intake < floorHard) {
      notes.push(`触发硬下限：${sex === 'male' ? '男' : '女'}性每日不宜低于 ${floorHard} kcal（该数值取自文献中已安全执行过的热量限制处方下限，属于保守地板值，不是推荐摄入量）。`);
      intake = floorHard;
      deficit = Math.max(tdee.value - intake, 0);
    }
    if (intake < VLCD_THRESHOLD) {
      notes.push(`计算出的热量低于 ${VLCD_THRESHOLD} kcal/d，已落入「极低热量饮食（VLCD）」范围：必须医学监督，且长期减重效果并不优于常规低热量饮食。本工具不会给你低于该值的方案。`);
      intake = VLCD_THRESHOLD;
      deficit = Math.max(tdee.value - intake, 0);
    }
    intake = Math.round(intake);
    const actualWeeklyKg = round((deficit * 7) / KCAL_PER_KG, 2);
    const actualPct = round((actualWeeklyKg / p.weightKg) * 100, 2);

    return {
      speed: preset.key,
      speedLabel: preset.label,
      speedDesc: preset.desc,
      deficit,
      capDeficit,
      wantedDeficit,
      maxDeficitRatio: maxRatio,
      intake,
      floorRMR,
      floorHard,
      vlcdThreshold: VLCD_THRESHOLD,
      weeklyKg: actualWeeklyKg,
      weeklyPct: actualPct,
      clamped: notes.length > 0,
      notes,
      evidence: ['helms2014jissn', 'garthe2011ijsnem', 'hall2011lancet', 'tsai2006obesity', 'wadden1993anninternmed', 'liu2022nejm', 'china-weight-management-2024']
    };
  }

  /* ------------------------------------------------------------------
   * 4. 宏量营养素分配
   * ------------------------------------------------------------------ */

  function macroTargets(p, intakeKcal, opts) {
    const o = opts || {};
    const isTraining = o.route === 'training';
    const sex = p.sex === 'female' ? 'female' : 'male';
    const hasBf = p.bodyFatPct != null && p.bodyFatPct > 0;
    const lm = hasBf ? leanMass(p.weightKg, p.bodyFatPct) : null;

    // 蛋白：减脂+抗阻取 2.0 g/kg，纯饮食取 1.8 g/kg，再按去脂体重设上限
    let proteinPerKg = isTraining ? 2.0 : 1.8;
    if (!isTraining) proteinPerKg = 1.8;
    // 体脂很高的人按总体重算会过量，此时按去脂体重 ×2.6 封顶
    let proteinG = proteinPerKg * p.weightKg;
    if (lm && proteinG > lm * PROTEIN.maxPerKgLean) {
      proteinG = lm * PROTEIN.maxPerKgLean;
    }
    proteinG = Math.round(proteinG);

    // 脂肪：先取 0.8 g/kg，且不低于 0.6 g/kg，同时不少于总热量 20%
    let fatG = Math.max(0.8 * p.weightKg, FAT_MIN_PER_KG * p.weightKg);
    const fatKcalMin = 0.2 * intakeKcal;
    if (fatG * 9 < fatKcalMin) fatG = fatKcalMin / 9;
    // 若脂肪+蛋白已超过总热量，压缩脂肪到 0.6 g/kg
    const remainAfter = intakeKcal - proteinG * 4 - fatG * 9;
    if (remainAfter < 0) {
      fatG = Math.max((intakeKcal - proteinG * 4) / 9, FAT_MIN_PER_KG * p.weightKg * 0.8);
    }
    fatG = Math.round(fatG);

    let carbG = Math.round((intakeKcal - proteinG * 4 - fatG * 9) / 4);
    if (carbG < 50) carbG = 50; // 极低热量方案下也保底，避免无法执行的菜单

    // 纤维：在循证最优区间 25–29 g/d 内随热量高低浮动
    const fiberG = Math.round(FIBER.min + (FIBER.max - FIBER.min) * clamp((intakeKcal - 1400) / 1000, 0, 1));

    const kcalCheck = proteinG * 4 + fatG * 9 + carbG * 4;
    return {
      proteinG, fatG, carbG, fiberG,
      proteinPerKg: round(proteinG / p.weightKg, 2),
      fatPerKg: round(fatG / p.weightKg, 2),
      carbPerKg: round(carbG / p.weightKg, 2),
      pct: {
        protein: Math.round((proteinG * 4 / intakeKcal) * 100),
        fat: Math.round((fatG * 9 / intakeKcal) * 100),
        carb: Math.round((carbG * 4 / intakeKcal) * 100)
      },
      kcalFromMacros: Math.round(kcalCheck),
      evidence: isTraining
        ? ['jager2017jissn', 'morton2018bjsm', 'longland2016ajcn', 'cava2017advnutr']
        : ['jager2017jissn', 'gardner2018jama', 'sacks2009nejm', 'johnston2014jama']
    };
  }

  /* ------------------------------------------------------------------
   * 5. 非线性体重投射模型
   * ------------------------------------------------------------------ */

  /**
   * 逐日模拟体重变化。为什么不用「缺口 × 天数 ÷ 7700」？
   * 因为体重下降本身会降低 RMR 与 TDEE，还有代谢适应（adaptive thermogenesis）。
   * 依据：hall2011lancet（动态模型）、leibel1995nejm / rosenbaum2010ijo（代谢适应）、
   *       pontzer2016currbiol（运动带来的能量补偿）
   *
   * @returns {{series: Array, daysToTarget: number|null, weeklyRateKg: number}}
   */
  function projectWeight(p, plan) {
    const days = plan.days || 180;
    const intake = plan.intake;
    const route = plan.route === 'training' ? 'training' : 'diet';
    const pal = plan.pal != null ? plan.pal : palFromSteps(p.steps).pal;
    const eatAvg = plan.avgExerciseKcal || 0;
    const targetWeight = plan.targetWeightKg || null;

    let weight = p.weightKg;
    let bf = p.bodyFatPct != null && p.bodyFatPct > 0
      ? p.bodyFatPct
      : estimateBodyFatFromBMI(p.sex, p.age, bmi(p.heightCm, p.weightKg));
    let lm = leanMass(weight, bf);
    let fm = weight - lm;
    const startWeight = weight;
    const startLean = lm;
    const startBf = bf;

    // 瘦体重流失比例：抗阻训练 + 足量蛋白可把流失压到 10% 左右，
    // 纯饮食限制且蛋白不足时会到 20–30%。体脂越高，流失比例相对越低。
    // 依据：bellicha2021obesrev（抗阻训练使减重期瘦体重丢失减少 0.8 kg，95%CI 0.4–1.3）、
    //       willis2012japplphysiol（只有包含抗阻训练的方案才增加瘦体重）、
    //       longland2016ajcn（高蛋白 + 高强度训练组瘦体重反而增加）
    let leanLossFrac = route === 'training' ? 0.12 : 0.25;
    if (bf >= (p.sex === 'female' ? 38 : 28)) leanLossFrac *= 0.55;
    else if (bf <= (p.sex === 'female' ? 24 : 15)) leanLossFrac = Math.min(0.4, leanLossFrac * 1.4);

    // 关键：投射必须用与 computeTDEE 完全相同的 RMR 基准，否则模型里的
    // 缺口会和界面显示的缺口对不上（曾经用错 Katch 单公式，导致算出的
    // 达标时间比计划慢 30%）。后续每天的 RMR 按去脂体重比例缩放。
    const rmr0 = plan.rmr0 != null ? plan.rmr0 : (370 + 21.6 * lm);
    const rmrOf = (lean) => rmr0 * (lean / startLean);
    const eatOf = (w) => eatAvg * (w / startWeight);   // 体重越轻，同样运动消耗越少
    const tdee0 = rmr0 * pal + eatAvg;
    const rawDeficit = tdee0 - intake;
    // 代谢适应：缺口越大适应越强，约 3 周内逐步建立，上限 200 kcal 左右。
    const adaptMax = clamp(0.10 * Math.max(rawDeficit, 0), 0, 200);

    const series = [];
    let daysToTarget = null;
    const record = (day) => series.push({
      day,
      weightKg: round(weight, 2),
      bodyFatPct: round(bf, 1),
      leanKg: round(lm, 2),
      fatKg: round(fm, 2),
      rmr: Math.round(rmrOf(lm)),
      tdee: Math.round(rmrOf(lm) * pal + eatOf(weight))
    });
    record(0);

    for (let d = 1; d <= days; d++) {
      const ramp = Math.min(1, d / 21);
      const adapt = adaptMax * ramp;
      const tdeeToday = rmrOf(lm) * pal + eatOf(weight) - adapt;
      const balance = intake - tdeeToday;                 // <0 表示亏空
      const dm = balance / KCAL_PER_KG;                   // 总体重变化（kg）
      if (dm < 0) {
        const lost = -dm;
        const leanLost = lost * leanLossFrac;
        lm = Math.max(lm - leanLost, startLean * 0.7);
        fm = Math.max(fm - (lost - leanLost), 0.5);
      } else if (dm > 0) {
        // 盈余时按 75% 脂肪 / 25% 瘦体重增长（抗阻训练会改善这个比例）
        const gain = dm;
        lm += gain * (route === 'training' ? 0.35 : 0.2);
        fm += gain * (route === 'training' ? 0.65 : 0.8);
      }
      weight = lm + fm;
      bf = (fm / weight) * 100;
      record(d);
      if (daysToTarget == null && targetWeight && weight <= targetWeight) daysToTarget = d;
    }

    const firstWeek = series[Math.min(7, series.length - 1)].weightKg;
    return {
      series,
      startWeight: round(startWeight, 2),
      startBodyFatPct: round(startBf, 1),
      daysToTarget,
      weeksToTarget: daysToTarget == null ? null : round(daysToTarget / 7, 1),
      firstWeekLossKg: round(startWeight - firstWeek, 2),
      endWeight: series[series.length - 1].weightKg,
      endBodyFatPct: series[series.length - 1].bodyFatPct,
      leanLossFrac,
      adaptMax: Math.round(adaptMax),
      evidence: ['hall2011lancet', 'leibel1995nejm', 'rosenbaum2010ijo', 'pontzer2016currbiol', 'careau2021currbiol', 'cava2017advnutr', 'bellicha2021obesrev']
    };
  }

  /* ------------------------------------------------------------------
   * 6. 餐次结构与食谱求解
   * ------------------------------------------------------------------ */

  const MEAL_STRUCTURES = {
    '3': { label: '一日三餐', meals: [{ key: 'breakfast', name: '早餐', ratio: 0.30 }, { key: 'lunch', name: '午餐', ratio: 0.40 }, { key: 'dinner', name: '晚餐', ratio: 0.30 }] },
    '3+1': { label: '三餐 + 1 次加餐', meals: [{ key: 'breakfast', name: '早餐', ratio: 0.25 }, { key: 'lunch', name: '午餐', ratio: 0.35 }, { key: 'snack', name: '加餐', ratio: 0.15 }, { key: 'dinner', name: '晚餐', ratio: 0.25 }] },
    '3+2': { label: '三餐 + 2 次加餐', meals: [{ key: 'breakfast', name: '早餐', ratio: 0.25 }, { key: 'snack', name: '上午加餐', ratio: 0.10 }, { key: 'lunch', name: '午餐', ratio: 0.30 }, { key: 'snack2', name: '下午加餐/练前', ratio: 0.10 }, { key: 'dinner', name: '晚餐', ratio: 0.25 }] }
  };

  /**
   * 把全天热量与宏量拆到每一餐。
   * 训练日把一部分热量挪到「练后那一餐 / 加餐」，同时把碳水比例上调、
   * 脂肪比例下调（训练日碳水利用效率更高）。
   * 依据：china-dietary-guidelines-2022（规律三餐）、helms2014jissn（备赛期营养时机）、
   *       jager2017jissn（蛋白分次摄入）
   */
  function mealPlan(structureKey, dayKcal, macros, opts) {
    const o = opts || {};
    const structure = MEAL_STRUCTURES[structureKey] || MEAL_STRUCTURES['3+1'];
    const isTrainDay = !!o.trainDay;
    let meals = structure.meals.map((m) => ({ ...m, kcal: Math.round(dayKcal * m.ratio) }));

    if (isTrainDay) {
      const lunch = meals.find((m) => m.key === 'lunch');
      const post = meals.find((m) => m.key === 'snack') || meals.find((m) => m.key === 'snack2');
      if (lunch && post) {
        const shift = Math.round(lunch.kcal * 0.14);
        lunch.kcal -= shift;
        post.kcal += shift;
        post.isPostWorkout = true;
      }
    }

    // 分餐宏量：按蛋白均分、碳水向训练前后倾斜（练前/练后那餐多 10%，早餐少一点留给易执行）
    const totalP = macros.proteinG, totalF = macros.fatG, totalC = macros.carbG;
    const carbWeights = meals.map((m) => {
      let w = m.ratio;
      if (m.isPostWorkout) w *= 1.3;
      if (m.key === 'breakfast') w *= 0.95;
      return w;
    });
    const carbWSum = sum(carbWeights);
    meals = meals.map((m, i) => ({
      ...m,
      proteinG: Math.round(totalP * m.ratio),
      fatG: Math.round(totalF * m.ratio),
      carbG: Math.round(totalC * (carbWeights[i] / carbWSum)),
      fiberG: Math.round(macros.fiberG * m.ratio)
    }));
    return { structure: structure.label, structureKey, meals, evidence: ['china-dietary-guidelines-2022', 'helms2014jissn', 'jager2017jissn'] };
  }

  /* ---- 食物池工具 ---- */

  const PROTEIN_CATS = ['畜肉', '禽肉', '内脏', '水产', '蛋类', '豆制品', '奶及奶制品', '运动营养'];
  const CARB_CATS = ['主食', '谷薯杂豆', '水果'];
  const VEG_CATS = ['蔬菜', '菌藻'];
  const FAT_CATS = ['坚果种子', '油脂'];

  const per100 = (f) => ({
    kcal: +f.kcal || 0, protein: +f.protein || 0, fat: +f.fat || 0,
    carb: +f.carb || 0, fiber: +f.fiber || 0
  });

  function foodMacros(food, grams) {
    const b = per100(food);
    const k = grams / 100;
    return {
      kcal: b.kcal * k, protein: b.protein * k, fat: b.fat * k,
      carb: b.carb * k, fiber: b.fiber * k
    };
  }

  /** 简易可复现随机数：同一 seed + 同一天永远给同一套菜单，换菜就是 seed+1 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /**
   * 判断某食物是否被饮食限制排除。
   * 采用「标签 + 关键词」双保险：数据里的 tags 可能不全，关键词兜底。
   * 请注意：这里只做粗筛，界面会明确提示用户自己核对配料表。
   */
  const RESTRICTION_RULES = {
    noPork: {
      keywords: ['猪', '培根', '火腿', '腊肠', '香肠', '排骨', '五花', '猪蹄', '叉烧', '肉松', '里脊肉', '午餐肉'],
      allow: [], msg: '不吃猪肉'
    },
    noBeef: {
      // 用「牛肉」而不是「牛」，否则会误伤牛奶、牛油果这类不含牛肉的食物
      keywords: ['牛肉', '牛排', '肥牛', '牛腩', '牛腱', '牛肋', '牛尾', '牛筋', '牛肚', '牛杂', '牛腩面', '水煮牛肉', '小炒黄牛'],
      allow: [], msg: '不吃牛肉'
    },
    noSeafood: {
      keywords: ['鱼', '虾', '蟹', '贝', '鱿', '海参', '三文鱼', '蛤', '蛎', '海鲜', '沙丁', '带鱼', '秋刀', '鳕', '鲈', '鲅', '扇贝', '花甲', '海带', '紫菜', '小鱼干'],
      // 「鱼香肉丝」并没有鱼，这类菜名要放行
      allow: [/鱼香/], msg: '不吃水产'
    },
    vegetarian: {
      // 蛋奶素：排除所有肉类，但必须放行鸡蛋、牛奶、豆腐等
      keywords: ['猪', '牛', '羊', '鸡肉', '鸡胸', '鸡腿', '鸡翅', '鸡爪', '鸡排', '鸡块', '鸡丁', '鸡柳', '鸡米花', '炸鸡', '烤鸡', '烧鸡', '鸭', '鹅', '鱼', '虾', '蟹', '贝', '肉', '培根', '火腿', '腊肠', '排骨', '五花', '内脏', '肝', '毛肚', '蹄', '肘', '翅', '肠', '肚', '骨', '丸', '蛤', '蛎', '鱿', '海鲜'],
      allow: [/鸡蛋/, /鸡毛菜/, /鸡蛋羹/, /鸭蛋/], msg: '蛋奶素'
    },
    vegan: {
      keywords: ['猪', '牛', '羊', '鸡', '鸭', '鹅', '鱼', '虾', '蟹', '贝', '肉', '蛋', '奶', '乳', '酪', '芝士', '蜂蜜', '培根', '火腿', '腊肠', '骨', '肠', '肝', '海鲜'],
      allow: [/豆奶/, /豆浆/, /椰奶/, /燕麦奶/, /杏仁奶/, /植物奶/, /腐乳/, /牛油果/, /肉桂/, /鸡蛋果/], msg: '纯素'
    },
    lactoseFree: {
      keywords: ['牛奶', '酸奶', '奶酪', '乳清', '乳', '芝士', '奶油', '炼乳', '奶昔', '奶茶', '双皮奶', '奶皮'],
      allow: [/豆奶/, /椰奶/, /燕麦奶/, /杏仁奶/, /豆浆/, /无乳糖/, /舒化奶/, /腐乳/, /乳鸽/, /奶白菜/], msg: '乳糖不耐'
    },
    halal: {
      keywords: ['猪', '培根', '火腿', '腊肠', '香肠', '排骨', '五花', '料酒', '肉松', '午餐肉'],
      // 清真判定最终仍要用户自己核对配料表，这里只能粗筛
      allow: [/鸡肉肠/], msg: '清真'
    }
  };

  function foodBlocked(food, restrictions, dislikes) {
    const name = (food.name || '') + ' ' + (food.aliases || []).join(' ');
    const tags = food.tags || [];
    for (const r of restrictions || []) {
      const rule = RESTRICTION_RULES[r];
      if (!rule) continue;
      if (tags.includes(rule.msg)) return r;
      if ((rule.allow || []).some((re) => re.test(name))) continue;
      if (rule.keywords.some((k) => name.includes(k))) return r;
    }
    for (const d of dislikes || []) {
      if (d && name.includes(d)) return 'dislike';
    }
    return null;
  }

  function roleOf(food) {
    const b = per100(food);
    const cat = food.category || '';
    const proteinDensity = b.kcal > 0 ? (b.protein * 4) / b.kcal : 0;
    if (PROTEIN_CATS.includes(cat) && b.protein >= 6 && proteinDensity >= 0.25) return 'protein';
    if (CARB_CATS.includes(cat) && b.carb >= 8) return 'carb';
    if (VEG_CATS.includes(cat)) return 'veg';
    if (FAT_CATS.includes(cat) && b.fat >= 10) return 'fat';
    if (proteinDensity >= 0.3 && b.protein >= 5) return 'protein';
    if (b.carb >= 12) return 'carb';
    return 'other';
  }

  /**
   * 单餐求解：从候选池里挑「一份蛋白 + 一份主食 + 一份蔬菜 (+ 少量脂肪)」，
   * 用解析法解出克数，使这一餐的热量、蛋白、纤维尽量贴合目标。
   *
   * 打分函数体现优先级：热量贴合 > 蛋白达标 > 纤维达标 > 脂肪不超标 > 份量合理。
   */
  function solveMeal(opts) {
    const { pool, targetKcal, targetProtein, targetFiber } = opts;
    const seed = opts.seed || 1;
    const maxTry = opts.maxTry || 900;
    const rnd = mulberry32(seed * 2654435761 % 2147483647);

    const buckets = { protein: [], carb: [], veg: [], fat: [], other: [] };
    for (const f of pool) {
      const role = roleOf(f);
      if (buckets[role]) buckets[role].push(f);
    }
    // 每个桶按「契合度」排序后取前若干个，再随机打散，兼顾质量与多样性
    buckets.protein.sort((a, b) => (per100(b).protein * 4 / Math.max(per100(b).kcal, 1)) - (per100(a).protein * 4 / Math.max(per100(a).kcal, 1)));
    buckets.carb.sort((a, b) => (per100(b).carb / Math.max(per100(b).kcal, 1)) - (per100(a).carb / Math.max(per100(a).kcal, 1)));
    buckets.veg.sort((a, b) => per100(a).kcal - per100(b).kcal);
    buckets.fat.sort((a, b) => per100(b).fat - per100(a).fat);

    const pick = (arr, n) => shuffle(arr.slice(0, Math.max(n * 2, n)), rnd).slice(0, n);
    const proteins = pick(buckets.protein, 6);
    const carbs = pick(buckets.carb, 6);
    const vegs = pick(buckets.veg.length ? buckets.veg : buckets.other, 4);
    const fats = pick(buckets.fat, 3);

    if (!proteins.length && !carbs.length) return null;

    // 份量上下限：贴近真实一顿饭
    const limits = (role) => role === 'fat' ? { min: 3, max: 20, step: 1 } : { min: 30, max: 400, step: 5 };

    let best = null;
    let tried = 0;
    for (const pFood of (proteins.length ? proteins : [null])) {
      for (const cFood of (carbs.length ? carbs : [null])) {
        for (const vFood of (vegs.length ? vegs : [null])) {
          for (const fFood of [null, ...fats]) {
            if (++tried > maxTry) break;

            // 蔬菜和脂肪先定份量（简单规则），再用线性方程解蛋白与主食克数
            const vG = vFood ? (per100(vFood).kcal <= 40 ? 200 : 150) : 0;
            const fG = fFood ? null : 0;
            const base = [
              vFood ? { food: vFood, grams: vG, role: 'veg' } : null
            ].filter(Boolean);
            const baseM = sum(base, (it) => foodMacros(it.food, it.grams).kcal);
            const baseP = sum(base, (it) => foodMacros(it.food, it.grams).protein);
            const baseF = sum(base, (it) => foodMacros(it.food, it.grams).fat);
            const baseFib = sum(base, (it) => foodMacros(it.food, it.grams).fiber);

            // 解 pG、cG：
            //  kcal:  kp·pG + kc·cG = K − base − fatKcal
            //  prot:  pp·pG + pc·cG = P − baseP
            const kp = pFood ? per100(pFood).kcal / 100 : 0;
            const kc = cFood ? per100(cFood).kcal / 100 : 0;
            const pp = pFood ? per100(pFood).protein / 100 : 0;
            const pc = cFood ? per100(cFood).protein / 100 : 0;

            let fGrams = 0;
            let fatKcal = 0;
            if (fFood) {
              // 脂肪份量取「让本餐脂肪接近目标脂肪」的值，但限制在 5–15 g
              const needFat = Math.max(0, (targetKcal * 0.25) / 9 - baseF);
              fGrams = clamp(Math.round(needFat / (per100(fFood).fat / 100) / 1) || 8, 5, 18);
              fatKcal = per100(fFood).kcal * fGrams / 100;
            }

            let pG = 0, cG = 0;
            const remK = targetKcal - baseM - fatKcal;
            const remP = Math.max(targetProtein - baseP - (fFood ? foodMacros(fFood, fGrams).protein : 0), 0);
            const det = kp * pc - kc * pp;
            if (pFood && cFood && Math.abs(det) > 1e-6) {
              pG = (remK * pc - kc * remP) / det;
              cG = (kp * remP - remK * pp) / det;
            } else if (pFood && pp > 0) {
              pG = remP / pp;
              cG = kc > 0 ? Math.max(remK - kp * pG, 0) / kc : 0;
            } else if (cFood && kc > 0) {
              cG = remK / kc;
            }

            // 边界钳制 + 缺口回填
            if (pFood) pG = clamp(pG, limits('protein').min, 320);
            if (cFood) cG = clamp(cG, 20, 350);
            let items = base.slice();
            if (fFood && fGrams > 0) items.push({ food: fFood, grams: Math.round(fGrams), role: 'fat' });
            if (pFood && pG > 0) items.push({ food: pFood, grams: Math.round(pG / 5) * 5, role: 'protein' });
            if (cFood && cG > 0) items.push({ food: cFood, grams: Math.round(cG / 5) * 5, role: 'carb' });

            // 用主食把热量差补齐（最多再调两次）
            for (let iter = 0; iter < 2; iter++) {
              const tot = sum(items, (it) => foodMacros(it.food, it.grams).kcal);
              const gap = targetKcal - tot;
              const cItem = items.find((it) => it.role === 'carb');
              const pItem = items.find((it) => it.role === 'protein');
              const target = Math.abs(gap) > 45
                ? (cItem || pItem || (fFood ? items.find((it) => it.role === 'fat') : null))
                : null;
              if (!target) break;
              const density = per100(target.food).kcal / 100;
              if (density <= 0) break;
              const delta = Math.round((gap / density) / 5) * 5;
              const lim = limits(target.role);
              const next = clamp(target.grams + delta, lim.min, target.role === 'protein' ? 320 : 350);
              if (next === target.grams) break;
              target.grams = next;
            }

            const tot = {
              kcal: sum(items, (it) => foodMacros(it.food, it.grams).kcal),
              protein: sum(items, (it) => foodMacros(it.food, it.grams).protein),
              fat: sum(items, (it) => foodMacros(it.food, it.grams).fat),
              carb: sum(items, (it) => foodMacros(it.food, it.grams).carb),
              fiber: sum(items, (it) => foodMacros(it.food, it.grams).fiber)
            };
            const kcalErr = Math.abs(tot.kcal - targetKcal) / Math.max(targetKcal, 1);
            const proteinShort = Math.max(0, targetProtein - tot.protein) / Math.max(targetProtein, 1);
            const fiberShort = Math.max(0, (targetFiber || 0) - tot.fiber) / Math.max(targetFiber || 1, 1);
            const fatOver = Math.max(0, tot.fat - targetKcal * 0.4 / 9) / Math.max(targetKcal * 0.4 / 9, 1);
            const itemsCount = items.length;
            const oddPenalty = (itemsCount > 4 ? 0.2 : 0) + (itemsCount < 2 ? 0.3 : 0);
            // jitter：给「得分接近」的组合一点随机扰动，这样点「换一套」才会真的换菜，
            // 而不会因为打分函数不含随机项而永远返回同一套最优解。
            const jitter = rnd() * (opts.jitter == null ? 0.22 : opts.jitter);
            const score = kcalErr * 6 + proteinShort * 5 + fiberShort * 1.6 + fatOver * 2.2 + oddPenalty + jitter;
            if (!best || score < best.score) {
              best = {
                score: round(score, 4),
                items: items.map((it) => ({
                  foodId: it.food.id,
                  name: it.food.name,
                  role: it.role,
                  grams: it.grams,
                  kcal: Math.round(foodMacros(it.food, it.grams).kcal),
                  protein: round(foodMacros(it.food, it.grams).protein, 1),
                  fat: round(foodMacros(it.food, it.grams).fat, 1),
                  carb: round(foodMacros(it.food, it.grams).carb, 1)
                })),
                totals: {
                  kcal: Math.round(tot.kcal), protein: round(tot.protein, 1),
                  fat: round(tot.fat, 1), carb: round(tot.carb, 1), fiber: round(tot.fiber, 1)
                },
                target: { kcal: targetKcal, protein: Math.round(targetProtein), fiber: Math.round(targetFiber || 0) }
              };
            }
          }
          if (tried > maxTry) break;
        }
        if (tried > maxTry) break;
      }
      if (tried > maxTry) break;
    }
    return best;
  }

  /**
   * 生成一日套餐。
   * pool：候选食物（用户勾选的「现有食材」优先，不足时自动补全食物库）
   * seed：换菜用；同一天同一个 seed 结果稳定。
   */
  function buildDailyMenu(opts) {
    const { pool, mealPlanData, seed, pantryFirst } = opts;
    const rnd = mulberry32((seed || 1) * 7919 % 2147483647);
    const result = { meals: [], totals: { kcal: 0, protein: 0, fat: 0, carb: 0, fiber: 0 }, seed: seed || 1, warnings: [] };

    for (const meal of mealPlanData.meals) {
      const mealPool = pool;
      if (!mealPool.length) { result.warnings.push(`${meal.name}：候选食物为空。`); continue; }
      const solved = solveMeal({
        pool: mealPool,
        targetKcal: meal.kcal,
        targetProtein: meal.proteinG,
        targetFiber: meal.fiberG,
        seed: (seed || 1) * 31 + meal.name.length * 7 + Math.floor(rnd() * 1000)
      });
      if (!solved) { result.warnings.push(`${meal.name}：无法在当前食材下凑出合适组合，请多勾几样食材。`); continue; }
      result.meals.push({
        key: meal.key, name: meal.name, isPostWorkout: !!meal.isPostWorkout,
        target: { kcal: meal.kcal, protein: meal.proteinG, carb: meal.carbG, fat: meal.fatG, fiber: meal.fiberG },
        items: solved.items, totals: solved.totals, score: solved.score
      });
      for (const k of Object.keys(result.totals)) result.totals[k] += solved.totals[k];
    }
    for (const k of Object.keys(result.totals)) result.totals[k] = round(result.totals[k], 1);
    result.pantryFirst = !!pantryFirst;
    return result;
  }

  /* ------------------------------------------------------------------
   * 7. 平台期 / 代谢适应判断
   * ------------------------------------------------------------------ */

  function linreg(points) {
    const n = points.length;
    if (n < 3) return null;
    const xs = points.map((_, i) => i);
    const ys = points.map((p) => p.weightKg);
    const mx = sum(xs) / n, my = sum(ys) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
    if (den === 0) return null;
    const slope = num / den;             // kg/天
    return { slopePerDay: slope, slopePerWeek: slope * 7, intercept: my - slope * mx };
  }

  function movingAverage(series, window) {
    const w = window || 7;
    const out = [];
    for (let i = 0; i < series.length; i++) {
      const from = Math.max(0, i - w + 1);
      const slice = series.slice(from, i + 1);
      out.push(round(sum(slice, (p) => p.weightKg) / slice.length, 2));
    }
    return out;
  }

  /**
   * 平台期判断：把最近 14 天的趋势斜率与「计划预期速度」比较。
   * 注意用 7 日移动平均后的数据，否则水分波动会误判。
   * 依据：leibel1995nejm / rosenbaum2010ijo（代谢适应）、byrne2018ijo（饮食间歇 MATADOR 试验）、
   *       donnelly2009msse（提高体力活动量）、nedeltcheva2010anninternmed（睡眠与减脂质量）
   */
  function plateauAnalysis(series, expectedWeeklyKg) {
    const pts = (series || []).filter((p) => p && p.weightKg != null);
    const out = { status: 'insufficient', message: '记录不足 14 天，先坚持每天称重，用 7 日平均看趋势。', suggestions: [], samples: pts.length };
    if (pts.length < 14) return out;

    const last14 = pts.slice(-14);
    const last21 = pts.slice(-21);
    const reg14 = linreg(last14);
    const reg21 = last21.length >= 14 ? linreg(last21) : null;
    const expected14 = Math.abs(expectedWeeklyKg || 0) * 2; // 14 天应有的下降量

    const actual14 = last14[0].weightKg - last14[last14.length - 1].weightKg; // 正数=真的在降
    const ratio = expected14 > 0 ? actual14 / expected14 : 0;

    out.actual14dKg = round(actual14, 2);
    out.expected14dKg = round(expected14, 2);
    out.ratio = round(ratio, 2);
    out.slopePerWeek = round(reg14.slopePerWeek, 3);
    out.slopePerWeek21 = reg21 ? round(reg21.slopePerWeek, 3) : null;

    if (actual14 > expected14 * 0.25 && reg14.slopePerWeek < -0.05) {
      out.status = 'losing';
      out.message = `最近 14 天下降 ${out.actual14dKg} kg（预期 ${out.expected14dKg} kg），处在正常减脂轨道上。`;
      out.suggestions = ['保持当前热量与训练安排，不需要额外加码。', '如果力量训练表现持续下滑、白天精力差，可考虑把速度档位调低一档。'];
    } else if (reg14.slopePerWeek > 0.15) {
      out.status = 'gaining';
      out.message = `最近 14 天体重上升（趋势 +${out.slopePerWeek} kg/周）。先排查记录偏差，再考虑调热量。`;
      out.suggestions = [
        '先连续 5 天如实记录所有入口的东西，包括酱料、油、饮料、坚果、零食——隐性热量是最常见的漏项。',
        '核对份量：食堂一勺油约 10 g ≈ 90 kcal，一勺花生酱约 15 g ≈ 90 kcal。',
        '如果记录确实没问题，说明当前 TDEE 被高估，把每日热量下调 150–200 kcal 后观察两周。'
      ];
    } else if (ratio < 0.35) {
      out.status = 'plateau';
      out.message = `最近 14 天只降了 ${out.actual14dKg} kg（预期 ${out.expected14dKg} kg），相当于预期的 ${Math.round(ratio * 100)}%，符合平台期特征。`;
      out.suggestions = [
        '① 先核对记录，不要急着砍热量：平台期里超过一半是「吃回去了」而不是代谢停了。',
        '② 体重下降后 TDEE 会同步下降，把档案里的体重更新一下，让网站重算热量目标。',
        '③ 提高非运动消耗：每天多走 2000 步，通常比再砍 100 kcal 更容易坚持。',
        '④ 保证蛋白质达标（1.6 g/kg 以上）并坚持每周 2–3 次抗阻训练，这是保住瘦体重的关键。',
        '⑤ 睡眠至少 7 小时：交叉试验显示 8.5 h 与 5.5 h 睡眠相比，减掉的脂肪占比高 55%、瘦体重丢失少 60%。',
        '⑥ 如果连续 3 周以上停滞，可以插入 1 周「维持热量饮食间歇」（把热量提到 TDEE），MATADOR 试验显示这种方式减脂效率更好。',
        '⑦ 平台期超过 6–8 周且伴随怕冷、脱发、月经紊乱、情绪低落，请就医评估。'
      ];

    }
    if (!goal.feasible) warnings.push(...goal.notes);

    const stepGoal = p.steps >= 12000 ? p.steps + 1500 : 10000;

    return {
      input: p,
      bmi: round(bmiValue, 1),
      bmiCategory: bmiCat,
      healthyWeightRange: healthy,
      bodyFatPct: round(bf, 1),
      bodyFatEstimated: bfEstimated,
      bodyFatCategory: bfCat,
      leanKg: round(lm, 1),
      fatKg: round(fm, 1),
      rmr,
      tdee,
      intakePlan,
      macros,
      projection,
      goal,
      bodyFatOverfatThreshold: BODY_FAT_OVERFAT[p.sex],

        fiber: macros.fiberG,

  /* ------------------------------------------------------------------
   * 2. 健身房训练模板（每周 3 次：全身 A/B/C 或 推/拉/腿）
   *    每周 3 次全身训练对自然训练者的增肌效果与分化训练相当，
   *    且每个肌群每周能被刺激 3 次，更适合减脂期保肌。
   * ------------------------------------------------------------------ */
  const GYM_TEMPLATES = {
    fullbody: {
      label: '全身三分化（推荐新手与大体重）',
      days: [
        { name: '全身 A（推为主）', focus: '胸 / 肩 / 三头 / 腿', picks: ['bench_press', 'split_squat', 'lat_pulldown', 'lateral_raise', 'plank'] },
        { name: '全身 B（拉为主）', focus: '背 / 二头 / 腿后 / 核心', picks: ['rdl', 'seated_row', 'db_bench', 'curl', 'deadbug'] },
        { name: '全身 C（腿为主）', focus: '腿 / 臀 / 肩 / 手臂', picks: ['squat', 'hip_thrust', 'ohp', 'pushdown', 'hanging_leg_raise'] }
      ]
    },
    ppl: {
      label: '推 / 拉 / 腿（有训练基础）',
      days: [
        { name: '推（胸肩三头）', focus: '胸 / 肩 / 三头', picks: ['bench_press', 'incline_db', 'ohp', 'lateral_raise', 'pushdown'] },
        { name: '拉（背二头）', focus: '背 / 二头 / 后束', picks: ['pullup', 'seated_row', 'face_pull', 'curl', 'back_extension'] },
        { name: '腿（腿臀核心）', focus: '腿 / 臀 / 核心', picks: ['squat', 'rdl', 'leg_press', 'calf_raise', 'cable_crunch'] }
      ]
    }
  };

  const DORM_ROUTINE = {
    label: '宿舍日（不训练 / 仅拉伸与散步）',
    days: [
      { name: '宿舍拉伸日', focus: '恢复 / 活动度', picks: ['stretch_hip', 'stretch_ham', 'stretch_chest', 'walk'] },
      { name: '宿舍日常', focus: '纯饮食控制，不安排训练', picks: ['walk'] }
    ]
  };

  /* ------------------------------------------------------------------
   * 3. 计划生成
   * ------------------------------------------------------------------ */

  function byId(id) {
    return EXERCISES.find((e) => e.id === id) || null;
  }

  /**
   * 根据器械条件与伤病标签替换动作。
   * 例：没有龙门架就把「龙门架夹胸」换成「哑铃卧推」；
   *     膝盖有伤就把「杠铃深蹲」换成「高脚杯深蹲 / 腿举」。
   */
  const SUBSTITUTES = {
    bench_press: { noGym: 'db_bench', knee: null, shoulder: 'db_bench', back: null },
    squat: { noGym: 'goblet_squat', knee: 'leg_press', shoulder: null, back: 'goblet_squat' },
    rdl: { noGym: 'hip_thrust', knee: null, shoulder: null, back: 'hip_thrust' },
    pullup: { noGym: 'db_row', knee: null, shoulder: 'lat_pulldown', back: 'seated_row' },
    ohp: { noGym: 'lateral_raise', knee: null, shoulder: 'db_press', back: 'db_press' },
    cable_fly: { noGym: 'db_bench', knee: null, shoulder: null, back: null },
    seated_row: { noGym: 'db_row', knee: null, shoulder: null, back: null },
    rower: { noGym: 'walk', knee: null, shoulder: null, back: 'elliptical' },
    treadmill_run: { noGym: 'walk', knee: 'elliptical', shoulder: null, back: null },
    split_squat: { noGym: 'dorm_lunge', knee: 'dorm_glute_bridge', shoulder: null, back: null },
    hanging_leg_raise: { noGym: 'deadbug', knee: null, shoulder: null, back: 'deadbug' },
    cable_crunch: { noGym: 'plank', knee: null, shoulder: null, back: 'deadbug' },
    back_extension: { noGym: 'dorm_glute_bridge', knee: null, shoulder: null, back: 'deadbug' },
    pushdown: { noGym: 'dip', knee: null, shoulder: 'dip', back: null },
    face_pull: { noGym: 'rear_delt', knee: null, shoulder: null, back: null }
  };

  function pickExercise(id, opts) {
    const o = opts || {};
    const equip = o.equipment || [];
    const injuries = o.injuries || [];
    const hasGym = equip.includes('gym_freeweights') || equip.includes('gym_machines') || equip.includes('gym_cable') || equip.includes('gym_cardio');
    let ex = byId(id);
    if (!ex) return null;

    const needs = (e) => e.equipment || [];
    const available = (e) => needs(e).some((n) => {
      if (n === 'none') return true;
      if (n === 'bodyweight') return true;
      if (n === 'band') return equip.includes('band');
      if (n === 'dumbbell') return equip.includes('gym_freeweights') || equip.includes('dumbbell');
      if (n === 'gym') return hasGym;
      if (n === 'machine') return equip.includes('gym_machines');
      if (n === 'cable') return equip.includes('gym_cable');
      return false;
    });

    let reason = null;
    // 伤病优先于器械：先换掉会加重伤处的动作
    for (const inj of injuries) {
      if (ex.tags && ex.tags.includes(inj)) {
        const sub = (SUBSTITUTES[id] || {})[inj];
        if (sub) {
          const s = byId(sub);
          if (s && available(s) && !(s.tags || []).includes(inj)) {
            reason = `${ex.name} 会加大${inj === 'knee' ? '膝' : inj === 'back' ? '腰' : '肩'}的负担，已替换为 ${s.name}`;
            ex = s;
            break;
          }
        }
      }
    }
    // 器械不足再替换
    if (!available(ex)) {
      const sub = (SUBSTITUTES[ex.id] || {}).noGym;
      const s = sub ? byId(sub) : null;
      if (s && available(s) && !(s.tags || []).some((t) => injuries.includes(t))) {
        reason = `没有对应器械，把 ${ex.name} 替换为 ${s.name}`;
        ex = s;
      } else {
        // 找不到替代就退化为自重版本
        const bw = EXERCISES.find((e) => (e.equipment || []).includes('bodyweight') && e.group === ex.group && !(e.tags || []).some((t) => injuries.includes(t)));
        if (bw) {
          reason = `没有对应器械，把 ${ex.name} 替换为自重动作 ${bw.name}`;
          ex = bw;
        }
      }
    }
    return { exercise: ex, reason };
  }

  /**
   * 生成一周训练计划（周一至周日）。
   * @param {Object} opts
   *   opts.gymDaysPerWeek  每周健身房次数（用户选 3）
   *   opts.template        'fullbody' | 'ppl'
   *   opts.equipment       器械清单
   *   opts.injuries        伤病标签 ['knee','back','shoulder']
   *   opts.dormMode        'diet'（纯饮食不练） | 'stretch' | 'light'
   *   opts.tableTennis     { sessionsPerWeek, minutesPerSession, intensity: 'match'|'training'|'casual', days: [] }
   *   opts.sessionMinutes  每次时长
   */
  function buildWeeklyPlan(opts) {
    const o = opts || {};
    const gymDays = Math.max(0, Math.min(6, o.gymDaysPerWeek == null ? 3 : o.gymDaysPerWeek));
    const template = GYM_TEMPLATES[o.template] || GYM_TEMPLATES.fullbody;
    const week = [];
    const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

    // 优先把健身房安排在周一/周三/周五（或 2 次时周二/周五），乒乓球穿插在其余天
    const gymDayIndex = gymDays >= 3 ? [0, 2, 4] : gymDays === 2 ? [1, 4] : gymDays === 1 ? [2] : [];
    while (gymDayIndex.length < gymDays) {
      for (let i = 0; i < 7 && gymDayIndex.length < gymDays; i++) {
        if (!gymDayIndex.includes(i)) gymDayIndex.push(i);
      }
    }
    gymDayIndex.sort((a, b) => a - b);

    const tt = o.tableTennis || {};
    const ttDays = (tt.days && tt.days.length)
      ? tt.days.slice()
      : (tt.sessionsPerWeek ? pickEvenly(7, tt.sessionsPerWeek).filter((d) => !gymDayIndex.includes(d)) : []);

    for (let i = 0; i < 7; i++) {
      const day = { dayIndex: i, dayName: dayNames[i], blocks: [], kcal: 0, type: 'rest' };
      const gymSlot = gymDayIndex.indexOf(i);
      if (gymSlot >= 0) {
        const tpl = template.days[gymSlot % template.days.length];
        const picks = tpl.picks.map((id) => pickExercise(id, o)).filter(Boolean);
        day.type = 'gym';
        day.title = tpl.name;
        day.focus = tpl.focus;
        day.blocks.push({ kind: 'warmup', name: '热身', detail: '5–8 分钟：快走/椭圆机 + 动态拉伸（肩、髋、踝）+ 空杆/轻重量做 1 组热身组' });
        picks.forEach((p) => {
          day.blocks.push({
            kind: 'strength',
            exerciseId: p.exercise.id,
            name: p.exercise.name,
            group: p.exercise.group,
            sets: p.exercise.sets,
            reps: p.exercise.reps,
            rest: p.exercise.rest,
            met: p.exercise.met || null,
            cue: p.exercise.cue,
            substitutedReason: p.reason
          });
        });
        day.blocks.push({ kind: 'cardio', name: '收尾有氧', detail: `${((o.cardioMinutes != null) ? o.cardioMinutes : 15)} 分钟：坡度快走或椭圆机，心率保持在能说话但略喘的强度` });
        day.blocks.push({ kind: 'cooldown', name: '拉伸', detail: '5 分钟静态拉伸：胸、髋屈肌、大腿后侧' });
        day.minutes = o.sessionMinutes || 50;
      } else if (ttDays.includes(i)) {
        const intensity = tt.intensity || 'match';
        const met = intensity === 'training' ? 6.8 : intensity === 'casual' ? 3.5 : 4.8;
        const minutes = tt.minutesPerSession || 90;
        day.type = 'tabletennis';
        day.title = intensity === 'training' ? '乒乓球训练/多球' : intensity === 'casual' ? '乒乓球（休闲双打）' : '乒乓球对抗（单打/比赛）';
        day.tableTennis = { met, minutes, intensity };
        day.blocks.push({ kind: 'warmup', name: '热身', detail: '5 分钟：手腕脚踝活动 + 小步移动 + 徒手挥拍' });
        day.blocks.push({ kind: 'tabletennis', name: day.title, met, minutes, detail: `MET ${met}（${intensity === 'training' ? 'Sperlich 2011 实测训练均值 6.8' : intensity === 'casual' ? '休闲强度估算值' : 'Sperlich 2011 实测比赛均值 4.8'}）` });
        day.blocks.push({ kind: 'strength', name: '球后补充（可选）', detail: '如果当天不打球以外还想练：3 组俯卧撑 + 3 组臀桥 + 平板支撑 2 分钟，共 10 分钟' });
        day.minutes = minutes;
      } else {
        const dormMode = o.dormMode || 'stretch';
        day.type = 'dorm';
        if (dormMode === 'diet') {
          day.title = '宿舍日（纯饮食，不安排训练）';
          day.blocks.push({ kind: 'note', name: '今天只做饮食控制', detail: '按食谱执行，不做训练。散散步就够——不训练的日子靠饮食缺口照样在减脂。' });
        } else {
          day.title = '宿舍日（拉伸 + 散步）';
          day.blocks.push({ kind: 'stretch', name: '拉伸 10 分钟', detail: '髋屈肌、大腿后侧、门框胸肩拉伸各 30 秒 × 2 组' });
          day.blocks.push({ kind: 'cardio', name: '散步 20–30 分钟', detail: '饭后走一走，MET 约 3.5，帮你在不计入训练的前提下多消耗 80–140 kcal' });
        }
        day.minutes = dormMode === 'diet' ? 0 : 30;
      }
      week.push(day);
    }
    return {
      week,
      template: template.label,
      gymDays,
      tableTennisDays: ttDays.map((i) => dayNames[i]),
      summary: summarizeWeek(week),
      evidence: ['bellicha2021obesrev', 'willis2012japplphysiol', 'cava2017advnutr', 'donnelly2009msse', 'who2020bjsm', 'keating2017obesrev', 'ainsworth2011msse', 'sperlich2011ijspp']
    };
  }

  /** 把 n 次安排尽量均匀地分布到一周 7 天里 */
  function pickEvenly(total, n) {
    const out = [];
    if (n <= 0) return out;
    const step = total / n;
    for (let i = 0; i < n; i++) out.push(Math.min(total - 1, Math.floor(i * step + step / 2)));
    return Array.from(new Set(out));
  }

  function summarizeWeek(week) {
    const strengthDays = week.filter((d) => d.type === 'gym').length;
    const ttDays = week.filter((d) => d.type === 'tabletennis').length;
    const dormDays = week.filter((d) => d.type === 'dorm').length;
    const cardioMin = week.reduce((a, d) => a + (d.type === 'gym' ? 15 : 0) + (d.type === 'tabletennis' ? (d.tableTennis ? d.tableTennis.minutes : 90) : 0) + (d.type === 'dorm' && d.blocks.some((b) => b.kind === 'cardio') ? 25 : 0), 0);
    const strengthMin = week.reduce((a, d) => a + (d.type === 'gym' ? (d.minutes || 50) : 0), 0);
    return { strengthDays, tableTennisDays: ttDays, dormDays, restDays: 7 - strengthDays - ttDays - dormDays, cardioMin, strengthMin };
  }

  /** 用 MET 算某天的运动消耗（原始值，界面会同时显示「折算后计入」的数值） */
  function sessionKcal(weightKg, met, minutes) {
    const net = Math.max(met - 1, 0.6);
    return Math.round((net * weightKg * minutes) / 60);
  }

  /* ------------------------------------------------------------------
   * 4. 一日三餐 / 训练 / 乒乓球 的每日执行清单
   * ------------------------------------------------------------------ */
  function dayChecklist(dayPlan, opts) {
    const o = opts || {};
    const out = [];
    if (dayPlan.type === 'gym') {
      out.push({ text: `健身房训练：${dayPlan.title}（约 ${dayPlan.minutes} 分钟）`, tag: '训练' });
      out.push({ text: '练前 1–2 小时吃一份含碳水的加餐（如香蕉 + 酸奶），练后按食谱吃「练后加餐」', tag: '饮食' });
      out.push({ text: `有氧收尾 15 分钟：坡度快走或椭圆机`, tag: '有氧' });
    } else if (dayPlan.type === 'tabletennis') {
      const tt = dayPlan.tableTennis;
      out.push({ text: `乒乓球 ${tt.minutes} 分钟（MET ${tt.met}），约消耗 ${sessionKcal(o.weightKg || 70, tt.met, tt.minutes)} kcal`, tag: '乒乓球' });
      out.push({ text: '打球当天比宿舍日多吃一份主食（约 100–150 kcal），补回部分消耗，不影响缺口', tag: '饮食' });
    } else {
      out.push({ text: '宿舍日：只做饮食控制，散步 20–30 分钟即可', tag: '恢复' });
    }
    out.push({ text: `蛋白质目标 ${o.proteinG || '—'} g：优先把三餐的肉蛋奶豆腐吃够`, tag: '饮食' });
    out.push({ text: `膳食纤维目标 ${o.fiberG || 25}–29 g：每天 400–500 g 蔬菜 + 一份水果`, tag: '饮食' });
    out.push({ text: `饮水 ${o.waterMl || 2000} ml，睡眠至少 7 小时`, tag: '恢复' });
    return out;
  }

  /* ------------------------------------------------------------------
   * 5. MET 备用表
   *    优先用 data/activities.json 里子代理联网核实过的 MET 值；
   *    这份内置表只用于「数据文件缺条目」时兜底，并标注可信度：
   *      high   = 有原始研究或汇编行文本可核对
   *      medium = 常见引用值，多来源一致
   *      low    = 估算（例如乒乓球的休闲双打强度）
   * ------------------------------------------------------------------ */
  const MET_FALLBACK = [
    // 乒乓球：Sperlich 2011（IJSPP 6(2):234-242，PMID 21725108）实测
    { id: 'tt_match', name: '乒乓球·对抗/比赛（单打）', met: 4.8, category: '球类', confidence: 'high', note: 'Sperlich 2011 实测比赛均值 4.8 ± 1.4 METs（峰值 9.6）' },
    { id: 'tt_training', name: '乒乓球·训练/多球', met: 6.8, category: '球类', confidence: 'high', note: 'Sperlich 2011 实测训练课均值 6.8 ± 2.0 METs（峰值 11.2）' },
    { id: 'tt_casual', name: '乒乓球·休闲双打', met: 3.5, category: '球类', confidence: 'low', note: '休闲强度估算值：低于正式比赛的 4.8，与快走相当' },

    { id: 'standing', name: '站着上课/办公', met: 1.8, category: '日常', confidence: 'medium', note: '' },
    { id: 'sedentary', name: '久坐（上课、自习）', met: 1.3, category: '日常', confidence: 'medium', note: '' }
  ];

  /**
   * 乒乓球 MET 的优先级修正：
   * 外部数据文件里给的是 2011 汇编的「乒乓球通用条目 4.0 METs」，
   * 但 Sperlich 2011 用便携气体分析仪实测了同项目：比赛均值 4.8 ± 1.4、
   * 训练课均值 6.8 ± 2.0 METs。直接测量优于通用查表，所以这里强制用实测值，
   * 并把汇编值作为「保守下限」写进说明，而不是丢掉它。
   */
  const MEASURED_MET_OVERRIDES = {
    tt_match: {

      confidence: 'high', evidenceId: 'sperlich2011ijspp'

      confidence: 'medium', evidenceId: 'ainsworth2011msse'
    },
    tt_training: {
      met: 6.8,
      name: '乒乓球·训练/多球',
      note: 'Sperlich 2011 实测训练课均值 6.8 ± 2.0 METs（峰值 11.2），是本次能查到的最贴近真实训练强度的数值。',
      confidence: 'high', evidenceId: 'sperlich2011ijspp'
    }
  };

  /** 合并外部 MET 表与内置兜底表：外部优先，缺失的用内置补，最后应用实测值修正 */
  function mergeMetTable(external) {
    const map = new Map();
    MET_FALLBACK.forEach((m) => map.set(m.id, m));
    (external || []).forEach((m) => {
      if (!m || m.met == null) return;
      const key = m.id || m.name;
      map.set(key, { ...(map.get(key) || {}), ...m, id: key, confidence: m.verified === true ? 'high' : (m.confidence || 'medium') });
    });
    Object.keys(MEASURED_MET_OVERRIDES).forEach((id) => {
      const ov = MEASURED_MET_OVERRIDES[id];
      const base = map.get(id) || {};
      map.set(id, { ...base, ...ov, id });
    });
    return Array.from(map.values()).sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.met - b.met);
  }

  return {
    EXERCISES, GYM_TEMPLATES, DORM_ROUTINE, SUBSTITUTES, MET_FALLBACK, MEASURED_MET_OVERRIDES,
    byId, pickExercise, buildWeeklyPlan, pickEvenly, summarizeWeek, sessionKcal, dayChecklist,
    mergeMetTable
  };

<script>
/* =====================================================================
 * 图表模块 charts.js —— 纯 canvas 手写，不引入任何第三方库，
 * 目的：整个网站必须是「单文件 + 完全离线」，所以不能用 CDN 上的图表库。
 * 支持：折线图（体重/体脂趋势 + 计划投影 + 目标线）、甜甜圈（宏量占比）、
 *       柱状图（每日热量/依从度）。全部自适应 DPR 与容器宽度。
 * ===================================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.FLCharts = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const PALETTE = {
    grid: 'rgba(255,255,255,0.08)',
    axis: 'rgba(255,255,255,0.35)',
    text: 'rgba(255,255,255,0.62)',
    textStrong: 'rgba(255,255,255,0.9)',
    weight: '#4ade80',
    weightRaw: 'rgba(74,222,128,0.28)',
    fat: '#60a5fa',
    lean: '#f59e0b',
    project: 'rgba(255,255,255,0.45)',
    target: '#f472b6',
    protein: '#60a5fa',
    carb: '#4ade80',
    fatMacro: '#f59e0b',
    danger: '#f87171',
    accent: '#22d3ee'
  };

  const FONT = '12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
  const FONT_SMALL = '11px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
  const FONT_BOLD = 'bold 13px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';

  function setup(canvas, cssHeight) {
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || canvas.parentElement.clientWidth || 320;
    const h = cssHeight || canvas.clientHeight || 200;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, h);
    ctx.font = FONT;
    return { ctx, w: cssWidth, h, dpr };
  }

  function niceTicks(min, max, count) {
    const n = count || 5;
    // 防御：上下界反了（或相等）也要给出可用刻度，否则会出现空数组 → 图表全空
    if (min > max) { const t = min; min = max; max = t; }
    if (!isFinite(min) || !isFinite(max) || min === max) { min -= 1; max += 1; }
    const span = max - min;
    const step0 = span / n;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const start = Math.floor(min / step) * step;
    const end = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = start; v <= end + step * 0.5; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return ticks;
  }

  function fmtNum(v, digits) {
    const d = digits == null ? (Math.abs(v) >= 100 ? 0 : 1) : digits;
    return Number(v).toFixed(d).replace(/\.0+$/, '');
  }

  /* ------------------------------------------------------------------
   * 折线图
   * opts = {
   *   lines: [{ points: [{x, y}], color, width, dash, label, fill }],
   *   xLabels: [{ x, label }], annotations: [{ y, label, color }],
   *   yLabel, height, yDigits, markers: [{x, y, label, color}]
   * }
   * ------------------------------------------------------------------ */
  function lineChart(canvas, opts) {
    const o = opts || {};
    const { ctx, w, h } = setup(canvas, o.height);
    const pad = { l: 46, r: 12, t: 16, b: 26 };
    const lines = (o.lines || []).filter((l) => l.points && l.points.length);

    if (!lines.length) {
      ctx.fillStyle = PALETTE.text;
      ctx.font = FONT;
      ctx.textAlign = 'center';
      ctx.fillText(o.emptyText || '暂无数据：记录几次体重后这里会出现趋势图', w / 2, h / 2);
      return null;
    }

    let xs = [], ys = [];
    lines.forEach((l) => l.points.forEach((p) => { xs.push(p.x); ys.push(p.y); }));
    (o.annotations || []).forEach((a) => ys.push(a.y));
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    let yMin = Math.min(...ys), yMax = Math.max(...ys);
    const padY = (yMax - yMin) * 0.12 || 1;
    const ticks = niceTicks(yMin - padY, yMax + padY, 5);
    yMin = ticks[0]; yMax = ticks[ticks.length - 1];

    const X = (x) => pad.l + (xMax === xMin ? (w - pad.l - pad.r) / 2 : ((x - xMin) / (xMax - xMin)) * (w - pad.l - pad.r));
    const Y = (y) => h - pad.b - ((y - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);

    // 网格与 y 轴刻度
    ctx.font = FONT_SMALL;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ticks.forEach((t) => {
      const y = Y(t);
      ctx.strokeStyle = PALETTE.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.fillStyle = PALETTE.text;
      ctx.fillText(fmtNum(t, o.yDigits), pad.l - 6, y);
    });

    // 目标线 / 参考线
    (o.annotations || []).forEach((a) => {
      const y = Y(a.y);
      if (y < pad.t - 2 || y > h - pad.b + 2) return;
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = a.color || PALETTE.target;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.restore();
      if (a.label) {
        ctx.font = FONT_SMALL;
        ctx.textAlign = 'left';
        ctx.fillStyle = a.color || PALETTE.target;
        ctx.fillText(a.label, pad.l + 4, y - 6);
      }
    });

    // 折线
    lines.forEach((l) => {
      ctx.save();
      ctx.strokeStyle = l.color || PALETTE.weight;
      ctx.lineWidth = l.width || 2;
      if (l.dash) ctx.setLineDash(l.dash);
      ctx.beginPath();
      l.points.forEach((p, i) => {
        const x = X(p.x), y = Y(p.y);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();
      if (l.fill && l.points.length > 1) {
        ctx.save();
        ctx.beginPath();
        l.points.forEach((p, i) => {
          const x = X(p.x), y = Y(p.y);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(X(l.points[l.points.length - 1].x), h - pad.b);
        ctx.lineTo(X(l.points[0].x), h - pad.b);
        ctx.closePath();
        ctx.fillStyle = l.fill;
        ctx.fill();
        ctx.restore();
      }
    });

    // 数据点标记
    (o.markers || []).forEach((m) => {
      const x = X(m.x), y = Y(m.y);
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = m.color || PALETTE.accent;
      ctx.fill();
      if (m.label) {
        ctx.font = FONT_SMALL;
        ctx.fillStyle = PALETTE.textStrong;
        ctx.textAlign = x > w - 80 ? 'right' : 'left';
        ctx.fillText(m.label, x + (x > w - 80 ? -6 : 6), y - 8);
      }
    });

    // x 轴标签
    ctx.font = FONT_SMALL;
    ctx.fillStyle = PALETTE.text;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const labels = o.xLabels || [];
    labels.forEach((lb, i) => {
      if (labels.length > 8 && i % Math.ceil(labels.length / 6) !== 0 && i !== labels.length - 1) return;
      ctx.fillText(lb.label, Math.min(w - pad.r - 10, Math.max(pad.l + 10, X(lb.x))), h - pad.b + 6);
    });

    // 把坐标映射返回出去：既方便加 tooltip，也让单元测试能直接验证轴映射方向
    return { X, Y, xMin, xMax, yMin, yMax, ticks, width: w, height: h, pad };
  }

  /* ------------------------------------------------------------------
   * 甜甜圈（宏量占比 / 热量完成度）
   * ------------------------------------------------------------------ */
  function donut(canvas, opts) {
    const o = opts || {};
    const size = o.size || 168;
    const { ctx, w, h } = setup(canvas, size);
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 12;
    const inner = r * 0.62;
    const segs = (o.segments || []).filter((s) => s.value > 0);
    const total = segs.reduce((a, s) => a + s.value, 0);

    if (!total) {
      ctx.strokeStyle = PALETTE.grid;
      ctx.lineWidth = r - inner;
      ctx.beginPath();
      ctx.arc(cx, cy, (r + inner) / 2, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      let start = -Math.PI / 2;
      segs.forEach((s) => {
        const angle = (s.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, (r + inner) / 2, start, start + angle - 0.02);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = r - inner;
        ctx.lineCap = 'butt';
        ctx.stroke();
        start += angle;
      });
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (o.centerTitle) {
      ctx.font = FONT_BOLD;
      ctx.fillStyle = PALETTE.textStrong;
      ctx.fillText(o.centerTitle, cx, cy - 8);
    }
    if (o.centerSub) {
      ctx.font = FONT_SMALL;
      ctx.fillStyle = PALETTE.text;
      ctx.fillText(o.centerSub, cx, cy + 10);
    }
  }

  /* ------------------------------------------------------------------
   * 柱状图（每日热量对比目标 / 依从度）
   * opts = { bars:[{label, value, color}], target, yLabel, height }
   * ------------------------------------------------------------------ */
  function bars(canvas, opts) {
    const o = opts || {};
    const { ctx, w, h } = setup(canvas, o.height);
    const pad = { l: 42, r: 10, t: 14, b: 24 };
    const list = o.bars || [];
    if (!list.length) {
      ctx.fillStyle = PALETTE.text;
      ctx.font = FONT;
      ctx.textAlign = 'center';
      ctx.fillText(o.emptyText || '暂无数据', w / 2, h / 2);
      return;
    }
    const maxV = Math.max(o.target || 0, ...list.map((b) => b.value), 1) * 1.1;
    const ticks = niceTicks(0, maxV, 4);
    const top = ticks[ticks.length - 1];
    const Y = (v) => h - pad.b - (v / top) * (h - pad.t - pad.b);

    ctx.font = FONT_SMALL;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ticks.forEach((t) => {
      const y = Y(t);
      ctx.strokeStyle = PALETTE.grid;
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.fillStyle = PALETTE.text;
      ctx.fillText(fmtNum(t, 0), pad.l - 5, y);
    });

    const bw = (w - pad.l - pad.r) / list.length;
    list.forEach((b, i) => {
      const x = pad.l + i * bw + bw * 0.18;
      const barW = bw * 0.64;
      const y = Y(b.value);
      const baseY = h - pad.b;
      const grad = ctx.createLinearGradient(0, y, 0, baseY);
      const col = b.color || PALETTE.weight;
      grad.addColorStop(0, col);
      grad.addColorStop(1, col + '55');
      ctx.fillStyle = grad;
      const radius = Math.min(4, barW / 2);
      roundRect(ctx, x, y, barW, baseY - y, radius);
      ctx.fill();

      if (o.target) {
        const ty = Y(o.target);
        ctx.save();
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 2, ty);
        ctx.lineTo(x + barW + 2, ty);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = PALETTE.text;
      ctx.font = FONT_SMALL;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(b.label, x + barW / 2, h - pad.b + 5);
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (h <= 0) { ctx.beginPath(); ctx.rect(x, y, w, 0.5); return; }
    const rr = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  /* ------------------------------------------------------------------
   * 进度环（目标进度百分比）
   * ------------------------------------------------------------------ */
  function progressRing(canvas, opts) {
    const o = opts || {};
    const size = o.size || 120;
    const { ctx, w, h } = setup(canvas, size);
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 8;
    const pct = Math.max(0, Math.min(1, o.pct || 0));
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.strokeStyle = PALETTE.grid;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = o.color || PALETTE.accent;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = PALETTE.textStrong;
    ctx.fillText(Math.round(pct * 100) + '%', cx, cy - 6);
    if (o.sub) {
      ctx.font = FONT_SMALL;
      ctx.fillStyle = PALETTE.text;
      ctx.fillText(o.sub, cx, cy + 14);
    }
  }

  return { PALETTE, lineChart, donut, bars, progressRing, niceTicks, roundRect };
});

<script>
/* =====================================================================
 * 界面构建 views.js —— 纯函数：吃数据、吐 HTML 字符串，不碰状态与事件。
 * 事件全部靠 data-action 属性交给 app.js 的事件代理处理。

(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.FLViews = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const n1 = (v, d) => (v == null ? '—' : Number(v).toFixed(d == null ? 1 : d).replace(/\.0+$/, ''));
  const n0 = (v) => (v == null ? '—' : Math.round(v).toLocaleString('zh-CN'));

  const TABS = [
    { key: 'profile', label: '档案', icon: '👤' },
    { key: 'assess', label: '评估', icon: '📊' },
    { key: 'plan', label: '计划', icon: '🗓️' },
    { key: 'menu', label: '食谱', icon: '🍚' },
    { key: 'log', label: '打卡', icon: '✅' },
    { key: 'trend', label: '趋势', icon: '📈' },
    { key: 'evidence', label: '依据', icon: '📚' },
    { key: 'settings', label: '设置', icon: '⚙️' }
  ];

  /* ----------------------------- 小组件 ----------------------------- */

  function card(title, body, opts) {
    const o = opts || {};
    return `<section class="card ${o.className || ''}" ${o.id ? `id="${o.id}"` : ''}>
      ${title ? `<header class="card-head"><h3>${esc(title)}</h3>${o.extra || ''}</header>` : ''}
      <div class="card-body">${body}</div>
      ${o.foot ? `<footer class="card-foot">${o.foot}</footer>` : ''}
    </section>`;
  }

  function kv(label, value, opts) {
    const o = opts || {};
    return `<div class="kv ${o.className || ''}">
      <span class="kv-label">${esc(label)}</span>
      <span class="kv-value">${value}</span>
      ${o.hint ? `<span class="kv-hint">${o.hint}</span>` : ''}
    </div>`;
  }

  function stat(label, value, unit, opts) {
    const o = opts || {};
    return `<div class="stat ${o.tone ? 'tone-' + o.tone : ''}">
      <div class="stat-value">${value}<span class="stat-unit">${esc(unit || '')}</span></div>
      <div class="stat-label">${esc(label)}</div>
      ${o.hint ? `<div class="stat-hint">${o.hint}</div>` : ''}
    </div>`;
  }

  function cite(ids, evidenceMap) {
    if (!ids || !ids.length) return '';
    const list = ids.map((id) => evidenceMap[id]).filter(Boolean);
    if (!list.length) return '';
    const chips = list.map((e) => {
      const link = e.doi ? `https://doi.org/${e.doi}` : (e.url || '#');
      return `<a class="cite" href="${esc(link)}" target="_blank" rel="noopener noreferrer" title="${esc(e.citation)}">${esc(shortCite(e))}</a>`;
    }).join('');
    return `<div class="cites"><span class="cites-label">依据</span>${chips}</div>`;
  }

  function shortCite(e) {
    const first = (e.citation || '').split(',')[0].split(' ')[0] || e.id;
    const year = (e.citation || '').match(/\b(19|20)\d{2}\b/);
    return `${first} ${year ? year[0] : ''}`.trim();
  }

  function progressBar(pct, opts) {
    const o = opts || {};
    const p = Math.max(0, Math.min(100, pct || 0));
    return `<div class="pbar ${o.tone ? 'tone-' + o.tone : ''}"><div class="pbar-fill" style="width:${p}%"></div></div>`;
  }

  function macroBar(label, value, target, unit, color) {
    const pct = target ? Math.min(100, (value / target) * 100) : 0;
    const over = target && value > target * 1.08;
    return `<div class="macro-row">
      <div class="macro-head"><span>${esc(label)}</span><span class="${over ? 'over' : ''}">${n0(value)} / ${n0(target)} ${esc(unit)}</span></div>
      <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }

  function field(label, inner, hint) {
    return `<label class="field"><span class="field-label">${esc(label)}</span>${inner}${hint ? `<span class="field-hint">${hint}</span>` : ''}</label>`;
  }

  function input(name, value, opts) {
    const o = opts || {};
    return `<input type="${o.type || 'number'}" name="${esc(name)}" value="${value == null ? '' : esc(value)}"
      ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} ${o.step != null ? `step="${o.step}"` : ''}
      ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''} ${o.required ? 'required' : ''}>`;
  }

  function select(name, value, options) {
    return `<select name="${esc(name)}">${options.map((op) => `<option value="${esc(op.value)}" ${String(op.value) === String(value) ? 'selected' : ''}>${esc(op.label)}</option>`).join('')}</select>`;
  }

  function checkboxes(name, values, options) {
    return `<div class="chips">${options.map((op) => `
      <label class="chip ${values.includes(op.value) ? 'on' : ''}">
        <input type="checkbox" name="${esc(name)}" value="${esc(op.value)}" ${values.includes(op.value) ? 'checked' : ''}>
        <span>${esc(op.label)}</span>
      </label>`).join('')}</div>`;
  }

  function warnList(list, tone) {
    if (!list || !list.length) return '';
    return `<ul class="warn-list ${tone || ''}">${list.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>`;
  }

  /* ----------------------------- 1. 档案 ----------------------------- */

  function tabProfile(ctx) {
    const p = ctx.profile;
    const a = ctx.a;
    const tab = (key, label, body, active) => `

    const body = `

        ${card('基本信息', `

            ${field('腰围（cm，选填）', input('waistCm', p.waistCm, { min: 40, max: 200, step: 0.5 }))}
            ${field('日均步数', input('steps', p.steps, { min: 500, max: 40000, step: 500 }), `当前活动等级：${esc(ctx.palLabel || '')}`)}

        ${card('减脂目标', `

            ${field('目标体重（kg）', input('goalTargetWeightKg', p.goal.targetWeightKg, { min: 30, max: 250, step: 0.1, placeholder: '例如 70' }))}
            ${field('目标体脂率（%，选填）', input('goalTargetBodyFatPct', p.goal.targetBodyFatPct, { min: 5, max: 50, step: 0.1 }))}
            ${field('目标日期（选填）', input('goalDeadline', p.goal.deadline, { type: 'date' }), '填了就会检查这个期限是否现实，并算倒计时')}
            ${field('减脂路线', select('route', p.route, [

              { value: 'training', label: '以健身为主（健身房）' },
              { value: 'diet', label: '纯饮食减脂（不锻炼）' }
            ]), '这个选择会改变蛋白质配额、瘦体重流失预估与训练安排')}
          </div>
          <div class="speed-picker">
            ${['gentle', 'standard', 'aggressive'].map((k) => {
              const s = ctx.speedPresets[k];
              return `<label class="speed-card ${p.speed === k ? 'on' : ''}">
                <input type="radio" name="speed" value="${k}" ${p.speed === k ? 'checked' : ''}>
                <strong>${esc(s.label)} · 每周约 ${s.pct}% 体重</strong>
                <span>${esc(s.desc)}</span>
              </label>`;
            }).join('')}
          </div>
        `)}

        ${card('训练条件', `
          <p class="muted">可多选。没有勾选健身房器械时，计划会自动给出宿舍版动作或直接排成纯饮食日。</p>
          ${checkboxes('equipment', p.train.equipment, [
            { value: 'gym_freeweights', label: '自由重量（杠铃/哑铃/深蹲架）' },
            { value: 'gym_machines', label: '固定器械（胸推/腿推/高位下拉）' },
            { value: 'gym_cardio', label: '有氧器械（跑步机/椭圆机/划船机）' },
            { value: 'gym_cable', label: '缆绳/龙门架' },
            { value: 'dumbbell', label: '宿舍有哑铃' },
            { value: 'band', label: '宿舍有弹力带' },
            { value: 'none', label: '什么都没有' }
          ])}
          <h4 class="mini-title">需要避开的部位</h4>
          ${checkboxes('injuries', p.train.injuries, [
            { value: 'knee', label: '膝盖' },
            { value: 'back', label: '腰' },
            { value: 'shoulder', label: '肩' }
          ])}
          <div class="grid grid-3">

            ${field('每次时长（分钟）', input('sessionMinutes', p.train.sessionMinutes, { min: 20, max: 120, step: 5 }))}
            ${field('训练分化', select('template', p.train.template, [

        ${card('乒乓球（单独一栏）', `
          <div class="grid grid-3">
            ${field('每周次数', input('ttSessionsPerWeek', p.train.tableTennis.sessionsPerWeek, { min: 0, max: 7, step: 1 }))}
            ${field('每次时长（分钟）', input('ttMinutes', p.train.tableTennis.minutesPerSession, { min: 15, max: 240, step: 5 }))}
            ${field('强度类型', select('ttIntensity', p.train.tableTennis.intensity, [
              { value: 'match', label: '对抗/比赛（4.8 METs）' },
              { value: 'training', label: '训练/多球（6.8 METs）' },
