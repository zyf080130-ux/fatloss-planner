            ]), 'MET 值来自 Sperlich 2011 对乒乓球运动员的实测')}
          </div>
          <p class="muted small">乒乓球会按 MET × 体重 × 时长算进你每天的消耗，并自动占用非健身房日；打球当天会多给一份主食补回部分消耗。</p>
        `)}

        ${card('饮食设置', `
          <div class="grid grid-2">
            ${field('餐次结构', select('mealStructure', p.diet.mealStructure, [
              { value: '3', label: '一日三餐' },
              { value: '3+1', label: '三餐 + 1 次加餐（推荐）' },
              { value: '3+2', label: '三餐 + 2 次加餐' }
            ]))}
            ${field('讨厌的食材（逗号分隔）', input('dislikes', (p.diet.dislikes || []).join(','), { type: 'text', placeholder: '例如：香菜,内脏' }))}
          </div>
          <h4 class="mini-title">饮食限制</h4>
          ${checkboxes('restrictions', p.diet.restrictions, [
            { value: 'noPork', label: '不吃猪肉' },
            { value: 'noBeef', label: '不吃牛肉' },
            { value: 'noSeafood', label: '不吃水产' },
            { value: 'vegetarian', label: '蛋奶素' },
            { value: 'vegan', label: '纯素' },
            { value: 'lactoseFree', label: '乳糖不耐' },
            { value: 'halal', label: '清真' }
          ])}
          <div class="grid grid-2">
            ${field('自由餐', select('freeMeal', p.diet.freeMeal, [{ value: 'yes', label: '每周留 1 次自由餐' }, { value: 'no', label: '不需要' }]))}
            ${field('饮食间歇', select('dietBreak', p.diet.dietBreak, [{ value: 'yes', label: '连续 3 周后插入 1 周维持热量' }, { value: 'no', label: '不需要' }]))}
          </div>
        `)}

        ${card('健康状况', `
          <p class="muted">如实勾选会改变安全提示；本工具不做诊断。</p>
          ${checkboxes('conditions', p.conditions, [
            { value: 'thyroid', label: '甲状腺功能异常' },
            { value: 'diabetes', label: '糖尿病/胰岛素抵抗' },
            { value: 'hypertension', label: '高血压' },
            { value: 'liver', label: '高血脂/脂肪肝' },
            { value: 'stomach', label: '胃病/肠易激' },
            { value: 'eating', label: '反复节食或厌食倾向史' },
            { value: 'other', label: '其他（写在备注里）' }
          ])}
          ${field('备注', `<textarea name="notes" rows="2" placeholder="任何需要我知道的情况">${esc(p.notes || '')}</textarea>`)}
        `)}

        <div class="actions sticky-actions">
          <button class="btn primary" data-action="save-profile" type="button">保存档案并重新计算</button>
          <span class="muted small">${ctx.savedHint || '数据只保存在你这台设备的浏览器里'}</span>
        </div>
      </form>
    `;
    return body;
  }

  /* ----------------------------- 2. 评估 ----------------------------- */

  function tabAssess(ctx) {
    const a = ctx.a;
    if (!a) return card('还没有数据', '<p>先到「档案」里填写身高体重，点保存。</p>');
    const bmiTone = a.bmiCategory.tone;
    const body = `
      ${a.blockers.length ? card('⛔ 先别急着减脂', warnList(a.blockers, 'danger')) : ''}
      ${a.medicalWarnings.length ? card('⚠️ 需要注意', warnList(a.medicalWarnings, 'warn')) : ''}

      <div class="stats">
        ${stat('BMI', n1(a.bmi), '', { tone: bmiTone, hint: `${esc(a.bmiCategory.label)} · 健康区间 ${a.healthyWeightRange.min}–${a.healthyWeightRange.max} kg` })}
        ${stat('体脂率', n1(a.bodyFatPct), '%', { hint: `${esc(a.bodyFatCategory.label)}${a.bodyFatEstimated ? ' · 估算值' : ' · 实测值'}` })}
        ${stat('去脂体重', n1(a.leanKg), 'kg', { hint: `脂肪 ${n1(a.fatKg)} kg` })}
        ${stat('静息代谢 RMR', n0(a.rmr.value), 'kcal', { hint: esc(a.rmr.method) })}
        ${stat('每日总消耗 TDEE', n0(a.tdee.value), 'kcal', { hint: `活动系数 ${a.tdee.pal}（${esc(a.tdee.palLabel)}）` })}
        ${stat('每日缺口', n0(a.intakePlan.deficit), 'kcal', { tone: 'ok', hint: `预计每周 ${n1(a.intakePlan.weeklyKg, 2)} kg（体重的 ${a.intakePlan.weeklyPct}%）` })}
      </div>

      ${card('怎么算出来的', `
        <div class="explain">
          ${kv('① 静息代谢 RMR', `<strong>${n0(a.rmr.value)}</strong> kcal`, { hint: esc(a.rmr.method) })}
          ${kv('② 日常活动系数 PAL', `<strong>${a.tdee.pal}</strong>`, { hint: esc(a.tdee.palLabel) + '（只算非运动的日常活动）' })}
          ${kv('③ 运动的净消耗（日均）', `<strong>${n0(a.tdee.exerciseKcal)}</strong> kcal`, { hint: '已按能量补偿系数 0.72 折算，且扣除了「躺着也要消耗」的 1 MET' })}
          ${kv('④ 每日总消耗 TDEE', `<strong>${n0(a.tdee.value)}</strong> kcal = ① × ② + ③`)}
          ${kv('⑤ 减脂速度对应的缺口', `<strong>${n0(a.intakePlan.deficit)}</strong> kcal`, { hint: `你选了「${esc(a.intakePlan.speedLabel)}」档` })}
          ${kv('⑥ 每日目标摄入', `<strong class="big">${n0(a.intakePlan.intake)}</strong> kcal = ④ − ⑤`)}
        </div>
        ${cite([...a.rmr.evidence, ...a.tdee.palEvidence, 'careau2021currbiol'], ctx.evidenceMap)}
        ${a.intakePlan.clamped ? `<div class="note-block"><strong>热量已被安全约束调整：</strong>${warnList(a.intakePlan.notes, 'warn')}</div>` : ''}
      `)}

      ${card('每日营养目标', `
        <div class="macro-grid">
          ${macroBar('蛋白质', a.daily.protein, a.daily.protein, 'g', 'var(--c-protein)')}
          ${macroBar('脂肪', a.daily.fat, a.daily.fat, 'g', 'var(--c-fat)')}
          ${macroBar('碳水', a.daily.carb, a.daily.carb, 'g', 'var(--c-carb)')}
          ${macroBar('膳食纤维', a.daily.fiber, a.daily.fiber, 'g', 'var(--c-fiber)')}
        </div>
        <div class="grid grid-4 targets">
          ${stat('饮水', n0(a.daily.waterMl), 'ml')}
          ${stat('步数', n0(a.daily.stepGoal), '步')}
          ${stat('睡眠', '≥' + a.daily.sleepMinHours, '小时', { hint: '证据库只有下限来源，无上限' })}
          ${stat('蛋白/kg', n1(a.macros.proteinPerKg, 2), 'g/kg', { hint: `脂肪 ${n1(a.macros.fatPerKg, 2)} g/kg` })}
        </div>
        <p class="muted small">三大宏量占热量比例：蛋白 ${a.macros.pct.protein}% / 脂肪 ${a.macros.pct.fat}% / 碳水 ${a.macros.pct.carb}%。蛋白区间 1.6–2.4 g/kg 体重，脂肪不低于 0.6 g/kg，纤维取自循证最优区间 25–29 g/d。</p>
        ${cite(a.macros.evidence.concat(['reynolds2019lancet']), ctx.evidenceMap)}
      `)}

      ${card('体重变化预测（非线性模型）', `
        <p class="muted small">为什么不用「缺口 × 天数 ÷ 7700」简单外推？因为体重下降本身会降低代谢，还有代谢适应。下面是逐日模拟的结果。</p>
        <div class="chart-wrap"><canvas id="chart-projection"></canvas></div>
        <div class="grid grid-4 targets">
          ${stat('12 个月后', n1(a.projection.endWeight), 'kg', { hint: `体脂约 ${n1(a.projection.endBodyFatPct)}%` })}
          ${stat('首周预计下降', n1(a.projection.firstWeekLossKg, 2), 'kg', { hint: '首周主要是水分与糖原' })}
          ${stat('代谢适应', n0(a.projection.adaptMax), 'kcal', { hint: '约 3 周内建立' })}
          ${stat('瘦体重流失占比', Math.round(a.projection.leanLossFrac * 100), '%', { hint: a.input.route === 'training' ? '含抗阻训练与足量蛋白' : '纯饮食路线' })}
        </div>
        ${cite(a.projection.evidence, ctx.evidenceMap)}
      `)}
    `;
    return body;
  }

  /* ----------------------------- 3. 计划 ----------------------------- */

  function tabPlan(ctx) {
    const a = ctx.a;
    if (!a) return card('还没有计划', '<p>先保存档案。</p>');
    const weekly = ctx.weekly;
    if (!a.ok) {
      return card('⛔ 当前不适合生成减脂计划', warnList(a.blockers, 'danger'));
    }
    const p = a.input;
    const goal = a.goal || {};
    const dt = a.projection.daysToTarget;

    const header = `
      <div class="stats">
        ${stat('每日吃', n0(a.daily.intake), 'kcal', { tone: 'ok', hint: `维持热量 ${n0(a.tdee.value)}，缺口 ${n0(a.daily.deficit)}` })}
        ${stat('速度档位', esc(a.intakePlan.speedLabel), '', { hint: `每周约 ${a.intakePlan.weeklyPct}% 体重` })}
        ${stat('预计达标', dt ? Math.round(dt) + ' 天' : '—', '', { hint: dt ? `约 ${n1(a.projection.weeksToTarget)} 周后到 ${p.goal.targetWeightKg} kg` : '填了目标体重才会算' })}
        ${stat('本周训练', (weekly ? weekly.summary.strengthDays : 0) + ' 次力量', '', { hint: weekly ? `乒乓球 ${weekly.summary.tableTennisDays} 次 · 有氧合计 ${weekly.summary.cardioMin} 分钟` : '' })}
      </div>
      ${goal.notes && goal.notes.length ? `<div class="note-block ${goal.feasible ? '' : 'danger'}">${warnList(goal.notes, goal.feasible ? 'warn' : 'danger')}</div>` : ''}
    `;

    const weekTable = weekly ? `
      <div class="week-grid">
        ${weekly.week.map((d) => `
          <div class="day-card type-${d.type}">
            <div class="day-head">
              <strong>${esc(d.dayName)}</strong>
              <span class="badge">${esc(dayTypeLabel(d.type))}</span>
            </div>
            <div class="day-title">${esc(d.title || '休息')}</div>
            ${d.focus ? `<div class="muted small">${esc(d.focus)}</div>` : ''}
            <ul class="block-list">
              ${d.blocks.map((b) => `<li class="block-${b.kind}">
                <span class="block-name">${esc(b.name)}</span>
                ${b.sets ? `<span class="block-spec">${esc(b.sets)} × ${esc(b.reps)}${b.rest ? ` · 休息 ${b.rest}s` : ''}</span>` : ''}
                ${b.cue ? `<span class="block-cue">${esc(b.cue)}</span>` : ''}
                ${b.detail ? `<span class="block-cue">${esc(b.detail)}</span>` : ''}
                ${b.substitutedReason ? `<span class="block-sub">↳ ${esc(b.substitutedReason)}</span>` : ''}
              </li>`).join('')}
            </ul>
            ${d.type !== 'dorm' || d.minutes ? `<div class="muted small">${d.minutes ? `约 ${d.minutes} 分钟` : ''}${d.type === 'tabletennis' && d.tableTennis ? ` · 约消耗 ${sessionKcalForDay(ctx, d)} kcal` : ''}</div>` : ''}
          </div>`).join('')}
      </div>
      ${weekly.gymDays === 0 ? '' : `<p class="muted small">训练模板：${esc(weekly.template)}。动作已按你的器械与伤病做替换。</p>`}
      ${cite(weekly.evidence, ctx.evidenceMap)}
    ` : '<p class="muted">档案里把「健身房每周次数」设为 0，或选了纯饮食路线时，这里只会给饮食安排。</p>';

      ${card('这份计划的依据', `
        <ul class="plain-list">
          <li>抗阻训练是减脂期保住瘦肌肉的关键：系统综述显示，减重期间做抗阻训练平均能少掉 0.8 kg 瘦体重。</li>

  /* ----------------------------- 4. 食谱 ----------------------------- */

  /* ----------------------------- 5. 打卡 ----------------------------- */

  function tabLog(ctx) {

      ${card('今天的运动', `

  /* ----------------------------- 6. 趋势 ----------------------------- */

  function tabTrend(ctx) {

      ${card('体重与体脂趋势', `

        <div class="stats">
          ${stat('记录天数', n0(t.count), '天')}
          ${stat('最近 7 日均值', t.ma7 == null ? '—' : n1(t.ma7), 'kg')}

      ${t.plateau ? card('平台期判断', `

          <strong>${esc(t.plateau.message)}</strong>
          ${t.plateau.suggestions.length ? `<ul class="plain-list">${t.plateau.suggestions.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
        </div>
        ${cite(['leibel1995nejm', 'rosenbaum2010ijo', 'byrne2018ijo', 'nedeltcheva2010anninternmed', 'donnelly2009msse'], ctx.evidenceMap)}
      `) : ''}
      ${card('最近 7 天的热量完成度', `
        <div class="chart-wrap"><canvas id="chart-adherence"></canvas></div>

  }

  /* ----------------------------- 7. 依据 ----------------------------- */

  function tabEvidence(ctx) {
    const ev = ctx.evidence || [];
    const byTopic = {};
    ev.forEach((e) => { (byTopic[e.topic] = byTopic[e.topic] || []).push(e); });
    const g = ctx.guidelines || {};
    return `
      ${card('这份网站的算法依据', `
        <p>所有会影响你方案的数值与公式，都尽量来自可核查的期刊文献或国家/国际指南，并且可以点开看到原文链接。证据库共 ${ev.length} 条文献，其中 ${ev.filter((e) => e.doi).length} 条有 DOI。</p>
        <ul class="plain-list">
          <li><strong>代谢率</strong>：给了实测体脂率用 Katch-McArdle 与 Cunningham 的均值（基于去脂体重），没给就用 Mifflin-St Jeor。</li>
          <li><strong>总消耗</strong>：RMR × 日常活动系数 + 运动净消耗 × 0.72（能量补偿）。</li>
          <li><strong>缺口</strong>：由「每周减 0.5–1% 体重」换算，并额外限制在 TDEE 的 30% 以内、不低于性别下限与 RMR。</li>
          <li><strong>体重预测</strong>：逐日模拟，含代谢适应（约 3 周建立）与瘦体重/脂肪的分配。</li>
          <li><strong>餐食求解</strong>：先定蛋白与蔬菜份量，再用主食把热量差补齐，同时约束纤维与脂肪上限。</li>
          <li><strong>平台期</strong>：用 14 天回归斜率对比预期速度，先排查记录偏差再动物热量。</li>
        </ul>
      `)}
      ${card('重要边界说明', `
        <ul class="plain-list">
          <li>本工具不能替代医生或注册营养师。有甲状腺疾病、糖尿病、高血压、脂肪肝、胃病、进食障碍史，或处于孕期/哺乳期/备赛期，请先咨询专业人员。</li>
          <li>不提供任何药物剂量建议。减重药物必须在医生处方与随访下使用。</li>
          <li>体脂率若来自家用体脂秤（生物电阻抗），受水分影响很大，趋势比单点数值更可靠。</li>
          <li>食堂菜、外卖的热量是估算值，厨师放油量会让实际值上下浮动 20% 以上。</li>
          <li>证据库中暂时无法核实来源的数值（如睡眠时长上限、体脂健康下限的具体数字、部分单项活动的 MET 值）我们没有编造，一律标注为「估算」或不做宣称。</li>
        </ul>
      `)}
      ${card('文献清单（点标题打开原文）', `
        ${Object.keys(byTopic).sort().map((topic) => `
          <div class="ev-topic">
            <h4>${esc(topic)}</h4>
            <ul class="ev-list">
              ${byTopic[topic].map((e) => `<li>
                <a href="${esc(e.doi ? 'https://doi.org/' + e.doi : (e.url || '#'))}" target="_blank" rel="noopener noreferrer">${esc(e.claim || e.id)}</a>
                <div class="ev-meta">${esc(e.citation)}${e.doi ? ` · <span class="mono">doi:${esc(e.doi)}</span>` : ' · 无 DOI（官方文件）'} · 证据等级：${esc(e.evidenceLevel || '—')}</div>
                ${e.keyNumbers ? `<div class="ev-meta key">关键数据：${esc(e.keyNumbers)}</div>` : ''}
              </li>`).join('')}
            </ul>
          </div>`).join('')}
      `)}
    `;
  }

        <div class="grid grid-2">
          ${field('主题', select('theme', state.settings.theme, [{ value: 'dark', label: '深色（默认）' }, { value: 'light', label: '浅色' }]))}
          ${field('运动消耗吃回比例', select('eatBackRatio', String(state.settings.eatBackRatio), [
            { value: '0', label: '完全不吃回（缺口最大）' },
            { value: '0.5', label: '吃回一半（推荐）' },
            { value: '0.72', label: '全部吃回折算后的消耗' }
          ]), '运动净消耗会先按 0.72 的能量补偿系数折算，再乘这个比例')}
        </div>
        <div class="actions"><button class="btn primary" data-action="save-settings">保存设置</button></div>
      `)}
      ${card('危险操作', `
        <div class="actions">
          <button class="btn ghost danger" data-action="clear-logs">清空当前档案的打卡记录</button>
          <button class="btn ghost danger" data-action="factory-reset">恢复出厂（删除所有档案与数据）</button>
        </div>
      `)}
      ${card('想装到手机桌面？', `
        <ol class="plain-list">
          <li>手机浏览器里必须通过 <strong>https 地址</strong>打开才能「添加到主屏幕」并离线使用——浏览器规定只有安全来源（https 或 localhost）才允许注册离线缓存。</li>
          <li>电脑上用 <span class="mono">node serve.mjs</span> 打开的是 http://localhost，可以用；手机连同一个 WiFi 用 http://电脑IP 打开的话，页面能看但不能装成 App。</li>
          <li>想真正装到手机上，把这个文件夹部署到任意支持 https 的静态托管（GitHub Pages / Vercel / Cloudflare Pages）即可，详见 README。</li>
        </ol>
      `)}
    `;
  }

  /* ----------------------------- 组合 ----------------------------- */

  function renderTab(tab, ctx) {
    switch (tab) {
      case 'profile': return tabProfile(ctx);
      case 'assess': return tabAssess(ctx);
      case 'plan': return tabPlan(ctx);
      case 'menu': return tabMenu(ctx);
      case 'log': return tabLog(ctx);
      case 'trend': return tabTrend(ctx);
      case 'evidence': return tabEvidence(ctx);
      case 'settings': return tabSettings(ctx);
      default: return tabProfile(ctx);
    }
  }

  function shell(ctx) {
    const tab = ctx.ui.tab;
    return `
      <header class="app-head">
        <div class="brand"><span class="logo">🔥</span><div><strong>减脂计划</strong><span class="muted small">循证 · 离线 · 单文件</span></div></div>
        <nav class="tabs">
          ${TABS.map((t) => `<button class="tab ${t.key === tab ? 'on' : ''}" data-action="tab" data-tab="${t.key}"><span>${t.icon}</span>${esc(t.label)}</button>`).join('')}
        </nav>
        <div class="head-right">
          <span class="badge">${esc(ctx.profile.name || '')}</span>
        </div>
      </header>
      <main id="main">
        <div id="toast" class="toast hidden"></div>
        ${renderTab(tab, ctx)}
      </main>
      <nav class="bottom-nav">
        ${TABS.map((t) => `<button class="bnav ${t.key === tab ? 'on' : ''}" data-action="tab" data-tab="${t.key}"><span>${t.icon}</span><small>${esc(t.label)}</small></button>`).join('')}
      </nav>
    `;
  }

  /* 乒乓球消耗与每日执行清单（放在模块内，避免依赖顺序问题） */
  function sessionKcalForDay(ctx, day) {
    if (!day.tableTennis) return 0;
    return Math.round(Math.max(day.tableTennis.met - 1, 0.6) * (ctx.profile.weightKg || 70) * day.tableTennis.minutes / 60);
  }

  function checklistForDay(ctx, day) {
    const a = ctx.a;
    return [
      { tag: '训练', text: day.type === 'gym' ? `健身房：${day.title}（${day.minutes} 分钟）` : day.type === 'tabletennis' ? `乒乓球 ${day.tableTennis.minutes} 分钟` : '宿舍日，不训练' },
      { tag: '饮食', text: `热量 ${a ? a.daily.intake : '—'} kcal，蛋白 ${a ? a.daily.protein : '—'} g，纤维 25–29 g` },
      { tag: '恢复', text: `饮水 ${a ? a.daily.waterMl : '—'} ml，睡眠至少 7 小时` },
      { tag: '记录', text: '晚上称重并记录今天吃的所有东西（含酱料和饮料）' }
    ];
  }

  return {
    TABS, esc, n0, n1, card, kv, stat, cite, progressBar, macroBar, field, input, select,
    checkboxes, warnList, renderTab, shell, shortCite, dayTypeLabel,
    sessionKcalForDay, checklistForDay
  };
});

</script>
<script>
/* =====================================================================
 * 状态与交互 app.js
 * ---------------------------------------------------------------------
 * 职责：localStorage 持久化、多档案、表单同步、事件代理、图表绘制、
 *       食谱求解的调度、打卡与导入导出。
 * 所有算法都在 core.js / exercise.js 里，这里只做编排与渲染。
 * ===================================================================== */
(function () {
  'use strict';

  const C = window.FLCore;
  const V = window.FLViews;
  const X = window.FLExercise;
  const CH = window.FLCharts;
  const DATA = window.FLData || { foods: [], activities: {}, evidence: [], guidelines: {} };
  if (!C || !V || !X) {
    document.body.innerHTML = '<div style="padding:24px;color:#f87171">核心脚本加载失败：请确认 index.html 是完整生成的单文件版本。</div>';
    return;
  }

  const STORE_KEY = 'fatloss.v1';
  const esc = V.esc;
  const n0 = V.n0;
  const n1 = V.n1;

  /* ------------------------------ 数据准备 ------------------------------ */

  const DB_FOODS = (DATA.foods || []).map((f) => ({
    ...f,
    id: f.id || ('db_' + (f.name || '').slice(0, 8)),
    custom: false
  }));
  const DB_INDEX = new Map(DB_FOODS.map((f) => [f.id, f]));
  const EVIDENCE_MAP = {};
  (DATA.evidence || []).forEach((e) => { EVIDENCE_MAP[e.id] = e; });
  const MET_TABLE = X.mergeMetTable((DATA.activities && DATA.activities.met) || []);
  const COOKING = (DATA.activities && DATA.activities.cookingMethods) || [];

  /* ------------------------------ 默认状态 ------------------------------ */

  function todayISO(offsetDays) {
    const d = new Date();
    if (offsetDays) d.setDate(d.getDate() + offsetDays);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function defaultProfile(name) {
    return {
      id: 'p' + Math.random().toString(36).slice(2, 8),
      name: name || '我',
      sex: 'male',
      age: 20,
      heightCm: 175,
      weightKg: 82,
      bodyFatPct: 25,
      waistCm: null,
      steps: 10000,
      notes: '',
      goal: { targetWeightKg: 70, targetBodyFatPct: 15, deadline: '' },
      route: 'both',
      speed: 'standard',
      train: {
        equipment: ['gym_freeweights', 'gym_machines', 'gym_cardio', 'gym_cable'],
        injuries: [],
        gymDaysPerWeek: 3,
        sessionMinutes: 50,
        template: 'fullbody',
        tableTennis: { sessionsPerWeek: 3, minutesPerSession: 90, intensity: 'match', days: [] }
      },
      diet: { mealStructure: '3+1', restrictions: [], dislikes: [], freeMeal: 'yes', dietBreak: 'yes' },
      conditions: [],
      pantry: [],
      customFoods: [],
      isSample: true,
      createdAt: new Date().toISOString()
    };
  }

  function defaultState() {
    const p = defaultProfile('我');
    return {
      version: 1,
      activeProfileId: p.id,
      profiles: { [p.id]: p },
      logs: {},
      weighIns: {},
      settings: { theme: 'dark', eatBackRatio: 0.5, pantryOnly: false }
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.profiles) return defaultState();
      parsed.settings = Object.assign({ theme: 'dark', eatBackRatio: 0.5, pantryOnly: false }, parsed.settings || {});
      return parsed;
    } catch (e) {
      console.warn('读取本地数据失败，使用空白状态', e);
      return defaultState();
    }
  }

  let state = load();
  const ui = {
    tab: 'profile',
    menuSeed: 1,
    menuTrainDay: false,
    menuEdits: {},
    toast: null,
    logDate: todayISO(),
    lastSaved: null
  };
  let cache = {}; // 每次渲染重算的派生数据

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('保存失败：浏览器存储可能已满或被禁用', 'bad');
    }
  }

  const activeProfile = () => state.profiles[state.activeProfileId] || Object.values(state.profiles)[0];

  function allFoods() {
    const p = activeProfile();
    return [...(p.customFoods || []).map((f) => ({ ...f, custom: true })), ...DB_FOODS];
  }
  function foodById(id) {
    const p = activeProfile();
    return (p.customFoods || []).find((f) => f.id === id) || DB_INDEX.get(id) || null;
  }

  /* ------------------------------ 派生计算 ------------------------------ */

  /** 从周计划里抽出「结构化运动」，喂给 core 计算日均运动消耗 */
  function weeklySessionsFromPlan(weekly) {
    if (!weekly) return [];
    const out = [];
    weekly.week.forEach((d) => {
      if (d.type === 'gym') {
        // 一次健身房训练 ≈ 力量(约 5.0 MET) + 收尾有氧，合并按 5.6 MET 计
        out.push({ met: 5.6, minutes: d.minutes || 50, name: '健身房训练' });
      } else if (d.type === 'tabletennis' && d.tableTennis) {
        out.push({ met: d.tableTennis.met, minutes: d.tableTennis.minutes, name: d.title });
      } else if (d.type === 'dorm' && d.blocks.some((b) => b.kind === 'cardio')) {
        out.push({ met: 3.5, minutes: 25, name: '散步' });
      }
    });
    return out;
  }

  function buildWeekly() {
    const p = activeProfile();
    const isDietRoute = p.route === 'diet';
    return X.buildWeeklyPlan({
      gymDaysPerWeek: isDietRoute ? 0 : p.train.gymDaysPerWeek,
      template: p.train.template,
      equipment: p.train.equipment,
      injuries: p.train.injuries,
      sessionMinutes: p.train.sessionMinutes,
      dormMode: isDietRoute ? 'diet' : 'stretch',
      tableTennis: isDietRoute ? { sessionsPerWeek: p.train.tableTennis.sessionsPerWeek, minutesPerSession: p.train.tableTennis.minutesPerSession, intensity: p.train.tableTennis.intensity } : p.train.tableTennis,
      cardioMinutes: 15
    });
  }

  function assessInput() {
    const p = activeProfile();
    const weekly = cache.weekly || (cache.weekly = buildWeekly());
    const sessions = weeklySessionsFromPlan(weekly);
    const isTraining = p.route !== 'diet' && p.train.gymDaysPerWeek > 0;
    return {
      sex: p.sex, age: p.age, heightCm: p.heightCm, weightKg: p.weightKg,
      bodyFatPct: p.bodyFatPct, steps: p.steps,
      goal: p.goal, route: isTraining ? 'training' : 'diet', speed: p.speed,
      weeklySessions: sessions,
      conditions: p.conditions || [],
      train: p.train
    };
  }

  function computeAssessment() {
    if (cache.a) return cache.a;
    try {
      cache.a = C.assess(assessInput());
    } catch (e) {
      console.error(e);
      cache.a = null;
    }
    return cache.a;
  }

  /** 候选食物池：勾了现有食材就优先用，不足 8 样时自动补充食物库 */
  function candidatePool() {
    const p = activeProfile();
    const restrictions = p.diet.restrictions || [];
    const dislikes = (p.diet.dislikes || []).filter(Boolean);
    const filter = (list) => list.filter((f) => !C.foodBlocked(f, restrictions, dislikes));

    const pantryFoods = filter((p.pantry || []).map((it) => foodById(it.id)).filter(Boolean));
    const rest = filter(allFoods()).filter((f) => !pantryFoods.some((x) => x.id === f.id));

    if (state.settings.pantryOnly && pantryFoods.length >= 3) {
      return { pool: pantryFoods, source: 'pantry-only', pantryCount: pantryFoods.length, extraCount: 0 };
    }
    if (pantryFoods.length >= 8) {
      return { pool: pantryFoods.concat(rest), source: 'pantry-first', pantryCount: pantryFoods.length, extraCount: rest.length };
    }
    return { pool: pantryFoods.concat(rest), source: pantryFoods.length ? 'pantry-plus' : 'db', pantryCount: pantryFoods.length, extraCount: rest.length };
  }

  function buildMenu() {
    const a = computeAssessment();
    if (!a || !a.ok) return null;
    const cand = candidatePool();
    const p = activeProfile();
    const mp = C.mealPlan(p.diet.mealStructure, a.daily.intake, a.macros, { trainDay: ui.menuTrainDay });
    const menu = C.buildDailyMenu({ pool: cand.pool, mealPlanData: mp, seed: ui.menuSeed, pantryFirst: cand.pantryCount > 0 });
    if (!menu) return null;
    menu.dayTarget = a.daily.intake;
    menu.poolInfo = cand;
    applyMenuEdits(menu, cand.pool);
    return menu;
  }

  function applyMenuEdits(menu, pool) {
    if (!menu) return menu;
    Object.keys(ui.menuEdits).forEach((key) => {
      const [mealKey, foodId] = key.split('|');
      const meal = menu.meals.find((m) => m.key === mealKey);
      if (!meal) return;
      const grams = ui.menuEdits[key];
      const item = meal.items.find((it) => it.foodId === foodId);
      if (!item) return;
      const food = pool.find((f) => f.id === foodId) || foodById(foodId);
      if (!food) return;
      if (grams <= 0) {
        meal.items = meal.items.filter((it) => it.foodId !== foodId);
      } else {
        const m = C.foodMacros(food, grams);
        item.grams = grams;
        item.kcal = Math.round(m.kcal);
        item.protein = C.round(m.protein, 1);
        item.fat = C.round(m.fat, 1);
        item.carb = C.round(m.carb, 1);
      }
    });
    // 重算各餐与全天合计
    menu.totals = { kcal: 0, protein: 0, fat: 0, carb: 0, fiber: 0 };
    menu.meals.forEach((meal) => {
      const poolMap = new Map(pool.map((f) => [f.id, f]));
      const t = { kcal: 0, protein: 0, fat: 0, carb: 0, fiber: 0 };
      meal.items.forEach((it) => {
        const food = poolMap.get(it.foodId) || foodById(it.foodId);
        if (food) {
          const m = C.foodMacros(food, it.grams);
          t.kcal += m.kcal; t.protein += m.protein; t.fat += m.fat; t.carb += m.carb; t.fiber += m.fiber;
        }
      });
      meal.totals = { kcal: Math.round(t.kcal), protein: C.round(t.protein, 1), fat: C.round(t.fat, 1), carb: C.round(t.carb, 1), fiber: C.round(t.fiber, 1) };
      menu.totals.kcal += meal.totals.kcal;
      menu.totals.protein += meal.totals.protein;
      menu.totals.fat += meal.totals.fat;
      menu.totals.carb += meal.totals.carb;
      menu.totals.fiber += meal.totals.fiber;
    });
    Object.keys(menu.totals).forEach((k) => { menu.totals[k] = C.round(menu.totals[k], 1); });
    return menu;
  }

  function getLog(date) {
    const pid = state.activeProfileId;
    state.logs[pid] = state.logs[pid] || {};
    const d = date || ui.logDate;
    if (!state.logs[pid][d]) {
      state.logs[pid][d] = { meals: {}, exercise: [], water: null, steps: null, sleep: null, weightKg: null, bodyFatPct: null, waistCm: null };
    }
    return state.logs[pid][d];
  }

  function logTotals(log) {
    const t = { kcal: 0, protein: 0, fat: 0, carb: 0, fiber: 0, exerciseKcal: 0 };
    Object.keys(log.meals || {}).forEach((k) => {
      (log.meals[k] || []).forEach((it) => {
        t.kcal += it.kcal || 0; t.protein += it.protein || 0; t.fat += it.fat || 0;
        t.carb += it.carb || 0; t.fiber += it.fiber || 0;
      });
    });
    (log.exercise || []).forEach((ex) => { t.exerciseKcal += ex.kcal || 0; });
    Object.keys(t).forEach((k) => { t[k] = C.round(t[k], 1); });
    return t;
  }

  function todayBudget(a, log) {
    const ratio = state.settings.eatBackRatio;
    const ex = logTotals(log).exerciseKcal;
    return C.dayCalorieBudget(a.daily.intake, ex, ratio);
  }

  function buildTrend() {
    const pid = state.activeProfileId;
    const a = computeAssessment();
    const list = (state.weighIns[pid] || []).slice().sort((x, y) => (x.date < y.date ? -1 : 1));
    const count = list.length;
    const ma = C.movingAverage(list, 7);
    const target = a && a.input.goal.targetWeightKg ? a.input.goal.targetWeightKg : null;
    const expectedWeekly = a ? a.intakePlan.weeklyKg : 0.5;
    const plateau = count >= 14 ? C.plateauAnalysis(list, expectedWeekly) : null;
    const reg = count >= 5 ? C.linreg(list.slice(-14)) : null;

    // 最近 7 天打卡
    const rows = [];
    for (let i = 6; i >= 0; i--) {
      const date = todayISO(-i);
      const log = (state.logs[pid] || {})[date];
      if (!log) continue;
      const t = logTotals(log);
      const trend = log.weightKg != null ? log.weightKg : null;
      rows.push({
        date: date.slice(5), fullDate: date,
        weightKg: trend, intake: t.kcal, exercise: t.exerciseKcal,
        deficit: a ? C.dayCalorieBudget(a.tdee.value, t.exerciseKcal, state.settings.eatBackRatio) - t.kcal : 0,
        steps: log.steps, sleep: log.sleep, water: log.water
      });
    }
    const logRows = Object.keys(state.logs[pid] || {}).sort().slice(-30).map((date) => {
      const log = state.logs[pid][date];
      const t = logTotals(log);
      return {
        date, weightKg: log.weightKg, intake: t.kcal, exercise: t.exerciseKcal,
        deficit: a ? C.dayCalorieBudget(a.tdee.value, t.exerciseKcal, state.settings.eatBackRatio) - t.kcal : 0,
        steps: log.steps, sleep: log.sleep, water: log.water
      };
    }).reverse();

    return {
      count, list, ma,
      ma7: ma.length ? ma[ma.length - 1] : null,
      slope14: reg ? C.round(reg.slopePerWeek, 2) : null,
      plateau, rows, logRows
    };
  }

  /* ------------------------------ 渲染 ------------------------------ */

  function toast(msg, tone) {
    ui.toast = { msg, tone: tone || 'ok', at: Date.now() };
    const el = document.getElementById('toast');
    if (el) {
      el.className = 'toast ' + (tone || 'ok');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add('hidden'), 2600);
    }
  }

  function render() {
    const p = activeProfile();
    cache = { weekly: buildWeekly() };
    const a = computeAssessment();
    const menu = buildMenu();
    cache.menu = menu;
    const log = getLog();
    const totals = logTotals(log);
    const p2 = C.palFromSteps(p.steps);

    const ctx = {
      state, profile: p, a, weekly: cache.weekly, menu,
      pantry: p.pantry || [],
      foodCount: DB_FOODS.length,
      menuTrainDay: ui.menuTrainDay,
      menuHint: menu && menu.poolInfo ? (menu.poolInfo.pantryCount ? `优先使用你勾选的 ${menu.poolInfo.pantryCount} 样现有食材` : '还没有勾选现有食材，食谱用整个食物库生成') : '',
      log, logTotals: totals, logDate: ui.logDate,
      todayBudget: a ? todayBudget(a, log) : 0,
      meals: a ? C.mealPlan(p.diet.mealStructure, a.daily.intake, a.macros, { trainDay: ui.menuTrainDay }).meals : [],
      trend: buildTrend(),
      evidence: DATA.evidence || [],
      evidenceMap: EVIDENCE_MAP,
      guidelines: DATA.guidelines || {},
      metTable: MET_TABLE,
      speedPresets: C.SPEED_PRESETS,
      palLabel: p2.label,
      eatBackRatio: state.settings.eatBackRatio,
      ui,
      savedHint: ui.lastSaved ? `已保存 ${ui.lastSaved}` : '数据只保存在你这台设备的浏览器里'
    };
    cache.ctx = ctx;
    document.documentElement.dataset.theme = state.settings.theme || 'dark';
    document.getElementById('app').innerHTML = V.shell(ctx);
    requestAnimationFrame(() => drawCharts(ctx));
  }

  function drawCharts(ctx) {
    const a = ctx.a;
    if (ui.tab === 'assess' && a) {
      const c = document.getElementById('chart-projection');
      if (c) {
        const pts = a.projection.series.filter((s) => s.day % 7 === 0 || s.day === a.projection.series.length - 1);
        const labels = pts.filter((_, i) => i % 8 === 0).map((s) => ({ x: s.day, label: (s.day / 30.4).toFixed(1) + '月' }));
        CH.lineChart(c, {
          height: 240,
          lines: [{ points: pts.map((s) => ({ x: s.day, y: s.weightKg })), color: CH.PALETTE.weight, fill: 'rgba(74,222,128,0.10)' }],
          annotations: ctx.profile.goal.targetWeightKg ? [{ y: +ctx.profile.goal.targetWeightKg, label: '目标 ' + ctx.profile.goal.targetWeightKg + ' kg', color: CH.PALETTE.target }] : [],
          xLabels: labels, yDigits: 1
        });
      }
    }
    if (ui.tab === 'menu' && ctx.menu) {
      const c = document.getElementById('chart-menu-macros');
      if (c) {
        const t = ctx.menu.totals;
        CH.donut(c, {
          size: 150,
          segments: [
            { label: '蛋白', value: t.protein * 4, color: CH.PALETTE.protein },
            { label: '脂肪', value: t.fat * 9, color: CH.PALETTE.fatMacro },
            { label: '碳水', value: t.carb * 4, color: CH.PALETTE.carb }
          ],
          centerTitle: n0(t.kcal), centerSub: 'kcal'
        });
      }
    }
    if (ui.tab === 'trend') {
      const t = ctx.trend;
      const cw = document.getElementById('chart-weight');
      if (cw) {
        const lines = [];
        if (t.list.length) {
          lines.push({ points: t.list.map((s, i) => ({ x: i, y: s.weightKg })), color: CH.PALETTE.weightRaw, width: 1.5 });
          lines.push({ points: t.list.map((s, i) => ({ x: i, y: t.ma[i] })), color: CH.PALETTE.weight, width: 2.4 });
        }
        // 计划预测：从今天起到 365 天的曲线，与历史拼接在同一条时间轴上
        if (a) {
          const start = t.list.length - 1;
          const proj = a.projection.series.filter((s) => s.day % 7 === 0);
          lines.push({ points: proj.map((s) => ({ x: start + s.day, y: s.weightKg })), color: CH.PALETTE.project, dash: [5, 4], width: 1.5 });
        }
        const labels = t.list.filter((_, i) => i % Math.ceil(t.list.length / 6 || 1) === 0).map((s, i) => ({ x: t.list.indexOf(s), label: s.date.slice(5) }));
        CH.lineChart(cw, {
          height: 280, lines, xLabels: labels, yDigits: 1,
          annotations: ctx.profile.goal.targetWeightKg ? [{ y: +ctx.profile.goal.targetWeightKg, label: '目标', color: CH.PALETTE.target }] : [],
          emptyText: '记录体重后这里会出现趋势：每天称重，用 7 日平均看趋势'
        });
      }
      const ca = document.getElementById('chart-adherence');
      if (ca && a) {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const date = todayISO(-i);
          const log = (state.logs[state.activeProfileId] || {})[date];
          const tot = log ? logTotals(log) : { kcal: 0 };
          const pct = tot.kcal / a.daily.intake;
          days.push({
            label: date.slice(5),
            value: tot.kcal,
            color: tot.kcal === 0 ? 'rgba(255,255,255,0.15)' : (Math.abs(pct - 1) <= 0.08 ? CH.PALETTE.weight : Math.abs(pct - 1) <= 0.15 ? CH.PALETTE.fatMacro : CH.PALETTE.danger)
          });
        }
        CH.bars(ca, { height: 180, bars: days, target: a.daily.intake });
      }
    }
  }

  /* ------------------------------ 表单同步 ------------------------------ */

  function collectForm(form) {
    const fd = new FormData(form);
    const p = activeProfile();
    const num = (k) => (fd.get(k) === '' || fd.get(k) == null ? null : +fd.get(k));
    const checked = (k) => fd.getAll(k).map(String);
    p.name = (fd.get('name') || '我').toString().trim() || '我';
    p.sex = fd.get('sex') || 'male';
    p.age = num('age') || p.age;
    p.heightCm = num('heightCm') || p.heightCm;
    p.weightKg = num('weightKg') || p.weightKg;
    p.bodyFatPct = num('bodyFatPct');
    p.waistCm = num('waistCm');
    p.steps = num('steps') == null ? p.steps : num('steps');
    p.notes = (fd.get('notes') || '').toString();
    p.goal = {
      targetWeightKg: num('goalTargetWeightKg'),
      targetBodyFatPct: num('goalTargetBodyFatPct'),
      deadline: (fd.get('goalDeadline') || '').toString()
    };
    p.route = fd.get('route') || p.route;
    p.speed = fd.get('speed') || p.speed;
    p.train = p.train || {};
    p.train.equipment = checked('equipment');
    p.train.injuries = checked('injuries');
    p.train.gymDaysPerWeek = num('gymDaysPerWeek') == null ? 3 : num('gymDaysPerWeek');
    p.train.sessionMinutes = num('sessionMinutes') || 50;
    p.train.template = fd.get('template') || 'fullbody';
    p.train.tableTennis = {
      sessionsPerWeek: num('ttSessionsPerWeek') == null ? 0 : num('ttSessionsPerWeek'),
      minutesPerSession: num('ttMinutes') || 90,
      intensity: fd.get('ttIntensity') || 'match',
      days: []
    };
    p.diet = {
      mealStructure: fd.get('mealStructure') || '3+1',
      restrictions: checked('restrictions'),
      dislikes: (fd.get('dislikes') || '').split(/[,，]/).map((s) => s.trim()).filter(Boolean),
      freeMeal: fd.get('freeMeal') || 'yes',
      dietBreak: fd.get('dietBreak') || 'yes'
    };
    p.conditions = checked('conditions');
    p.isSample = false;
    return p;
  }

  /* ------------------------------ 事件处理 ------------------------------ */

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const p = activeProfile();

    switch (action) {
      case 'tab':
        ui.tab = el.dataset.tab;
        setHash(ui.tab);
        cache = {};
        render();
        break;

      case 'save-profile': {
        const form = document.getElementById('profile-form');
        if (form) collectForm(form);
        save();
        cache = {};
        ui.lastSaved = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        toast('档案已保存，计划已重算');
        render();
        break;
      }

      case 'menu-shuffle':
        ui.menuSeed++;
        ui.menuEdits = {};
        save();
        render();
        toast('已换一套菜');
        break;

      case 'meal-shuffle': {
        const mealKey = el.dataset.meal;
        const a = computeAssessment();
        const menu = cache.menu;
        if (!a || !menu) break;
        const cand = candidatePool();
        const mp = C.mealPlan(p.diet.mealStructure, a.daily.intake, a.macros, { trainDay: ui.menuTrainDay });
        const target = mp.meals.find((m) => m.key === mealKey);
        if (!target) break;
        const solved = C.solveMeal({
          pool: cand.pool, targetKcal: target.kcal, targetProtein: target.proteinG,
          targetFiber: target.fiberG, seed: ui.menuSeed * 17 + Math.floor(Math.random() * 100000)
        });
        if (!solved) { toast('这一餐凑不出来，试试多勾几样食材', 'bad'); break; }
        const meal = menu.meals.find((m) => m.key === mealKey);
        meal.items = solved.items;
        meal.totals = {
          kcal: Math.round(solved.totals.kcal), protein: C.round(solved.totals.protein, 1),
          fat: C.round(solved.totals.fat, 1), carb: C.round(solved.totals.carb, 1), fiber: C.round(solved.totals.fiber, 1)
        };
        Object.keys(ui.menuEdits).forEach((k) => { if (k.startsWith(mealKey + '|')) delete ui.menuEdits[k]; });
        applyMenuEdits(menu, cand.pool);
        render();
        break;
      }

      case 'menu-drop': {
        const key = el.dataset.meal + '|' + el.dataset.food;
        ui.menuEdits[key] = 0;
        render();
        break;
      }

      case 'menu-to-log': {
        const menu = cache.menu;
        if (!menu) break;
        const log = getLog();
        log.meals = log.meals || {};
        menu.meals.forEach((m) => {
          log.meals[m.key] = m.items.map((it) => ({
            foodId: it.foodId, name: it.name, grams: it.grams,
            kcal: it.kcal, protein: it.protein, fat: it.fat, carb: it.carb, fiber: 0
          }));
        });
        save();
        ui.tab = 'log';
        toast('已把今天这套食谱记入打卡');
        render();
        break;
      }

      case 'shopping-list': {
        const menu = cache.menu;
        const box = document.getElementById('shopping-list');
        if (!menu || !box) break;
        const byCat = {};
        menu.meals.forEach((m) => m.items.forEach((it) => {
          const f = foodById(it.foodId);
          const cat = (f && f.category) || '其他';
          byCat[cat] = byCat[cat] || [];
          byCat[cat].push(`${it.name} ${it.grams}g`);
        }));
        box.className = 'note-block';
        box.innerHTML = '<strong>购物清单（按分类）</strong>' + Object.keys(byCat).map((cat) =>
          `<div class="shop-cat"><b>${esc(cat)}</b><ul class="plain-list">${byCat[cat].map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>`
        ).join('');
        break;
      }

      case 'menu-print':
        window.print();
        break;

      case 'toggle-trainday':
        // 由 change 事件处理
        break;

      case 'food-search': {
        const q = (document.getElementById('food-search') || {}).value || '';
        renderSearchResults(q, 'food-search-results', 'pantry');
        break;
      }

      case 'pantry-add': {
        const id = el.dataset.id;
        if (!p.pantry.some((x) => x.id === id)) {
          const f = foodById(id);
          p.pantry.push({ id, name: f ? f.name : id });
          save();
          toast('已加入现有食材');
          render();
        }
        break;
      }

      case 'pantry-remove': {
        p.pantry = p.pantry.filter((x) => x.id !== el.dataset.id);
        save();
        render();
        break;
      }

      case 'pantry-clear':
        p.pantry = [];
        save();
        render();
        break;

      case 'pantry-browse': {
        const box = document.getElementById('pantry-browse');
        if (!box) break;
        const cats = {};
        DB_FOODS.forEach((f) => { (cats[f.category] = cats[f.category] || []).push(f); });
        box.className = 'browse';
        box.innerHTML = Object.keys(cats).map((cat) => `
          <details class="sub"><summary>${esc(cat)}（${cats[cat].length}）</summary>
            <div class="chips">${cats[cat].map((f) => `<button class="chip ${p.pantry.some((x) => x.id === f.id) ? 'on' : ''}" data-action="pantry-add" data-id="${esc(f.id)}">${esc(f.name)} · ${n0(f.kcal)}kcal</button>`).join('')}</div>
          </details>`).join('');
        break;
      }

      case 'custom-food': {
        const box = document.getElementById('pantry-browse');
        if (!box) break;
        box.className = 'browse';
        box.innerHTML = `
          <div class="custom-food-form">
            <h4>自己输入营养成分（按每 100 g 或每 100 ml 填）</h4>
            <div class="grid grid-3">
              <label class="field"><span class="field-label">名称</span><input id="cf-name" type="text" placeholder="例如：某牌无糖酸奶"></label>
              <label class="field"><span class="field-label">热量 kcal</span><input id="cf-kcal" type="number" step="1"></label>
              <label class="field"><span class="field-label">蛋白 g</span><input id="cf-protein" type="number" step="0.1"></label>
              <label class="field"><span class="field-label">脂肪 g</span><input id="cf-fat" type="number" step="0.1"></label>
              <label class="field"><span class="field-label">碳水 g</span><input id="cf-carb" type="number" step="0.1"></label>
              <label class="field"><span class="field-label">纤维 g</span><input id="cf-fiber" type="number" step="0.1"></label>
              <label class="field"><span class="field-label">常见一份多少 g</span><input id="cf-portion" type="number" step="5" value="100"></label>
              <label class="field"><span class="field-label">分类</span>
                <select id="cf-category">
                  ${['主食', '谷薯杂豆', '畜肉', '禽肉', '水产', '蛋类', '豆制品', '奶及奶制品', '蔬菜', '水果', '坚果种子', '油脂', '调味品', '饮料', '零食甜点', '速食方便', '食堂菜', '外卖快餐', '便利店', '运动营养'].map((c) => `<option>${c}</option>`).join('')}
                </select>
              </label>
            </div>
            <div class="actions"><button class="btn primary" data-action="custom-food-save">保存并加入现有食材</button></div>
            <p class="muted small">填包装上的营养成分表数值即可。热量不一致时按你填的为准。</p>
          </div>`;
        break;
      }

      case 'custom-food-save': {
        const g = (id) => {
          const v = (document.getElementById(id) || {}).value;
          return v === '' || v == null ? null : +v;
        };
        const name = (document.getElementById('cf-name') || {}).value;
        const kcal = g('cf-kcal');
        if (!name || kcal == null) { toast('名称和热量是必填的', 'bad'); break; }
        const id = 'custom_' + Date.now().toString(36);
        p.customFoods = p.customFoods || [];
        p.customFoods.unshift({
          id, name: name.trim(), aliases: [], category: (document.getElementById('cf-category') || {}).value || '其他',
          kcal, protein: g('cf-protein') || 0, fat: g('cf-fat') || 0, carb: g('cf-carb') || 0, fiber: g('cf-fiber') || 0,
          portions: [{ label: '一份', grams: g('cf-portion') || 100 }],
          tags: [], source: '用户自填（包装营养成分表）', confidence: 'user', custom: true
        });
        p.pantry.push({ id, name: name.trim() });
        save();
        toast('已添加自定义食物');
        render();
        break;
      }

      case 'log-search': {
        const q = (document.getElementById('log-food-search') || {}).value || '';
        renderSearchResults(q, 'log-search-results', 'log');
        break;
      }

      case 'log-add': {
        const foodId = el.dataset.id;
        const mealKey = el.dataset.meal || (document.getElementById('log-meal-target') || {}).value || 'breakfast';
        const food = foodById(foodId);
        if (!food) break;
        const grams = el.dataset.grams ? +el.dataset.grams : ((food.portions && food.portions[0] && food.portions[0].grams) || 100);
        addLogItem(mealKey, food, grams);
        break;
      }

      case 'log-remove': {
        const log = getLog();
        const arr = (log.meals || {})[el.dataset.meal] || [];
        arr.splice(+el.dataset.idx, 1);
        save();
        render();
        break;
      }

      case 'log-add-exercise': {
        const sel = document.getElementById('log-activity');
        const min = +(document.getElementById('log-activity-min') || {}).value || 30;
        if (!sel) break;
        const opt = sel.options[sel.selectedIndex];
        const met = +opt.dataset.met;
        const log = getLog();
        log.exercise = log.exercise || [];
        log.exercise.push({
          id: sel.value, name: opt.textContent.replace(/（MET.*?）/, ''), met, minutes: min,
          kcal: C.activityKcal({ met, weightKg: p.weightKg, minutes: min })
        });
        save();
        toast(`已记录：约 ${C.activityKcal({ met, weightKg: p.weightKg, minutes: min })} kcal（原始值）`);
        render();
        break;
      }

      case 'log-remove-exercise': {
        const log = getLog();
        log.exercise.splice(+el.dataset.idx, 1);
        save();
        render();
        break;
      }

      case 'save-log': {
        const log = getLog();
        const val = (id) => {
          const v = (document.getElementById(id) || {}).value;
          return v === '' || v == null ? null : +v;
        };
        log.water = val('log-water');
        log.steps = val('log-steps');
        log.sleep = val('log-sleep');
        log.weightKg = val('log-weight');
        log.bodyFatPct = val('log-bodyfat');
        log.waistCm = val('log-waist');
        // 体重同步进趋势数据
        if (log.weightKg != null) {
          const pid = state.activeProfileId;
          state.weighIns[pid] = state.weighIns[pid] || [];
          const exist = state.weighIns[pid].find((w) => w.date === ui.logDate);
          if (exist) { exist.weightKg = log.weightKg; exist.bodyFatPct = log.bodyFatPct; exist.waistCm = log.waistCm; }
          else state.weighIns[pid].push({ date: ui.logDate, weightKg: log.weightKg, bodyFatPct: log.bodyFatPct, waistCm: log.waistCm });
          state.weighIns[pid].sort((x, y) => (x.date < y.date ? -1 : 1));
          // 用最新体重更新档案，让 TDEE 与目标跟着走
          if (ui.logDate >= todayISO(-1)) {
            p.weightKg = log.weightKg;
            if (log.bodyFatPct != null) p.bodyFatPct = log.bodyFatPct;
          }
        }
        save();
        cache = {};
        toast('今日打卡已保存');
        render();
        break;
      }

      case 'switch-profile':
        state.activeProfileId = el.dataset.id;
        save();
        cache = {};
        render();
        break;

      case 'new-profile': {
        const np = defaultProfile('新档案');
        np.isSample = false;
        state.profiles[np.id] = np;
        state.activeProfileId = np.id;
        save();
        cache = {};
        ui.tab = 'profile';
        render();
        toast('已新建档案，填好数据后点保存');
        break;
      }

      case 'delete-profile': {
        if (Object.keys(state.profiles).length <= 1) { toast('至少保留一个档案', 'bad'); break; }
        if (!confirm('确定删除当前档案？该档案的打卡与体重记录会一起删除。')) break;
        const id = state.activeProfileId;
        delete state.profiles[id];
        delete state.logs[id];
        delete state.weighIns[id];
        state.activeProfileId = Object.keys(state.profiles)[0];
        save();
        cache = {};
        render();
        break;
      }

      case 'export-json': {
        download(`减脂计划备份-${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
        toast('已导出 JSON 备份');
        break;
      }

      case 'export-csv': {
        const pid = state.activeProfileId;
        const rows = [['日期', '体重kg', '体脂%', '摄入kcal', '运动kcal', '步数', '睡眠h', '饮水ml']];
        Object.keys(state.logs[pid] || {}).sort().forEach((date) => {
          const log = state.logs[pid][date];
          const t = logTotals(log);
          rows.push([date, log.weightKg || '', log.bodyFatPct || '', t.kcal, t.exerciseKcal, log.steps || '', log.sleep || '', log.water || '']);
        });
        download(`打卡记录-${todayISO()}.csv`, '\ufeff' + rows.map((r) => r.join(',')).join('\n'), 'text/csv');
        break;
      }

      case 'import-json': {
        const f = document.getElementById('import-file');
        if (f) f.click();
        break;
      }

      case 'save-settings': {
        const t = document.querySelector('select[name="theme"]');
        const r = document.querySelector('select[name="eatBackRatio"]');
        if (t) state.settings.theme = t.value;
        if (r) state.settings.eatBackRatio = +r.value;
        save();
        cache = {};
        toast('设置已保存');
        render();
        break;
      }

      case 'clear-logs': {
        if (!confirm('清空当前档案的所有打卡与体重记录？')) break;
        const pid = state.activeProfileId;
        state.logs[pid] = {};
        state.weighIns[pid] = [];
        save();
        render();
        break;
      }

      case 'factory-reset': {
        if (!confirm('恢复出厂会删除所有档案和数据，确定？')) break;
        localStorage.removeItem(STORE_KEY);
        state = defaultState();
        cache = {};
        save();
        render();
        break;
      }

      case 'dismiss-sample': {
        p.isSample = false;
        save();
        render();
        break;
      }

      default:
        break;
    }
  });

  /* 表单即时同步（切换标签页不丢数据） */
  document.addEventListener('change', (ev) => {
    const form = ev.target.closest('#profile-form');
    if (form) {
      collectForm(form);
      save();
      // 只更新受影响的展示，不整页重绘（避免输入焦点丢失）
      if (ev.target.name === 'speed' || ev.target.name === 'route' || ev.target.name === 'mealStructure') {
        cache = {};
        render();
      } else {
        cache = {};
        const hint = document.querySelector('.sticky-actions .muted');
        if (hint) hint.textContent = '已自动保存草稿，点「保存档案并重新计算」重新生成计划';
      }
      return;
    }
    if (ev.target.id === 'menu-trainday') {
      ui.menuTrainDay = ev.target.checked;
      cache = {};
      render();
    }
    if (ev.target.id === 'pantry-only') {
      state.settings.pantryOnly = ev.target.checked;
      save();
      cache = {};
      render();
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'food-search' || ev.target.id === 'log-food-search') {
      const isLog = ev.target.id === 'log-food-search';
      renderSearchResults(ev.target.value, isLog ? 'log-search-results' : 'food-search-results', isLog ? 'log' : 'pantry');
    }
  });

  document.addEventListener('change', (ev) => {
    if (ev.target.id === 'import-file') {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed.profiles || !parsed.activeProfileId) throw new Error('格式不正确：缺少 profiles');
          state = parsed;
          state.settings = Object.assign({ theme: 'dark', eatBackRatio: 0.5, pantryOnly: false }, state.settings || {});
          save();
          cache = {};
          render();
          toast('导入成功');
        } catch (e) {
          toast('导入失败：' + e.message, 'bad');
        }
      };
      reader.readAsText(file);
    }
  });

  /* 食谱里的克数直接改 */
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.action === 'menu-gram') {
      const key = t.dataset.meal + '|' + t.dataset.food;
      ui.menuEdits[key] = +t.value;
      const menu = cache.menu;
      const cand = candidatePool();
      if (menu) { applyMenuEdits(menu, cand.pool); save(); render(); }
    }
    if (t.dataset && t.dataset.action === 'log-gram') {
      const log = getLog();
      const arr = (log.meals || {})[t.dataset.meal] || [];
      const item = arr[+t.dataset.idx];
      if (item) {
        const food = foodById(item.foodId);
        const grams = +t.value;
        item.grams = grams;
        if (food) {
          const m = C.foodMacros(food, grams);
          item.kcal = Math.round(m.kcal); item.protein = C.round(m.protein, 1);
          item.fat = C.round(m.fat, 1); item.carb = C.round(m.carb, 1); item.fiber = C.round(m.fiber, 1);
        }
        save();
        render();
      }
    }
  });

  function addLogItem(mealKey, food, grams) {
    const log = getLog();
    log.meals = log.meals || {};
    log.meals[mealKey] = log.meals[mealKey] || [];
    const m = C.foodMacros(food, grams);
    log.meals[mealKey].push({
      foodId: food.id, name: food.name, grams,
      kcal: Math.round(m.kcal), protein: C.round(m.protein, 1), fat: C.round(m.fat, 1),
      carb: C.round(m.carb, 1), fiber: C.round(m.fiber, 1)
    });
    save();
    toast(`已加入 ${food.name} ${grams}g（${Math.round(m.kcal)} kcal）`);
    render();
  }

  function renderSearchResults(query, containerId, mode) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const q = (query || '').trim();
    if (!q) { box.innerHTML = ''; return; }
    const p = activeProfile();
    const lower = q.toLowerCase();
    const results = allFoods().filter((f) => {
      const hay = (f.name + ' ' + (f.aliases || []).join(' ')).toLowerCase();
      return hay.includes(lower);
    }).filter((f) => mode === 'log' ? !C.foodBlocked(f, p.diet.restrictions || [], []) : true).slice(0, 24);

    if (!results.length) {
      box.innerHTML = `<p class="muted small">没找到「${esc(q)}」。可以点「自己输入营养成分」把包装上的数值填进去。</p>`;
      return;
    }
    const meals = C.mealPlan(p.diet.mealStructure, 2000, { proteinG: 0, fatG: 0, carbG: 0, fiberG: 0 }).meals;
    box.innerHTML = results.map((f) => `
      <div class="search-item">
        <div class="si-main">
          <strong>${esc(f.name)}</strong>
          <span class="muted small">${n0(f.kcal)} kcal/100g · P${n1(f.protein)} F${n1(f.fat)} C${n1(f.carb)} · ${esc(f.category || '')}${f.confidence === 'low' ? ' · 估算值' : ''}</span>
          ${f.source ? `<span class="muted tiny">来源：${esc(f.source)}</span>` : ''}
        </div>
        ${mode === 'pantry'
          ? `<button class="btn tiny ${p.pantry.some((x) => x.id === f.id) ? 'ghost' : ''}" data-action="pantry-add" data-id="${esc(f.id)}">${p.pantry.some((x) => x.id === f.id) ? '已在清单' : '加入现有食材'}</button>`
          : `<div class="si-actions">${meals.map((m) => `<button class="btn tiny" data-action="log-add" data-id="${esc(f.id)}" data-meal="${esc(m.key)}">+ ${esc(m.name)}</button>`).join('')}</div>`}
      </div>`).join('');
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  /* ------------------------------ 启动 ------------------------------ */

  /** 标签页写进 URL hash：可以收藏、分享、用浏览器前进后退，PWA 也能深链 */
  function setHash(tab) {
    try {
      if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
    } catch (e) { /* file:// 下 replaceState 可能受限，忽略即可 */ }
  }

  function readHash() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    return V.TABS.some((t) => t.key === h) ? h : null;
  }

  window.addEventListener('hashchange', () => {
    const h = readHash();
    if (h && h !== ui.tab) {
      ui.tab = h;
      cache = {};
      render();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (cache.ctx) drawCharts(cache.ctx); }, 150);
  });

  // 首次运行时提示这是示例数据
  window.addEventListener('DOMContentLoaded', () => {
    const initial = readHash();
    if (initial) ui.tab = initial;
    render();
    const p = activeProfile();
    if (p.isSample) {
      setTimeout(() => toast('当前是示例档案（男/20岁/175cm/82kg），改成你自己的数据后点保存'), 400);
    }
  });

  // PWA：只在 https 或 localhost 下注册（file:// 打开时不注册，避免报错）
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('Service Worker 注册失败（不影响使用）', e));
    });
  }

  // 暴露给调试用（不改动页面行为）
  window.__FL = { state, ui, cache, computeAssessment, buildMenu, render };
})();

</script>
</body>
</html>
